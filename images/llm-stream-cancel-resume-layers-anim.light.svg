<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" data-theme="light" data-aj-steps="9" data-aj-mode="frames"><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(30,45,37,0.34)"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7862"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8a4e"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4232f"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a35a00"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6aa8"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#646c67"/></marker></defs><desc data-aj-caption="1">事件一个个到：响应开始，接着是 text 增量和工具参数增量。这些 delta 只进 UI 内存，断了可以丢</desc><desc data-aj-caption="2">收到 item 完成：这一段内容和工具调用参数完整了，写成持久事件，它就是以后恢复的确认点</desc><desc data-aj-caption="3">completed 还没来，网络断了：读到 EOF 不等于成功，手里的内容只能存成标 incomplete 的草稿</desc><desc data-aj-caption="4">用户点了“停止”，先做前端取消：不再渲染、不再等待，释放 reader 和连接</desc><desc data-aj-caption="5">前端停了，模型可能还在跑：上游取消要调 API 去停，成没成功得确认</desc><desc data-aj-caption="6">已经发出的工具调用还要拦：没执行的副作用撤掉，已经发生的只能补偿</desc><desc data-aj-caption="7">要续传：服务端保留了事件，就带 Last-Event-ID 重连，从断点之后的事件接着收</desc><desc data-aj-caption="8">否则从最后一个持久确认点（item 完成）发起新请求，工具调用带幂等键，不会重复执行</desc><desc data-aj-caption="9">这次收到了 usage 和 completed，所有 item 校验通过，才把结果作为业务事实单独写入</desc><rect width="960" height="720" rx="14" fill="#f6f7f4"/><text x="40" y="50" font-size="24" font-weight="600" fill="#1b1e1c" text-anchor="start"><tspan x="40" dy="0">流式生成：取消和续传都要分层说清</tspan></text><text x="40" y="80" font-size="16" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="40" dy="0">传输断开、服务端停止、副作用撤销是不同的事；恢复靠持久化的确认点，不靠接回半个字节流</tspan></text><text x="40" y="130" font-size="16" font-weight="600" fill="#646c67" text-anchor="start"><tspan x="40" dy="0">流是有类型的事件</tspan></text><rect data-box-id="b1" x="40" y="142" width="134" height="44" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="107" y="171" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b1"><tspan x="107" dy="0">开始</tspan></text><path d="M174,164 L189,164" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b2" x="189" y="142" width="134" height="44" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="256" y="171" font-size="16" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b2"><tspan x="256" dy="0">text 增量</tspan></text><path d="M323,164 L338,164" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b3" x="338" y="142" width="134" height="44" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="405" y="171" font-size="16" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b3"><tspan x="405" dy="0">工具参数增量</tspan></text><path d="M472,164 L487,164" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b4" x="487" y="142" width="134" height="44" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="554" y="171" font-size="16" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b4"><tspan x="554" dy="0">item 完成</tspan></text><path d="M621,164 L636,164" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b5" x="636" y="142" width="134" height="44" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="703" y="171" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b5"><tspan x="703" dy="0">usage</tspan></text><path d="M770,164 L785,164" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b6" x="785" y="142" width="134" height="44" rx="10" fill="rgba(47,138,78,0.08)" stroke="#2f8a4e" stroke-width="1.5"/><text x="852" y="171" font-size="16" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b6"><tspan x="852" dy="0">completed</tspan></text><text x="40" y="214" font-size="16" font-weight="400" fill="#b4232f" text-anchor="start"><tspan x="40" dy="0">EOF 不等于成功：收到 completed 且 item 都校验通过，才能提交</tspan></text><text x="40" y="254" font-size="16" font-weight="600" fill="#646c67" text-anchor="start"><tspan x="40" dy="0">「停止」其实是三件事</tspan></text><rect data-box-id="b7" x="40" y="266" width="280" height="84" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="180" y="291" font-size="17" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b7"><tspan x="180" dy="0">前端取消</tspan></text><text x="180" y="318.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b7"><tspan x="180" dy="0">不再渲染、不再等待</tspan><tspan x="180" dy="21.6">释放 reader 和连接</tspan></text><rect data-box-id="b8" x="340" y="266" width="280" height="84" rx="10" fill="rgba(163,90,0,0.08)" stroke="#a35a00" stroke-width="1.5"/><text x="480" y="291" font-size="17" font-weight="600" fill="#a35a00" text-anchor="middle" data-box="b8"><tspan x="480" dy="0">上游取消</tspan></text><text x="480" y="318.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b8"><tspan x="480" dy="0">调 API 尝试停模型任务</tspan><tspan x="480" dy="21.6">成没成功要确认</tspan></text><rect data-box-id="b9" x="640" y="266" width="280" height="84" rx="10" fill="rgba(180,35,47,0.08)" stroke="#b4232f" stroke-width="1.5"/><text x="780" y="291" font-size="17" font-weight="600" fill="#b4232f" text-anchor="middle" data-box="b9"><tspan x="780" dy="0">业务撤销</tspan></text><text x="780" y="318.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b9"><tspan x="780" dy="0">拦住未执行的工具副作用</tspan><tspan x="780" dy="21.6">已发生的只能补偿</tspan></text><text x="40" y="390" font-size="16" font-weight="600" fill="#646c67" text-anchor="start"><tspan x="40" dy="0">确认点分四层</tspan></text><rect data-box-id="b10" x="40" y="402" width="430" height="48" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="255" y="433" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b10"><tspan x="255" dy="0">UI 内存：所有 delta，可以丢</tspan></text><rect data-box-id="b11" x="40" y="458" width="430" height="48" rx="10" fill="rgba(163,90,0,0.08)" stroke="#a35a00" stroke-width="1.5"/><text x="255" y="489" font-size="16" font-weight="600" fill="#a35a00" text-anchor="middle" data-box="b11"><tspan x="255" dy="0">临时快照：标 incomplete 的草稿</tspan></text><rect data-box-id="b12" x="40" y="514" width="430" height="48" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="255" y="545" font-size="16" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b12"><tspan x="255" dy="0">持久事件：item 完成 · 工具确认 · 整体完成</tspan></text><rect data-box-id="b13" x="40" y="570" width="430" height="48" rx="10" fill="rgba(47,138,78,0.08)" stroke="#2f8a4e" stroke-width="1.5"/><text x="255" y="601" font-size="16" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b13"><tspan x="255" dy="0">业务事实：验证通过后单独写入</tspan></text><text x="490" y="390" font-size="16" font-weight="600" fill="#646c67" text-anchor="start"><tspan x="490" dy="0">「续传」的三种含义</tspan></text><rect data-box-id="b14" x="490" y="402" width="430" height="64" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="705" y="427.8" font-size="17" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b14"><tspan x="705" dy="0">传输层重连</tspan></text><text x="705" y="455.3" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b14"><tspan x="705" dy="0">服务端保留事件、认 Last-Event-ID 才行</tspan></text><rect data-box-id="b15" x="490" y="476" width="430" height="64" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="705" y="501.8" font-size="17" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b15"><tspan x="705" dy="0">查同一后台任务</tspan></text><text x="705" y="529.3" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b15"><tspan x="705" dy="0">供应商支持时，按任务 ID 重新订阅</tspan></text><rect data-box-id="b16" x="490" y="550" width="430" height="64" rx="10" fill="rgba(47,138,78,0.08)" stroke="#2f8a4e" stroke-width="1.5"/><text x="705" y="575.8" font-size="17" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b16"><tspan x="705" dy="0">应用级恢复</tspan></text><text x="705" y="603.3" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b16"><tspan x="705" dy="0">从确认点发新请求，幂等键防重复</tspan></text><rect data-box-id="n17" x="40" y="640" width="880" height="52" rx="10" fill="rgba(74,120,98,0.08)"/><text x="60" y="672" font-size="17" fill="#3f4642" data-box="n17"><tspan font-weight="600" fill="#1b1e1c">恢复点只认协议事件 ID：</tspan>字节偏移、最后一个 token、UI 上已显示的字，都不可靠。</text><g data-aj-frame="1"><g data-aj-key="ev"><rect x="40" y="142" width="432" height="44" rx="10" fill="none" stroke="#1f6aa8" stroke-width="3.2"/></g><g data-aj-key="tier"><rect x="40" y="402" width="430" height="48" rx="10" fill="none" stroke="#646c67" stroke-width="3.2"/></g></g><g data-aj-frame="2" display="none"><g data-aj-key="ev"><rect x="40" y="142" width="581" height="44" rx="10" fill="none" stroke="#4a7862" stroke-width="3.2"/></g><g data-aj-key="tier"><rect x="40" y="514" width="430" height="48" rx="10" fill="none" stroke="#1f6aa8" stroke-width="3.2"/></g></g><g data-aj-frame="3" display="none"><g data-aj-key="ev"><rect x="40" y="142" width="581" height="44" rx="10" fill="none" stroke="#b4232f" stroke-width="3.2"/></g><g data-aj-key="eof"><rect x="36" y="196" width="600" height="26" rx="10" fill="none" stroke="#b4232f" stroke-width="3.2"/></g><g data-aj-key="tier"><rect x="40" y="458" width="430" height="48" rx="10" fill="none" stroke="#a35a00" stroke-width="3.2"/></g></g><g data-aj-frame="4" display="none"><g data-aj-key="ev"><rect x="40" y="142" width="581" height="44" rx="10" fill="none" stroke="#646c67" stroke-width="3.2"/></g><g data-aj-key="cancel"><rect x="40" y="266" width="280" height="84" rx="10" fill="none" stroke="#a35a00" stroke-width="3.2"/></g></g><g data-aj-frame="5" display="none"><g data-aj-key="ev"><rect x="40" y="142" width="581" height="44" rx="10" fill="none" stroke="#646c67" stroke-width="3.2"/></g><g data-aj-key="cancel"><rect x="340" y="266" width="280" height="84" rx="10" fill="none" stroke="#a35a00" stroke-width="3.2"/></g></g><g data-aj-frame="6" display="none"><g data-aj-key="ev"><rect x="40" y="142" width="581" height="44" rx="10" fill="none" stroke="#646c67" stroke-width="3.2"/></g><g data-aj-key="cancel"><rect x="640" y="266" width="280" height="84" rx="10" fill="none" stroke="#b4232f" stroke-width="3.2"/></g></g><g data-aj-frame="7" display="none"><g data-aj-key="ev"><rect x="40" y="142" width="581" height="44" rx="10" fill="none" stroke="#1f6aa8" stroke-width="3.2"/></g><g data-aj-key="res"><rect x="490" y="402" width="430" height="64" rx="10" fill="none" stroke="#1f6aa8" stroke-width="3.2"/></g></g><g data-aj-frame="8" display="none"><g data-aj-key="ev"><rect x="40" y="142" width="581" height="44" rx="10" fill="none" stroke="#4a7862" stroke-width="3.2"/></g><g data-aj-key="tier"><rect x="40" y="514" width="430" height="48" rx="10" fill="none" stroke="#1f6aa8" stroke-width="3.2"/></g><g data-aj-key="res"><rect x="490" y="550" width="430" height="64" rx="10" fill="none" stroke="#2f8a4e" stroke-width="3.2"/></g></g><g data-aj-frame="9" display="none"><g data-aj-key="ev"><rect x="40" y="142" width="879" height="44" rx="10" fill="none" stroke="#2f8a4e" stroke-width="3.2"/></g><g data-aj-key="tier"><rect x="40" y="570" width="430" height="48" rx="10" fill="none" stroke="#2f8a4e" stroke-width="3.2"/></g></g></svg>