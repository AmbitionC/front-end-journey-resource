<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" data-theme="dark" data-aj-steps="8" data-aj-mode="frames"><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.30)"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c1d4c8"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#87bf9f"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e99497"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6b36a"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92b6cf"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#858a91"/></marker></defs><desc data-aj-caption="1">客户端提交长任务：接口在一个事务里写 job 行和 outbox 事件，马上返回 jobId 42，之后客户端轮询或订阅进度</desc><desc data-aj-caption="2">relay 把 outbox 发到 Broker：消息里只有 jobId、租户、deadline 和 trace，大 payload 留在对象存储</desc><desc data-aj-caption="3">worker-1 收到消息，先用条件更新拿租约，拿到 fencing token 7</desc><desc data-aj-caption="4">执行可重放的计算并在安全点写检查点；发邮件时带上 operationId，供应商那边能去重</desc><desc data-aj-caption="5">结果、检查点和 completed 终态在一个原子操作里落库</desc><desc data-aj-caption="6">偏偏在 ACK 之前断线了：Broker 没收到确认，租约到期后把消息重新投递</desc><desc data-aj-caption="7">worker-2 拿到 token 8，先读 job：已经是 completed，直接 ACK。邮件不会再发一次</desc><desc data-aj-caption="8">另一种情况：执行时遇到 429 限流。先分类再决定，这类瞬态错误退避加 jitter 后重投，有 Retry-After 就听它的</desc><rect width="960" height="600" rx="14" fill="#111214"/><text x="40" y="50" font-size="24" font-weight="600" fill="#f2f3f4" text-anchor="start"><tspan x="40" dy="0">队列与 Worker：任务记录是事实，消息只是唤醒</tspan></text><text x="40" y="80" font-size="16" font-weight="400" fill="#858a91" text-anchor="start"><tspan x="40" dy="0">提交时任务与 outbox 同事务落库；Worker 拿租约执行，副作用和终态落定后才确认消息</tspan></text><path d="M180,182 L205,182" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b1" x="205" y="140" width="215" height="84" rx="10" fill="#222527" stroke="#c1d4c8" stroke-width="1.5"/><text x="312.5" y="165" font-size="17" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b1"><tspan x="312.5" dy="0">提交接口：一个事务</tspan></text><text x="312.5" y="192.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b1"><tspan x="312.5" dy="0">写 job 行 + outbox 事件</tspan><tspan x="312.5" dy="21.6">大 payload 放对象存储</tspan></text><path d="M420,182 L445,182" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b2" x="445" y="140" width="210" height="84" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="550" y="165" font-size="17" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b2"><tspan x="550" dy="0">Broker</tspan></text><text x="550" y="192.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b2"><tspan x="550" dy="0">消息只带 jobId、tenant</tspan><tspan x="550" dy="21.6">deadline、trace context</tspan></text><path d="M655,182 L680,182" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><text x="680" y="128" font-size="16" font-weight="600" fill="#858a91" text-anchor="start"><tspan x="680" dy="0">Worker 按这个顺序</tspan></text><rect data-box-id="b3" x="680" y="140" width="240" height="52" rx="10" fill="rgba(193,212,200,0.12)" stroke="#c1d4c8" stroke-width="1.5"/><text x="800" y="173" font-size="16" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b3"><tspan x="800" dy="0">① 拿租约 + fencing token</tspan></text><path d="M800,192 L800,202" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b4" x="680" y="202" width="240" height="52" rx="10" fill="rgba(193,212,200,0.12)" stroke="#c1d4c8" stroke-width="1.5"/><text x="800" y="235" font-size="16" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b4"><tspan x="800" dy="0">② 可重放计算 · 写检查点</tspan></text><path d="M800,254 L800,264" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b5" x="680" y="264" width="240" height="52" rx="10" fill="rgba(193,212,200,0.12)" stroke="#c1d4c8" stroke-width="1.5"/><text x="800" y="297" font-size="16" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b5"><tspan x="800" dy="0">③ 副作用带 operationId</tspan></text><path d="M800,316 L800,326" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b6" x="680" y="326" width="240" height="52" rx="10" fill="rgba(193,212,200,0.12)" stroke="#c1d4c8" stroke-width="1.5"/><text x="800" y="359" font-size="16" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b6"><tspan x="800" dy="0">④ 原子存结果和终态</tspan></text><path d="M800,378 L800,388" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b7" x="680" y="388" width="240" height="52" rx="10" fill="rgba(135,191,159,0.12)" stroke="#87bf9f" stroke-width="1.5"/><text x="800" y="421" font-size="16" font-weight="600" fill="#87bf9f" text-anchor="middle" data-box="b7"><tspan x="800" dy="0">⑤ 最后才 ACK</tspan></text><path d="M 680 228 H 668 V 352 H 680" fill="none" stroke="#e99497" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M668,290 L655,290" fill="none" stroke="#e99497" stroke-width="1.7" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b8" x="455" y="248" width="200" height="84" rx="10" fill="rgba(214,179,106,0.12)" stroke="#d6b36a" stroke-width="1.5"/><text x="555" y="273" font-size="17" font-weight="600" fill="#d6b36a" text-anchor="middle" data-box="b8"><tspan x="555" dy="0">执行失败：先分类</tspan></text><text x="555" y="300.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b8"><tspan x="555" dy="0">看错误类型</tspan><tspan x="555" dy="21.6">不是一律重试</tspan></text><path d="M 455 290 H 435 M 435 272 V 458" fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1.5"/><path d="M435,272 L415,272" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b9" x="40" y="246" width="375" height="52" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="227.5" y="279" font-size="16" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b9"><tspan x="227.5" dy="0">瞬态 / 限流：退避 + jitter 重投</tspan></text><path d="M435,334 L415,334" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b10" x="40" y="308" width="375" height="52" rx="10" fill="rgba(233,148,151,0.12)" stroke="#e99497" stroke-width="1.5"/><text x="227.5" y="341" font-size="16" font-weight="600" fill="#e99497" text-anchor="middle" data-box="b10"><tspan x="227.5" dy="0">参数 / 权限 / 永久：直接终态，不耗次数</tspan></text><path d="M435,396 L415,396" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b11" x="40" y="370" width="375" height="52" rx="10" fill="rgba(214,179,106,0.12)" stroke="#d6b36a" stroke-width="1.5"/><text x="227.5" y="403" font-size="16" font-weight="600" fill="#d6b36a" text-anchor="middle" data-box="b11"><tspan x="227.5" dy="0">副作用未知：先用 operationId 对账</tspan></text><path d="M435,458 L415,458" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b12" x="40" y="432" width="375" height="52" rx="10" fill="rgba(133,138,145,0.12)" stroke="#858a91" stroke-width="1.5"/><text x="227.5" y="465" font-size="16" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b12"><tspan x="227.5" dy="0">超过次数：进 DLQ 隔离，仍要有人处理</tspan></text><rect data-box-id="n13" x="40" y="512" width="880" height="52" rx="10" fill="rgba(193,212,200,0.12)"/><text x="60" y="544" font-size="17" fill="#b2b5b9" data-box="n13"><tspan font-weight="600" fill="#f2f3f4">ACK 前断线会重投：</tspan>新 Worker 读到 job 已 completed 就直接 ACK，不会再发一次邮件或扣一次款。</text><g data-aj-frame="1"><rect data-box-id="b14" x="40" y="140" width="140" height="84" rx="10" fill="rgba(133,138,145,0.12)" stroke="#858a91" stroke-width="1.5"/><text x="110" y="165" font-size="17" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b14"><tspan x="110" dy="0">客户端</tspan></text><text x="110" y="192.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b14"><tspan x="110" dy="0">jobId 42</tspan><tspan x="110" dy="21.6">queued</tspan></text><g data-aj-key="cur"><rect x="205" y="140" width="215" height="84" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><path d="M180,182 L205,182" fill="none" stroke="#c1d4c8" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/></g><g data-aj-frame="2" display="none"><rect data-box-id="b15" x="40" y="140" width="140" height="84" rx="10" fill="rgba(133,138,145,0.12)" stroke="#858a91" stroke-width="1.5"/><text x="110" y="165" font-size="17" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b15"><tspan x="110" dy="0">客户端</tspan></text><text x="110" y="192.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b15"><tspan x="110" dy="0">jobId 42</tspan><tspan x="110" dy="21.6">queued</tspan></text><g data-aj-key="cur"><rect x="445" y="140" width="210" height="84" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><path d="M420,182 L445,182" fill="none" stroke="#c1d4c8" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/></g><g data-aj-frame="3" display="none"><rect data-box-id="b16" x="40" y="140" width="140" height="84" rx="10" fill="rgba(133,138,145,0.12)" stroke="#858a91" stroke-width="1.5"/><text x="110" y="165" font-size="17" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b16"><tspan x="110" dy="0">客户端</tspan></text><text x="110" y="192.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b16"><tspan x="110" dy="0">jobId 42</tspan><tspan x="110" dy="21.6">running</tspan></text><g data-aj-key="cur"><rect x="680" y="140" width="240" height="52" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><path d="M655,182 L680,182" fill="none" stroke="#c1d4c8" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><text x="680" y="480" font-size="16" font-weight="400" fill="#b2b5b9" text-anchor="start"><tspan x="680" dy="0">worker-1 · token 7</tspan></text></g><g data-aj-frame="4" display="none"><rect data-box-id="b17" x="40" y="140" width="140" height="84" rx="10" fill="rgba(133,138,145,0.12)" stroke="#858a91" stroke-width="1.5"/><text x="110" y="165" font-size="17" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b17"><tspan x="110" dy="0">客户端</tspan></text><text x="110" y="192.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b17"><tspan x="110" dy="0">jobId 42</tspan><tspan x="110" dy="21.6">running</tspan></text><g data-aj-key="cur"><rect x="680" y="264" width="240" height="52" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><text x="680" y="480" font-size="16" font-weight="400" fill="#b2b5b9" text-anchor="start"><tspan x="680" dy="0">worker-1 · token 7</tspan></text></g><g data-aj-frame="5" display="none"><rect data-box-id="b18" x="40" y="140" width="140" height="84" rx="10" fill="rgba(135,191,159,0.12)" stroke="#87bf9f" stroke-width="1.5"/><text x="110" y="165" font-size="17" font-weight="600" fill="#87bf9f" text-anchor="middle" data-box="b18"><tspan x="110" dy="0">客户端</tspan></text><text x="110" y="192.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b18"><tspan x="110" dy="0">jobId 42</tspan><tspan x="110" dy="21.6">completed</tspan></text><g data-aj-key="cur"><rect x="680" y="326" width="240" height="52" rx="10" fill="none" stroke="#87bf9f" stroke-width="3.2"/></g><text x="680" y="480" font-size="16" font-weight="400" fill="#b2b5b9" text-anchor="start"><tspan x="680" dy="0">worker-1 · token 7</tspan></text></g><g data-aj-frame="6" display="none"><rect data-box-id="b19" x="40" y="140" width="140" height="84" rx="10" fill="rgba(135,191,159,0.12)" stroke="#87bf9f" stroke-width="1.5"/><text x="110" y="165" font-size="17" font-weight="600" fill="#87bf9f" text-anchor="middle" data-box="b19"><tspan x="110" dy="0">客户端</tspan></text><text x="110" y="192.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b19"><tspan x="110" dy="0">jobId 42</tspan><tspan x="110" dy="21.6">completed</tspan></text><g data-aj-key="cur"><rect x="680" y="388" width="240" height="52" rx="10" fill="none" stroke="#e99497" stroke-width="3.2"/></g><g data-aj-key="mq"><rect x="445" y="140" width="210" height="84" rx="10" fill="none" stroke="#e99497" stroke-width="3.2"/></g><text x="680" y="480" font-size="16" font-weight="400" fill="#e99497" text-anchor="start"><tspan x="680" dy="0">worker-1 断线，未 ACK</tspan></text></g><g data-aj-frame="7" display="none"><rect data-box-id="b20" x="40" y="140" width="140" height="84" rx="10" fill="rgba(135,191,159,0.12)" stroke="#87bf9f" stroke-width="1.5"/><text x="110" y="165" font-size="17" font-weight="600" fill="#87bf9f" text-anchor="middle" data-box="b20"><tspan x="110" dy="0">客户端</tspan></text><text x="110" y="192.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b20"><tspan x="110" dy="0">jobId 42</tspan><tspan x="110" dy="21.6">completed</tspan></text><g data-aj-key="cur"><rect x="680" y="388" width="240" height="52" rx="10" fill="none" stroke="#87bf9f" stroke-width="3.2"/></g><path d="M655,182 L680,182" fill="none" stroke="#c1d4c8" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><text x="680" y="480" font-size="16" font-weight="400" fill="#87bf9f" text-anchor="start"><tspan x="680" dy="0">worker-2 · token 8 · 直接 ACK</tspan></text></g><g data-aj-frame="8" display="none"><rect data-box-id="b21" x="40" y="140" width="140" height="84" rx="10" fill="rgba(214,179,106,0.12)" stroke="#d6b36a" stroke-width="1.5"/><text x="110" y="165" font-size="17" font-weight="600" fill="#d6b36a" text-anchor="middle" data-box="b21"><tspan x="110" dy="0">客户端</tspan></text><text x="110" y="192.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b21"><tspan x="110" dy="0">jobId 43</tspan><tspan x="110" dy="21.6">retrying</tspan></text><g data-aj-key="cur"><rect x="455" y="248" width="200" height="84" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><g data-aj-key="out"><rect x="40" y="246" width="375" height="52" rx="10" fill="none" stroke="#92b6cf" stroke-width="3.2"/></g><path d="M435,272 L415,272" fill="none" stroke="#92b6cf" stroke-width="1.7" marker-end="url(#m-info)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><text x="680" y="480" font-size="16" font-weight="400" fill="#b2b5b9" text-anchor="start"><tspan x="680" dy="0">worker-3 · 429 限流</tspan></text></g></svg>