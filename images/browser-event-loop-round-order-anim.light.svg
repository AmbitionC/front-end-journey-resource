<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" data-theme="light" data-aj-steps="5"><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(30,45,37,0.34)"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7862"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8a4e"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4232f"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a35a00"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6aa8"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#646c67"/></marker></defs><desc data-aj-caption="1">取出第一个 task：整段脚本本身就是一个 task</desc><desc data-aj-caption="2">执行同步代码：A、F 立刻输出；setTimeout 把 B 排进 task 队列，C 和 E 进 microtask 队列</desc><desc data-aj-caption="3">调用栈空了，清空 microtask：C 执行时又把 D 入队，D 仍在这一轮跑完</desc><desc data-aj-caption="4">宿主决定要不要更新渲染：rAF、样式、布局、绘制</desc><desc data-aj-caption="5">进入下一轮，取出计时器 task：输出 B</desc><rect width="960" height="620" rx="14" fill="#f6f7f4"/><text x="40" y="50" font-size="24" font-weight="600" fill="#1b1e1c" text-anchor="start"><tspan x="40" dy="0">一轮事件循环：task → 清空 microtask → 可能渲染</tspan></text><text x="40" y="80" font-size="16" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="40" dy="0">简化自 HTML 标准；渲染时机由宿主决定，不保证每轮都画，也不保证固定 16.7ms</tspan></text><rect data-panel="1" data-box-id="p1" x="40" y="280" width="458" height="236" rx="10" fill="#ffffff" stroke="rgba(30,45,37,0.34)" stroke-width="1.5"/><rect data-panel="1" data-box-id="p2" x="518" y="280" width="402" height="236" rx="10" fill="#ffffff" stroke="rgba(30,45,37,0.34)" stroke-width="1.5"/><text x="54" y="306" font-size="16" font-weight="400" fill="#646c67" text-anchor="start" data-box="p1"><tspan x="54" dy="0">示例代码</tspan></text><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><text x="60" y="334" font-size="15" font-weight="400" fill="#1b1e1c" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="60" dy="0">console.log('A');</tspan></text><text x="60" y="356" font-size="15" font-weight="400" fill="#1b1e1c" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="60" dy="0">setTimeout(() =&gt; console.log('B'), 0);</tspan></text><text x="60" y="378" font-size="15" font-weight="400" fill="#1b1e1c" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="60" dy="0">queueMicrotask(() =&gt; {</tspan></text><text x="60" y="400" font-size="15" font-weight="400" fill="#1b1e1c" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="60" dy="0">  console.log('C');</tspan></text><text x="60" y="422" font-size="15" font-weight="400" fill="#1b1e1c" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="60" dy="0">  queueMicrotask(() =&gt; console.log('D'));</tspan></text><text x="60" y="444" font-size="15" font-weight="400" fill="#1b1e1c" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="60" dy="0">});</tspan></text><text x="60" y="466" font-size="15" font-weight="400" fill="#1b1e1c" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="60" dy="0">Promise.resolve().then(() =&gt; console.log('E'));</tspan></text><text x="60" y="488" font-size="15" font-weight="400" fill="#1b1e1c" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="60" dy="0">console.log('F');</tspan></text><text x="532" y="306" font-size="16" font-weight="400" fill="#646c67" text-anchor="start" data-box="p2"><tspan x="532" dy="0">实际执行顺序</tspan></text><g data-aj-step="1"><rect data-box-id="b3" x="40" y="116" width="196" height="100" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="138" y="149.9" font-size="19" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b3"><tspan x="138" dy="0">1 取一个 task</tspan></text><text x="138" y="177.9" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b3"><tspan x="138" dy="0">计时器、输入、网络</tspan><tspan x="138" dy="21.6">来自不同 task source</tspan></text></g><g data-aj-step="2"><path d="M236,166 L268,166" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b4" x="268" y="116" width="196" height="100" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="366" y="149.9" font-size="19" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b4"><tspan x="366" dy="0">2 执行 JS</tspan></text><text x="366" y="177.9" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b4"><tspan x="366" dy="0">一直跑到</tspan><tspan x="366" dy="21.6">调用栈为空</tspan></text></g><g data-aj-step="2" data-aj-mode="reveal"><text x="536" y="348" font-size="16" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="536" dy="0">同步代码</tspan></text><rect data-box-id="c5" x="700" y="320" width="48" height="42" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.8"/><text x="724" y="347" font-size="17" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="c5"><tspan x="724" dy="0">A</tspan></text><rect data-box-id="c6" x="748" y="320" width="48" height="42" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.8"/><text x="772" y="347" font-size="17" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="c6"><tspan x="772" dy="0">F</tspan></text></g><g data-aj-step="3"><path d="M464,166 L496,166" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b7" x="496" y="116" width="196" height="100" rx="10" fill="#edefeb" stroke="#4a7862" stroke-width="1.5"/><text x="594" y="149.9" font-size="19" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b7"><tspan x="594" dy="0">3 清空 microtask</tspan></text><text x="594" y="177.9" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b7"><tspan x="594" dy="0">期间新入队的</tspan><tspan x="594" dy="21.6">也在这一轮跑完</tspan></text></g><g data-aj-step="3" data-aj-mode="reveal"><text x="536" y="404" font-size="16" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="536" dy="0">microtask 阶段</tspan></text><rect data-box-id="c8" x="700" y="376" width="48" height="42" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.8"/><text x="724" y="403" font-size="17" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="c8"><tspan x="724" dy="0">C</tspan></text><rect data-box-id="c9" x="748" y="376" width="48" height="42" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.8"/><text x="772" y="403" font-size="17" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="c9"><tspan x="772" dy="0">E</tspan></text><rect data-box-id="c10" x="796" y="376" width="48" height="42" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.8"/><text x="820" y="403" font-size="17" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="c10"><tspan x="820" dy="0">D</tspan></text><text x="536" y="500" font-size="15" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="536" dy="0">D 由 C 入队，仍在同一个 checkpoint 里跑</tspan></text></g><g data-aj-step="4"><path d="M692,166 L724,166" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b11" x="724" y="116" width="196" height="100" rx="10" fill="rgba(163,90,0,0.08)" stroke="#a35a00" stroke-width="1.5" stroke-dasharray="6 5"/><text x="822" y="149.9" font-size="19" font-weight="600" fill="#a35a00" text-anchor="middle" data-box="b11"><tspan x="822" dy="0">4 可能更新渲染</tspan></text><text x="822" y="177.9" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b11"><tspan x="822" dy="0">rAF → 样式</tspan><tspan x="822" dy="21.6">→ 布局 → 绘制</tspan></text></g><g data-aj-step="5"><path d="M822,216 L822,252 L138,252 L138,216" fill="none" stroke="#4a7862" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><text x="480" y="244" font-size="16" font-weight="400" fill="#4a7862" text-anchor="middle"><tspan x="480" dy="0">下一轮</tspan></text></g><g data-aj-step="5" data-aj-mode="reveal"><text x="536" y="460" font-size="16" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="536" dy="0">下一个 task</tspan></text><rect data-box-id="c12" x="700" y="432" width="48" height="42" fill="rgba(163,90,0,0.08)" stroke="#a35a00" stroke-width="1.8"/><text x="724" y="459" font-size="17" font-weight="600" fill="#a35a00" text-anchor="middle" data-box="c12"><tspan x="724" dy="0">B</tspan></text></g><g data-aj-step="5" data-aj-mode="reveal"><rect data-box-id="n13" x="40" y="540" width="880" height="52" rx="10" fill="rgba(74,120,98,0.08)"/><text x="60" y="572" font-size="17" fill="#3f4642" data-box="n13"><tspan font-weight="600" fill="#1b1e1c">输出 A F C E D B：</tspan>microtask 若不停给自己入队，后续 task 和渲染会一直等。</text></g></svg>