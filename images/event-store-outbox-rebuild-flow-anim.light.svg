<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" data-theme="light" data-aj-steps="9" data-aj-mode="frames"><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(30,45,37,0.34)"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7862"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8a4e"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4232f"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a35a00"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6aa8"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#646c67"/></marker></defs><desc data-aj-caption="1">命令 PlaceOrder 进来：先过业务规则，库存不够之类的可能直接被拒，被拒就不产生事件</desc><desc data-aj-caption="2">事件溯源系统：带 expectedVersion = 4 条件追加 e-101。别人抢先写了版本 5，就重读再判断，不会覆盖</desc><desc data-aj-caption="3">普通 CRUD 系统走 outbox：订单行和 outbox 行在同一个事务里提交，relay 事后再把 outbox 发出去，不会“库写了消息没发”</desc><desc data-aj-caption="4">消息系统只保证至少一次：网络抖动后 e-101 被投了两遍，顺序也不保证</desc><desc data-aj-caption="5">投影第一次处理 e-101：读模型、checkpoint、已处理 eventId 在同一事务写入；第二次来时查到 eventId 已处理，直接跳过</desc><desc data-aj-caption="6">发邮件这类副作用消费者：按 operationId 查幂等账本，重复投递也只发一封</desc><desc data-aj-caption="7">要改读模型结构时重建：开一条隔离的回放通道，从第一条事件开始重放，写进新表 orders_v2，线上表不动</desc><desc data-aj-caption="8">回放追上后接上实时增量，再校验行数和业务摘要：对得上才算重建成功</desc><desc data-aj-caption="9">最后把读别名原子地切到 v2。整个过程副作用消费者没接回放通道：重建不会再发一次邮件或再扣一次款</desc><rect width="960" height="640" rx="14" fill="#f6f7f4"/><text x="40" y="50" font-size="24" font-weight="600" fill="#1b1e1c" text-anchor="start"><tspan x="40" dy="0">事件存储、outbox 与投影：各管一段</tspan></text><text x="40" y="80" font-size="16" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="40" dy="0">事件存储记事实，outbox 保证记录与业务同提交，消息只负责投递，投影要自己幂等</tspan></text><rect data-panel="1" data-box-id="p7" x="40" y="360" width="880" height="150" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><rect data-box-id="b1" x="40" y="175" width="150" height="84" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="115" y="200" font-size="17" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b1"><tspan x="115" dy="0">命令</tspan></text><text x="115" y="227.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b1"><tspan x="115" dy="0">PlaceOrder</tspan><tspan x="115" dy="21.6">可能被拒绝</tspan></text><rect data-box-id="b2" x="240" y="120" width="220" height="84" rx="10" fill="#edefeb" stroke="#4a7862" stroke-width="1.5"/><text x="350" y="145" font-size="17" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b2"><tspan x="350" dy="0">事件存储</tspan></text><text x="350" y="172.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b2"><tspan x="350" dy="0">expectedVersion 条件追加</tspan><tspan x="350" dy="21.6">冲突就重读再判</tspan></text><rect data-box-id="b3" x="240" y="230" width="220" height="84" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="350" y="255" font-size="17" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b3"><tspan x="350" dy="0">业务表 + outbox 行</tspan></text><text x="350" y="282.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b3"><tspan x="350" dy="0">同一事务提交</tspan><tspan x="350" dy="21.6">relay / CDC 再发布</tspan></text><path d="M190,217 L215,217 L215,162 L240,162" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><path d="M215,217 L215,272 L240,272" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b4" x="510" y="175" width="180" height="84" rx="10" fill="rgba(163,90,0,0.08)" stroke="#a35a00" stroke-width="1.5"/><text x="600" y="200" font-size="17" font-weight="600" fill="#a35a00" text-anchor="middle" data-box="b4"><tspan x="600" dy="0">消息 / 订阅</tspan></text><text x="600" y="227.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b4"><tspan x="600" dy="0">至少一次</tspan><tspan x="600" dy="21.6">可能重复、乱序</tspan></text><path d="M460,162 L485,162 L485,217 L510,217" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><path d="M460,272 L485,272 L485,217" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b5" x="740" y="120" width="180" height="84" rx="10" fill="rgba(47,138,78,0.08)" stroke="#2f8a4e" stroke-width="1.5"/><text x="830" y="145" font-size="17" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b5"><tspan x="830" dy="0">投影</tspan></text><text x="830" y="172.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b5"><tspan x="830" dy="0">checkpoint + eventId</tspan><tspan x="830" dy="21.6">与读模型同事务</tspan></text><rect data-box-id="b6" x="740" y="230" width="180" height="84" rx="10" fill="rgba(163,90,0,0.08)" stroke="#a35a00" stroke-width="1.5"/><text x="830" y="255" font-size="17" font-weight="600" fill="#a35a00" text-anchor="middle" data-box="b6"><tspan x="830" dy="0">副作用消费者</tspan></text><text x="830" y="282.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b6"><tspan x="830" dy="0">邮件 / 支付 / Webhook</tspan><tspan x="830" dy="21.6">查 operationId 账本</tspan></text><path d="M690,217 L715,217 L715,162 L740,162" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><path d="M715,217 L715,272 L740,272" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><text x="54" y="386" font-size="16" font-weight="400" fill="#646c67" text-anchor="start" data-box="p7"><tspan x="54" dy="0">重建：走隔离的回放通道，不清空线上表</tspan></text><rect data-box-id="b8" x="60" y="404" width="152" height="64" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="136" y="429.4" font-size="16" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b8"><tspan x="136" dy="0">从起点回放</tspan></text><text x="136" y="456.6" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b8"><tspan x="136" dy="0">事件存储</tspan></text><path d="M212,436 L232,436" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b9" x="232" y="404" width="152" height="64" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="308" y="429.4" font-size="16" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b9"><tspan x="308" dy="0">写新投影</tspan></text><text x="308" y="456.6" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b9"><tspan x="308" dy="0">orders_v2</tspan></text><path d="M384,436 L404,436" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b10" x="404" y="404" width="152" height="64" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="480" y="429.4" font-size="16" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b10"><tspan x="480" dy="0">追平增量</tspan></text><text x="480" y="456.6" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b10"><tspan x="480" dy="0">接上实时流</tspan></text><path d="M556,436 L576,436" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b11" x="576" y="404" width="152" height="64" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="652" y="429.4" font-size="16" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b11"><tspan x="652" dy="0">校验</tspan></text><text x="652" y="456.6" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b11"><tspan x="652" dy="0">行数 + 业务摘要</tspan></text><path d="M728,436 L748,436" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b12" x="748" y="404" width="152" height="64" rx="10" fill="rgba(47,138,78,0.08)" stroke="#2f8a4e" stroke-width="1.5"/><text x="824" y="429.4" font-size="16" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b12"><tspan x="824" dy="0">原子切换</tspan></text><text x="824" y="456.6" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b12"><tspan x="824" dy="0">读别名指向 v2</tspan></text><text x="480" y="494" font-size="15" font-weight="400" fill="#b4232f" text-anchor="middle"><tspan x="480" dy="0">副作用消费者默认不接回放通道：重建不能再发一次邮件或再扣一次款</tspan></text><rect data-box-id="n13" x="40" y="540" width="880" height="52" rx="10" fill="rgba(74,120,98,0.08)"/><text x="60" y="572" font-size="17" fill="#3f4642" data-box="n13"><tspan font-weight="600" fill="#1b1e1c">快照只是性能优化：</tspan>存状态和最后版本号，之后只重放增量；坏了或过期就回到完整事件流。</text><g data-aj-frame="1"><g data-aj-key="cur"><rect x="40" y="175" width="150" height="84" rx="10" fill="none" stroke="#a35a00" stroke-width="3.2"/></g></g><g data-aj-frame="2" display="none"><g data-aj-key="cur"><rect x="240" y="120" width="220" height="84" rx="10" fill="none" stroke="#a35a00" stroke-width="3.2"/></g><path d="M190,217 L215,217 L215,162 L240,162" fill="none" stroke="#a35a00" stroke-width="1.7" marker-end="url(#m-warn)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><g data-aj-key="ev"><rect data-box-id="b14" x="260" y="322" width="180" height="30" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="350" y="343.5" font-size="15" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b14"><tspan x="350" dy="0">e-101 OrderPlaced</tspan></text></g></g><g data-aj-frame="3" display="none"><g data-aj-key="cur"><rect x="240" y="230" width="220" height="84" rx="10" fill="none" stroke="#a35a00" stroke-width="3.2"/></g><path d="M460,272 L485,272 L485,217 L510,217" fill="none" stroke="#a35a00" stroke-width="1.7" marker-end="url(#m-warn)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><g data-aj-key="ev"><rect data-box-id="b15" x="260" y="322" width="180" height="30" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="350" y="343.5" font-size="15" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b15"><tspan x="350" dy="0">outbox 行 e-101</tspan></text></g></g><g data-aj-frame="4" display="none"><g data-aj-key="cur"><rect x="510" y="175" width="180" height="84" rx="10" fill="none" stroke="#a35a00" stroke-width="3.2"/></g><g data-aj-key="ev"><rect data-box-id="b16" x="510" y="322" width="180" height="30" rx="10" fill="rgba(163,90,0,0.08)" stroke="#a35a00" stroke-width="1.5"/><text x="600" y="343.5" font-size="15" font-weight="600" fill="#a35a00" text-anchor="middle" data-box="b16"><tspan x="600" dy="0">e-101 ×2（重复）</tspan></text></g></g><g data-aj-frame="5" display="none"><g data-aj-key="cur"><rect x="740" y="120" width="180" height="84" rx="10" fill="none" stroke="#2f8a4e" stroke-width="3.2"/></g><path d="M690,217 L715,217 L715,162 L740,162" fill="none" stroke="#2f8a4e" stroke-width="1.7" marker-end="url(#m-ok)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><g data-aj-key="ev"><rect data-box-id="b17" x="740" y="322" width="180" height="30" rx="10" fill="rgba(47,138,78,0.08)" stroke="#2f8a4e" stroke-width="1.5"/><text x="830" y="343.5" font-size="15" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b17"><tspan x="830" dy="0">第 2 次：已处理，跳过</tspan></text></g></g><g data-aj-frame="6" display="none"><g data-aj-key="cur"><rect x="740" y="230" width="180" height="84" rx="10" fill="none" stroke="#a35a00" stroke-width="3.2"/></g><path d="M715,217 L715,272 L740,272" fill="none" stroke="#a35a00" stroke-width="1.7" marker-end="url(#m-warn)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><g data-aj-key="ev"><rect data-box-id="b18" x="740" y="322" width="180" height="30" rx="10" fill="rgba(47,138,78,0.08)" stroke="#2f8a4e" stroke-width="1.5"/><text x="830" y="343.5" font-size="15" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b18"><tspan x="830" dy="0">op-mail-101 已发过</tspan></text></g></g><g data-aj-frame="7" display="none"><g data-aj-key="cur"><rect x="60" y="404" width="152" height="64" rx="10" fill="none" stroke="#a35a00" stroke-width="3.2"/></g><g data-aj-key="nx"><rect x="232" y="404" width="152" height="64" rx="10" fill="none" stroke="#1f6aa8" stroke-width="3.2"/></g></g><g data-aj-frame="8" display="none"><g data-aj-key="cur"><rect x="404" y="404" width="152" height="64" rx="10" fill="none" stroke="#a35a00" stroke-width="3.2"/></g><g data-aj-key="nx"><rect x="576" y="404" width="152" height="64" rx="10" fill="none" stroke="#1f6aa8" stroke-width="3.2"/></g></g><g data-aj-frame="9" display="none"><g data-aj-key="cur"><rect x="748" y="404" width="152" height="64" rx="10" fill="none" stroke="#2f8a4e" stroke-width="3.2"/></g><g data-aj-key="nx"><rect x="196" y="478" width="568" height="24" rx="10" fill="none" stroke="#b4232f" stroke-width="3.2"/></g></g></svg>