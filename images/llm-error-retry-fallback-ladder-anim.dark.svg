<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" data-theme="dark" data-aj-steps="9" data-aj-mode="frames"><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.30)"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c1d4c8"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#87bf9f"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e99497"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6b36a"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92b6cf"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#858a91"/></marker></defs><desc data-aj-caption="1">请求一进来就定一个总 deadline，比如 20 秒；后面的每次重试和降级都从这同一个预算里扣</desc><desc data-aj-caption="2">返回 400：请求本身有问题，重试多少次结果都一样。不重试，修正请求</desc><desc data-aj-caption="3">返回 429：被限流了。按响应里的 Retry-After 等够时间再试，不要立刻重打</desc><desc data-aj-caption="4">返回 503：瞬时故障，有界指数退避加随机抖动再试。每次尝试一个新 attempt_id，但继承同一个绝对 deadline</desc><desc data-aj-caption="5">第三次超时了：结果未知，可能已经生成、甚至已经调了工具。先按 tool_operation_id 查状态，别盲目再发</desc><desc data-aj-caption="6">重试预算花完，准备降级：先过硬门禁，数据能不能发给备用供应商、区域合不合规、Schema 和质量够不够</desc><desc data-aj-caption="7">门禁通过，沿阶梯往下走：同供应商的其他部署也不健康，跳过</desc><desc data-aj-caption="8">换到评测通过的备用模型：调用成功，在剩余预算内返回结果</desc><desc data-aj-caption="9">要是备用模型也不行，就继续关掉非关键功能、返回缓存或转异步；都不行时清楚地失败，让用户稍后重试</desc><rect width="960" height="690" rx="14" fill="#111214"/><text x="40" y="50" font-size="24" font-weight="600" fill="#f2f3f4" text-anchor="start"><tspan x="40" dy="0">大模型调用出错：先分类，再在预算内重试或降级</tspan></text><text x="40" y="80" font-size="16" font-weight="400" fill="#858a91" text-anchor="start"><tspan x="40" dy="0">不是所有错误都该重试；可靠性是一条受预算和安全门禁约束的阶梯</tspan></text><text x="40" y="130" font-size="16" font-weight="600" fill="#858a91" text-anchor="start"><tspan x="40" dy="0">先分类：谁能修，值不值得重试</tspan></text><rect data-box-id="b1" x="40" y="144" width="170" height="48" rx="10" fill="#222527" stroke="#858a91" stroke-width="1.5"/><text x="125" y="175.4" font-size="17" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b1"><tspan x="125" dy="0">请求错误</tspan></text><path d="M210,168 L230,168" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b2" x="230" y="144" width="250" height="48" rx="10" fill="rgba(233,148,151,0.12)" stroke="#e99497" stroke-width="1.5"/><text x="355" y="175" font-size="16" font-weight="600" fill="#e99497" text-anchor="middle" data-box="b2"><tspan x="355" dy="0">不重试，修正请求</tspan></text><rect data-box-id="b3" x="40" y="200" width="170" height="48" rx="10" fill="#222527" stroke="#858a91" stroke-width="1.5"/><text x="125" y="231.4" font-size="17" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b3"><tspan x="125" dy="0">身份与权限</tspan></text><path d="M210,224 L230,224" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b4" x="230" y="200" width="250" height="48" rx="10" fill="rgba(233,148,151,0.12)" stroke="#e99497" stroke-width="1.5"/><text x="355" y="231" font-size="16" font-weight="600" fill="#e99497" text-anchor="middle" data-box="b4"><tspan x="355" dy="0">不重试，告警或重新授权</tspan></text><rect data-box-id="b5" x="40" y="256" width="170" height="48" rx="10" fill="#222527" stroke="#858a91" stroke-width="1.5"/><text x="125" y="287.4" font-size="17" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b5"><tspan x="125" dy="0">资源与策略</tspan></text><path d="M210,280 L230,280" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b6" x="230" y="256" width="250" height="48" rx="10" fill="rgba(214,179,106,0.12)" stroke="#d6b36a" stroke-width="1.5"/><text x="355" y="287" font-size="16" font-weight="600" fill="#d6b36a" text-anchor="middle" data-box="b6"><tspan x="355" dy="0">换能力或安全失败</tspan></text><rect data-box-id="b7" x="40" y="312" width="170" height="48" rx="10" fill="#222527" stroke="#858a91" stroke-width="1.5"/><text x="125" y="343.4" font-size="17" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b7"><tspan x="125" dy="0">限流 429</tspan></text><path d="M210,336 L230,336" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b8" x="230" y="312" width="250" height="48" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="355" y="343" font-size="16" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b8"><tspan x="355" dy="0">遵守 Retry-After 再试</tspan></text><rect data-box-id="b9" x="40" y="368" width="170" height="48" rx="10" fill="#222527" stroke="#858a91" stroke-width="1.5"/><text x="125" y="399.4" font-size="17" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b9"><tspan x="125" dy="0">瞬时 5xx</tspan></text><path d="M210,392 L230,392" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b10" x="230" y="368" width="250" height="48" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="355" y="399" font-size="16" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b10"><tspan x="355" dy="0">有界退避 + 抖动重试</tspan></text><rect data-box-id="b11" x="40" y="424" width="170" height="48" rx="10" fill="#222527" stroke="#858a91" stroke-width="1.5"/><text x="125" y="455.4" font-size="17" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b11"><tspan x="125" dy="0">超时 / 断线</tspan></text><path d="M210,448 L230,448" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b12" x="230" y="424" width="250" height="48" rx="10" fill="rgba(214,179,106,0.12)" stroke="#d6b36a" stroke-width="1.5"/><text x="355" y="455" font-size="16" font-weight="600" fill="#d6b36a" text-anchor="middle" data-box="b12"><tspan x="355" dy="0">结果未知：先查状态</tspan></text><rect data-box-id="b13" x="40" y="496" width="440" height="84" rx="10" fill="rgba(133,138,145,0.12)" stroke="#858a91" stroke-width="1.5"/><text x="260" y="521" font-size="17" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b13"><tspan x="260" dy="0">四种 ID 分开记</tspan></text><text x="260" y="548.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b13"><tspan x="260" dy="0">logical_request_id · attempt_id</tspan><tspan x="260" dy="21.6">tool_operation_id · provider_request_id</tspan></text><text x="520" y="130" font-size="16" font-weight="600" fill="#858a91" text-anchor="start"><tspan x="520" dy="0">重试和降级都在同一个预算里</tspan></text><rect data-box-id="b14" x="520" y="144" width="400" height="84" rx="10" fill="#222527" stroke="#c1d4c8" stroke-width="1.5"/><text x="720" y="169" font-size="17" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b14"><tspan x="720" dy="0">总 deadline，例如 20s</tspan></text><text x="720" y="196.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b14"><tspan x="720" dy="0">连接 2s · 首 token 8s · 空闲 5s</tspan><tspan x="720" dy="21.6">每次重试继承同一个绝对 deadline</tspan></text><path d="M720,228 L720,248" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b15" x="520" y="248" width="400" height="84" rx="10" fill="rgba(214,179,106,0.12)" stroke="#d6b36a" stroke-width="1.5"/><text x="720" y="273" font-size="17" font-weight="600" fill="#d6b36a" text-anchor="middle" data-box="b15"><tspan x="720" dy="0">降级前先过硬门禁</tspan></text><text x="720" y="300.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b15"><tspan x="720" dy="0">数据能否发往备用供应商 · 区域合规</tspan><tspan x="720" dy="21.6">工具、Schema、质量达到最低线</tspan></text><path d="M720,332 L720,352" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b16" x="520" y="352" width="400" height="38" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="720" y="378" font-size="16" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b16"><tspan x="720" dy="0">① 同供应商其他健康部署</tspan></text><rect data-box-id="b17" x="532" y="398" width="388" height="38" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="726" y="424" font-size="16" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b17"><tspan x="726" dy="0">② 评测通过的备用模型</tspan></text><rect data-box-id="b18" x="544" y="444" width="376" height="38" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="732" y="470" font-size="16" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b18"><tspan x="732" dy="0">③ 关掉非关键功能</tspan></text><rect data-box-id="b19" x="556" y="490" width="364" height="38" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="738" y="516" font-size="16" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b19"><tspan x="738" dy="0">④ 缓存的安全信息 / 转异步</tspan></text><rect data-box-id="b20" x="568" y="536" width="352" height="38" rx="10" fill="rgba(233,148,151,0.12)" stroke="#e99497" stroke-width="1.5"/><text x="744" y="562" font-size="16" font-weight="600" fill="#e99497" text-anchor="middle" data-box="b20"><tspan x="744" dy="0">⑤ 清楚失败，允许稍后重试</tspan></text><rect data-box-id="n21" x="40" y="604" width="880" height="52" rx="10" fill="rgba(193,212,200,0.12)"/><text x="60" y="636" font-size="17" fill="#b2b5b9" data-box="n21"><tspan font-weight="600" fill="#f2f3f4">只留一层主重试：</tspan>网关、服务、SDK 各自重试，会把一次请求按乘法放大成重试风暴。</text><g data-aj-frame="1"><g data-aj-key="budget"><rect x="520" y="144" width="400" height="84" rx="10" fill="none" stroke="#c1d4c8" stroke-width="3.2"/></g></g><g data-aj-frame="2" display="none"><g data-aj-key="row"><rect x="40" y="144" width="440" height="48" rx="10" fill="none" stroke="#e99497" stroke-width="3.2"/></g><g data-aj-key="budget"><rect x="520" y="144" width="400" height="84" rx="10" fill="none" stroke="#858a91" stroke-width="3.2"/></g></g><g data-aj-frame="3" display="none"><g data-aj-key="row"><rect x="40" y="312" width="440" height="48" rx="10" fill="none" stroke="#92b6cf" stroke-width="3.2"/></g><g data-aj-key="budget"><rect x="520" y="144" width="400" height="84" rx="10" fill="none" stroke="#c1d4c8" stroke-width="3.2"/></g></g><g data-aj-frame="4" display="none"><g data-aj-key="row"><rect x="40" y="368" width="440" height="48" rx="10" fill="none" stroke="#92b6cf" stroke-width="3.2"/></g><g data-aj-key="budget"><rect x="520" y="144" width="400" height="84" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><g data-aj-key="ids"><rect x="40" y="496" width="440" height="84" rx="10" fill="none" stroke="#92b6cf" stroke-width="3.2"/></g></g><g data-aj-frame="5" display="none"><g data-aj-key="row"><rect x="40" y="424" width="440" height="48" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><g data-aj-key="budget"><rect x="520" y="144" width="400" height="84" rx="10" fill="none" stroke="#e99497" stroke-width="3.2"/></g><g data-aj-key="ids"><rect x="40" y="496" width="440" height="84" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g></g><g data-aj-frame="6" display="none"><g data-aj-key="gate"><rect x="520" y="248" width="400" height="84" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g></g><g data-aj-frame="7" display="none"><g data-aj-key="gate"><rect x="520" y="248" width="400" height="84" rx="10" fill="none" stroke="#87bf9f" stroke-width="3.2"/></g><g data-aj-key="lad"><rect x="520" y="352" width="400" height="38" rx="10" fill="none" stroke="#e99497" stroke-width="3.2"/></g></g><g data-aj-frame="8" display="none"><g data-aj-key="gate"><rect x="520" y="248" width="400" height="84" rx="10" fill="none" stroke="#87bf9f" stroke-width="3.2"/></g><g data-aj-key="lad"><rect x="532" y="398" width="388" height="38" rx="10" fill="none" stroke="#87bf9f" stroke-width="3.2"/></g></g><g data-aj-frame="9" display="none"><g data-aj-key="lad"><rect x="568" y="536" width="352" height="38" rx="10" fill="none" stroke="#e99497" stroke-width="3.2"/></g></g></svg>