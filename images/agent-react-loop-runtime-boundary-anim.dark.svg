<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" data-theme="dark" data-aj-steps="6"><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.30)"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c1d4c8"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#87bf9f"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e99497"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6b36a"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92b6cf"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#858a91"/></marker></defs><desc data-aj-caption="1">Thought：模型根据目标和已有历史，推理下一步该做什么</desc><desc data-aj-caption="2">Action：模型给出工具名和结构化参数，只是提议</desc><desc data-aj-caption="3">运行时接手：校验参数、检查权限、设超时，然后真正执行工具</desc><desc data-aj-caption="4">整理结果：截断、脱敏、标注来源，变成 Observation</desc><desc data-aj-caption="5">把（行动，观察）追加进上下文，带着新信息进入下一轮 Thought</desc><desc data-aj-caption="6">两种停法：模型给出 finish；或运行时发现步数、时间、token 预算耗尽，主动叫停</desc><rect width="960" height="600" rx="14" fill="#111214"/><text x="40" y="50" font-size="24" font-weight="600" fill="#f2f3f4" text-anchor="start"><tspan x="40" dy="0">ReAct：模型提出行动，运行时执行并把观察写回</tspan></text><text x="40" y="80" font-size="16" font-weight="400" fill="#858a91" text-anchor="start"><tspan x="40" dy="0">Thought → Action → Observation 反复交替，直到 finish 或预算耗尽</tspan></text><rect data-frame="1" x="40" y="108" width="490" height="290" rx="14" fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1.4" stroke-dasharray="6 6"/><text x="56" y="134" font-size="16" font-weight="400" fill="#858a91" text-anchor="start"><tspan x="56" dy="0">模型：决定下一步</tspan></text><rect data-frame="1" x="560" y="108" width="360" height="290" rx="14" fill="none" stroke="#92b6cf" stroke-width="1.4" stroke-dasharray="6 6"/><text x="576" y="134" font-size="16" font-weight="400" fill="#858a91" text-anchor="start"><tspan x="576" dy="0">运行时：真正执行与把关</tspan></text><g data-aj-step="1"><rect data-box-id="b1" x="70" y="150" width="200" height="68" rx="10" fill="rgba(193,212,200,0.12)" stroke="#c1d4c8" stroke-width="1.5"/><text x="170" y="178.7" font-size="19" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b1"><tspan x="170" dy="0">Thought 推理</tspan></text><text x="170" y="206.7" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b1"><tspan x="170" dy="0">根据目标和历史选下一步</tspan></text></g><g data-aj-step="2"><path d="M270,184 L330,184" fill="none" stroke="#c1d4c8" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b2" x="330" y="150" width="180" height="68" rx="10" fill="rgba(193,212,200,0.12)" stroke="#c1d4c8" stroke-width="1.5"/><text x="420" y="178.7" font-size="19" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b2"><tspan x="420" dy="0">Action 行动</tspan></text><text x="420" y="206.7" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b2"><tspan x="420" dy="0">工具名 + 结构化参数</tspan></text></g><g data-aj-step="3"><path d="M510,184 L600,184" fill="none" stroke="#c1d4c8" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b3" x="600" y="150" width="280" height="68" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="740" y="178.7" font-size="19" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b3"><tspan x="740" dy="0">执行工具</tspan></text><text x="740" y="206.7" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b3"><tspan x="740" dy="0">校验参数、检查权限、设超时</tspan></text></g><g data-aj-step="4"><path d="M740,218 L740,300" fill="none" stroke="#92b6cf" stroke-width="1.7" marker-end="url(#m-info)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b4" x="600" y="300" width="280" height="68" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="740" y="328.7" font-size="19" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b4"><tspan x="740" dy="0">整理结果</tspan></text><text x="740" y="356.7" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b4"><tspan x="740" dy="0">截断、脱敏、标注来源</tspan></text><path d="M600,334 L510,334" fill="none" stroke="#c1d4c8" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b5" x="330" y="300" width="180" height="68" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="420" y="328.7" font-size="19" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b5"><tspan x="420" dy="0">Observation 观察</tspan></text><text x="420" y="356.7" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b5"><tspan x="420" dy="0">外部系统写入的结果</tspan></text></g><g data-aj-step="5"><path d="M330,334 L270,334" fill="none" stroke="#c1d4c8" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b6" x="70" y="300" width="200" height="68" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="170" y="328.7" font-size="19" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b6"><tspan x="170" dy="0">更新上下文</tspan></text><text x="170" y="356.7" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b6"><tspan x="170" dy="0">追加（行动，观察）</tspan></text><path d="M170,300 L170,218" fill="none" stroke="#c1d4c8" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><text x="182" y="264" font-size="16" font-weight="400" fill="#c1d4c8" text-anchor="start"><tspan x="182" dy="0">下一轮</tspan></text></g><g data-aj-step="6"><rect data-box-id="b7" x="330" y="440" width="160" height="68" rx="10" fill="rgba(214,179,106,0.12)" stroke="#d6b36a" stroke-width="1.5"/><text x="410" y="468.7" font-size="19" font-weight="600" fill="#d6b36a" text-anchor="middle" data-box="b7"><tspan x="410" dy="0">停止</tspan></text><text x="410" y="496.7" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b7"><tspan x="410" dy="0">答案或未完成报告</tspan></text><path d="M70,184 L54,184 L54,474 L330,474" fill="none" stroke="#c1d4c8" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><text x="190" y="464" font-size="16" font-weight="400" fill="#c1d4c8" text-anchor="middle"><tspan x="190" dy="0">模型给出 finish</tspan></text><path d="M740,368 L740,474 L490,474" fill="none" stroke="#d6b36a" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#m-warn)" stroke-linejoin="round" data-aj-arrow="1"/><text x="615" y="464" font-size="16" font-weight="400" fill="#d6b36a" text-anchor="middle"><tspan x="615" dy="0">超预算：步数 / 时间 / token</tspan></text></g><rect data-box-id="n8" x="40" y="528" width="880" height="52" rx="10" fill="rgba(193,212,200,0.12)"/><text x="60" y="560" font-size="17" fill="#b2b5b9" data-box="n8"><tspan font-weight="600" fill="#f2f3f4">Thought 不是接口：</tspan>生产系统记录结构化 Action、Observation 和安全状态，不把详细推理当日志。</text></svg>