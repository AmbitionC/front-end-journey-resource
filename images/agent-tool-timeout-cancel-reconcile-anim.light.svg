<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 676" width="960" height="676" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" data-theme="light" data-aj-steps="9" data-aj-mode="frames"><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(30,45,37,0.34)"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7862"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8a4e"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4232f"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a35a00"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6aa8"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#646c67"/></marker></defs><desc data-aj-caption="1">第 1 次尝试：先算全局还剩多少时间，本次超时取“剩余时间”和“单次上限 4 s”里小的那个</desc><desc data-aj-caption="2">带稳定的 operationId（op-7）调用工具：之后无论重试还是对账，都靠它认出是同一个操作</desc><desc data-aj-caption="3">4 s 到了还没结果：只能说明“没等到”，远端可能失败、可能还在跑、也可能已经做完。先请求取消</desc><desc data-aj-caption="4">取消只是意图，不等于回滚，所以要查 op-7 的真实状态：这次远端确认已取消，没有产生效果</desc><desc data-aj-caption="5">过重试闸门：网络超时是暂时性错误，工具按 operationId 去重，剩 5.7 s、才用了 1 次，四项都满足</desc><desc data-aj-caption="6">退避 0.8 s 再加一点随机抖动，免得一群调用同时重试；等待的时间也算在 deadline 里</desc><desc data-aj-caption="7">第 2 次尝试：剩 4.9 s，仍用同一个 op-7 调用。不换新 ID，远端才能认出这是重试</desc><desc data-aj-caption="8">又超时了。查状态，这次远端说 op-7 已经提交：其实上一轮已经做完，只是响应丢了</desc><desc data-aj-caption="9">不重做，直接取回原结果，照常校验后完成：9.5 s 收尾，副作用只发生了一次</desc><rect width="960" height="676" rx="14" fill="#f6f7f4"/><text x="40" y="50" font-size="24" font-weight="600" fill="#1b1e1c" text-anchor="start"><tspan x="40" dy="0">工具超时：先查清状态，再决定能不能重试</tspan></text><text x="40" y="80" font-size="16" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="40" dy="0">超时只说明这段时间没拿到结果，不说明远端失败，更不说明副作用已回滚</tspan></text><rect data-box-id="b1" x="40" y="116" width="200" height="64" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="140" y="142.7" font-size="19" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b1"><tspan x="140" dy="0">算剩余时间</tspan></text><text x="140" y="170.7" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b1"><tspan x="140" dy="0">deadline − now</tspan></text><rect data-box-id="b2" x="280" y="116" width="200" height="64" rx="10" fill="#edefeb" stroke="#4a7862" stroke-width="1.5"/><text x="380" y="142.7" font-size="19" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b2"><tspan x="380" dy="0">调用工具</tspan></text><text x="380" y="170.7" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b2"><tspan x="380" dy="0">带稳定 operationId</tspan></text><rect data-box-id="b3" x="540" y="116" width="160" height="64" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="620" y="142.7" font-size="19" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b3"><tspan x="620" dy="0">校验结果</tspan></text><text x="620" y="170.7" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b3"><tspan x="620" dy="0">schema、来源</tspan></text><rect data-box-id="b4" x="740" y="116" width="180" height="64" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="830" y="156.3" font-size="19" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b4"><tspan x="830" dy="0">完成</tspan></text><path d="M240,148 L280,148" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><path d="M480,148 L540,148" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><text x="510" y="138" font-size="16" font-weight="400" fill="#4a7862" text-anchor="middle"><tspan x="510" dy="0">成功</tspan></text><path d="M700,148 L740,148" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><path d="M380,180 L380,228" fill="none" stroke="#b4232f" stroke-width="1.7" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1"/><text x="392" y="210" font-size="16" font-weight="400" fill="#b4232f" text-anchor="start"><tspan x="392" dy="0">超时</tspan></text><rect data-box-id="b5" x="280" y="228" width="200" height="64" rx="10" fill="#ffffff" stroke="rgba(30,45,37,0.34)" stroke-width="1.5"/><text x="380" y="254.7" font-size="19" font-weight="600" fill="#1b1e1c" text-anchor="middle" data-box="b5"><tspan x="380" dy="0">请求取消</tspan></text><text x="380" y="282.7" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b5"><tspan x="380" dy="0">只是意图，不是回滚</tspan></text><rect data-box-id="b6" x="540" y="228" width="160" height="64" rx="10" fill="#ffffff" stroke="rgba(30,45,37,0.34)" stroke-width="1.5"/><text x="620" y="254.7" font-size="19" font-weight="600" fill="#1b1e1c" text-anchor="middle" data-box="b6"><tspan x="620" dy="0">查询操作状态</tspan></text><text x="620" y="282.7" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b6"><tspan x="620" dy="0">GET operation/{id}</tspan></text><path d="M480,260 L540,260" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b7" x="740" y="228" width="180" height="64" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="830" y="254.7" font-size="19" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b7"><tspan x="830" dy="0">已提交</tspan></text><text x="830" y="282.7" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b7"><tspan x="830" dy="0">取回原结果，不重做</tspan></text><rect data-box-id="b8" x="740" y="316" width="180" height="64" rx="10" fill="rgba(180,35,47,0.08)" stroke="#b4232f" stroke-width="1.5"/><text x="830" y="342.7" font-size="19" font-weight="600" fill="#b4232f" text-anchor="middle" data-box="b8"><tspan x="830" dy="0">状态未知</tspan></text><text x="830" y="370.7" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b8"><tspan x="830" dy="0">隔离，对账或转人工</tspan></text><rect data-box-id="b9" x="540" y="316" width="160" height="64" rx="10" fill="#ffffff" stroke="rgba(30,45,37,0.34)" stroke-width="1.5"/><text x="620" y="342.7" font-size="19" font-weight="600" fill="#1b1e1c" text-anchor="middle" data-box="b9"><tspan x="620" dy="0">确认已取消</tspan></text><text x="620" y="370.7" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b9"><tspan x="620" dy="0">远端没有产生效果</tspan></text><path d="M700,260 L740,260" fill="none" stroke="#1f6aa8" stroke-width="1.7" marker-end="url(#m-info)" stroke-linejoin="round" data-aj-arrow="1"/><path d="M830,228 L830,204 L620,204 L620,180" fill="none" stroke="#1f6aa8" stroke-width="1.7" marker-end="url(#m-info)" stroke-linejoin="round" data-aj-arrow="1"/><text x="725" y="198" font-size="16" font-weight="400" fill="#1f6aa8" text-anchor="middle"><tspan x="725" dy="0">取回后同样校验</tspan></text><path d="M700,280 L720,280 L720,348 L740,348" fill="none" stroke="#b4232f" stroke-width="1.7" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1"/><path d="M620,292 L620,316" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b10" x="280" y="316" width="200" height="112" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="380" y="345.1" font-size="19" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b10"><tspan x="380" dy="0">重试闸门</tspan></text><text x="380" y="373.1" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b10"><tspan x="380" dy="0">暂时性错误？</tspan><tspan x="380" dy="21.6">幂等或有去重 key？</tspan><tspan x="380" dy="21.6">剩余时间、次数都够？</tspan></text><path d="M540,348 L480,348" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b11" x="40" y="316" width="200" height="64" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="140" y="342.7" font-size="19" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b11"><tspan x="140" dy="0">退避 + jitter</tspan></text><text x="140" y="370.7" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b11"><tspan x="140" dy="0">等待也计入 deadline</tspan></text><path d="M280,348 L240,348" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><path d="M140,316 L140,180" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><text x="152" y="266" font-size="16" font-weight="400" fill="#4a7862" text-anchor="start"><tspan x="152" dy="0">下一次尝试</tspan></text><rect data-box-id="b12" x="280" y="458" width="200" height="52" rx="10" fill="rgba(180,35,47,0.08)" stroke="#b4232f" stroke-width="1.5"/><text x="380" y="491.4" font-size="17" font-weight="600" fill="#b4232f" text-anchor="middle" data-box="b12"><tspan x="380" dy="0">停止或升级</tspan></text><path d="M380,428 L380,458" fill="none" stroke="#b4232f" stroke-width="1.7" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1"/><text x="392" y="446" font-size="16" font-weight="400" fill="#b4232f" text-anchor="start"><tspan x="392" dy="0">任一不满足</tspan></text><rect data-box-id="n13" x="40" y="604" width="880" height="52" rx="10" fill="rgba(74,120,98,0.08)"/><text x="60" y="636" font-size="17" fill="#3f4642" data-box="n13"><tspan font-weight="600" fill="#1b1e1c">迟到结果：</tspan>带 operationId 进对账；同一操作出现冲突结果要报警，不能按最后到达覆盖。</text><g data-aj-frame="1"><g data-aj-key="cur"><rect x="40" y="116" width="200" height="64" rx="10" fill="none" stroke="#a35a00" stroke-width="3.2"/></g><text x="40" y="551" font-size="16" font-weight="600" fill="#1b1e1c" text-anchor="start"><tspan x="40" dy="0">全局 deadline 10 s</tspan></text><rect x="240" y="536" width="680" height="20" rx="5" fill="#ffffff" stroke="rgba(30,45,37,0.13)"/><g data-aj-key="used"><rect x="240" y="536" width="0" height="20" rx="5" fill="#4a7862" fill-opacity="0.55"/></g><text x="240" y="582" font-size="16" font-weight="400" fill="#3f4642" text-anchor="start"><tspan x="240" dy="0">已用 0.0 s · 剩 10.0 s　第 1 次尝试</tspan></text></g><g data-aj-frame="2" display="none"><g data-aj-key="cur"><rect x="280" y="116" width="200" height="64" rx="10" fill="none" stroke="#a35a00" stroke-width="3.2"/></g><path d="M240,148 L280,148" fill="none" stroke="#a35a00" stroke-width="1.7" marker-end="url(#m-warn)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><text x="40" y="551" font-size="16" font-weight="600" fill="#1b1e1c" text-anchor="start"><tspan x="40" dy="0">全局 deadline 10 s</tspan></text><rect x="240" y="536" width="680" height="20" rx="5" fill="#ffffff" stroke="rgba(30,45,37,0.13)"/><g data-aj-key="used"><rect x="240" y="536" width="0" height="20" rx="5" fill="#4a7862" fill-opacity="0.55"/></g><text x="240" y="582" font-size="16" font-weight="400" fill="#3f4642" text-anchor="start"><tspan x="240" dy="0">已用 0.0 s · 剩 10.0 s　调用 op-7，单次超时 4 s</tspan></text></g><g data-aj-frame="3" display="none"><g data-aj-key="cur"><rect x="280" y="228" width="200" height="64" rx="10" fill="none" stroke="#a35a00" stroke-width="3.2"/></g><path d="M380,180 L380,228" fill="none" stroke="#a35a00" stroke-width="1.7" marker-end="url(#m-warn)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><text x="40" y="551" font-size="16" font-weight="600" fill="#1b1e1c" text-anchor="start"><tspan x="40" dy="0">全局 deadline 10 s</tspan></text><rect x="240" y="536" width="680" height="20" rx="5" fill="#ffffff" stroke="rgba(30,45,37,0.13)"/><g data-aj-key="used"><rect x="240" y="536" width="272" height="20" rx="5" fill="#a35a00" fill-opacity="0.55"/></g><text x="240" y="582" font-size="16" font-weight="400" fill="#3f4642" text-anchor="start"><tspan x="240" dy="0">已用 4.0 s · 剩 6.0 s　超时，请求取消</tspan></text></g><g data-aj-frame="4" display="none"><g data-aj-key="cur"><rect x="540" y="316" width="160" height="64" rx="10" fill="none" stroke="#a35a00" stroke-width="3.2"/></g><path d="M480,260 L540,260" fill="none" stroke="#a35a00" stroke-width="1.7" marker-end="url(#m-warn)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><path d="M620,292 L620,316" fill="none" stroke="#a35a00" stroke-width="1.7" marker-end="url(#m-warn)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><text x="40" y="551" font-size="16" font-weight="600" fill="#1b1e1c" text-anchor="start"><tspan x="40" dy="0">全局 deadline 10 s</tspan></text><rect x="240" y="536" width="680" height="20" rx="5" fill="#ffffff" stroke="rgba(30,45,37,0.13)"/><g data-aj-key="used"><rect x="240" y="536" width="292.4" height="20" rx="5" fill="#a35a00" fill-opacity="0.55"/></g><text x="240" y="582" font-size="16" font-weight="400" fill="#3f4642" text-anchor="start"><tspan x="240" dy="0">已用 4.3 s · 剩 5.7 s　查询：op-7 已取消</tspan></text></g><g data-aj-frame="5" display="none"><g data-aj-key="cur"><rect x="280" y="316" width="200" height="112" rx="10" fill="none" stroke="#a35a00" stroke-width="3.2"/></g><path d="M540,348 L480,348" f