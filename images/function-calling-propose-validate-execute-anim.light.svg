<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" data-theme="light" data-aj-steps="7"><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(30,45,37,0.34)"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7862"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8a4e"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4232f"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a35a00"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6aa8"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#646c67"/></marker></defs><desc data-aj-caption="1">应用把用户消息和工具定义一起发给模型</desc><desc data-aj-caption="2">模型只做决定：要不要调工具、调哪个，产出 tool_call（工具名、JSON 参数、call_id）</desc><desc data-aj-caption="3">应用先做三层校验：结构、业务、权限；userId 只认登录态，不认模型给的参数</desc><desc data-aj-caption="4">校验不通过：返回可枚举的错误，模型可以据此改参数重试</desc><desc data-aj-caption="5">校验通过：按风险等级执行，高风险写入要用户确认最终参数</desc><desc data-aj-caption="6">工具结果绑定原 call_id 回到模型，当数据用，不当指令</desc><desc data-aj-caption="7">模型继续调用下一个工具，或者不再调用，给出最终回答</desc><rect width="960" height="660" rx="14" fill="#f6f7f4"/><text x="40" y="50" font-size="24" font-weight="600" fill="#1b1e1c" text-anchor="start"><tspan x="40" dy="0">Function Calling：模型提议，应用校验并执行</tspan></text><text x="40" y="80" font-size="16" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="40" dy="0">一次交互可能循环多轮；Responses API 里的工具结果叫 function_call_output</tspan></text><rect data-frame="1" x="28" y="104" width="284" height="450" rx="14" fill="none" stroke="rgba(30,45,37,0.13)" stroke-width="1.4" stroke-dasharray="6 6"/><text x="44" y="130" font-size="16" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="44" dy="0">模型：只提议</tspan></text><rect data-frame="1" x="336" y="104" width="596" height="450" rx="14" fill="none" stroke="rgba(30,45,37,0.13)" stroke-width="1.4" stroke-dasharray="6 6"/><text x="352" y="130" font-size="16" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="352" dy="0">应用：校验与执行</tspan></text><g data-aj-step="1"><rect data-box-id="b1" x="48" y="140" width="244" height="64" rx="10" fill="#ffffff" stroke="rgba(30,45,37,0.34)" stroke-width="1.5"/><text x="170" y="166.7" font-size="19" font-weight="600" fill="#1b1e1c" text-anchor="middle" data-box="b1"><tspan x="170" dy="0">消息 + 工具定义</tspan></text><text x="170" y="194.7" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b1"><tspan x="170" dy="0">由应用组装后发送</tspan></text><path d="M170,204 L170,240" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/></g><g data-aj-step="2"><rect data-box-id="b2" x="48" y="240" width="244" height="72" rx="10" fill="#edefeb" stroke="#4a7862" stroke-width="1.5"/><text x="170" y="270.7" font-size="19" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b2"><tspan x="170" dy="0">模型</tspan></text><text x="170" y="298.7" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b2"><tspan x="170" dy="0">决定调不调、调哪个</tspan></text><path d="M292,276 L356,276" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b3" x="356" y="240" width="244" height="72" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="478" y="270.7" font-size="19" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b3"><tspan x="478" dy="0">tool_call</tspan></text><text x="478" y="298.7" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b3"><tspan x="478" dy="0">工具名 · JSON 参数 · call_id</tspan></text></g><g data-aj-step="3"><path d="M600,276 L652,276" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b4" x="652" y="140" width="260" height="172" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="782" y="199.1" font-size="19" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b4"><tspan x="782" dy="0">三层校验</tspan></text><text x="782" y="227.1" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b4"><tspan x="782" dy="0">结构：Schema、必填、枚举</tspan><tspan x="782" dy="21.6">业务：订单在、金额不超限</tspan><tspan x="782" dy="21.6">权限：userId 取自 session</tspan></text></g><g data-aj-step="4"><path d="M652,196 L626,196 L626,432 L600,432" fill="none" stroke="#b4232f" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1"/><text x="614" y="392" font-size="16" font-weight="400" fill="#b4232f" text-anchor="end"><tspan x="614" dy="0">不通过：可枚举错误</tspan></text></g><g data-aj-step="5"><path d="M782,312 L782,350" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><text x="794" y="336" font-size="16" font-weight="400" fill="#4a7862" text-anchor="start"><tspan x="794" dy="0">通过</tspan></text><rect data-box-id="b5" x="652" y="350" width="260" height="180" rx="10" fill="rgba(163,90,0,0.08)" stroke="#a35a00" stroke-width="1.5"/><text x="782" y="402.3" font-size="19" font-weight="600" fill="#a35a00" text-anchor="middle" data-box="b5"><tspan x="782" dy="0">按风险执行</tspan></text><text x="782" y="430.3" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b5"><tspan x="782" dy="0">只读：直接执行</tspan><tspan x="782" dy="21.6">可撤销：预览，可撤回</tspan><tspan x="782" dy="21.6">高风险：确认最终参数</tspan><tspan x="782" dy="21.6">都带超时与幂等键</tspan></text></g><g data-aj-step="6"><path d="M652,480 L600,480" fill="none" stroke="#1f6aa8" stroke-width="1.7" marker-end="url(#m-info)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b6" x="356" y="410" width="244" height="92" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="478" y="439.9" font-size="19" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b6"><tspan x="478" dy="0">工具结果</tspan></text><text x="478" y="467.9" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b6"><tspan x="478" dy="0">绑定原 call_id</tspan><tspan x="478" dy="21.6">当数据，不当指令</tspan></text><path d="M400,410 L400,344 L220,344 L220,312" fill="none" stroke="#1f6aa8" stroke-width="1.7" marker-end="url(#m-info)" stroke-linejoin="round" data-aj-arrow="1"/><text x="230" y="372" font-size="16" font-weight="400" fill="#1f6aa8" text-anchor="start"><tspan x="230" dy="0">回传，继续</tspan></text></g><g data-aj-step="7"><path d="M100,312 L100,466" fill="none" stroke="#2f8a4e" stroke-width="1.7" marker-end="url(#m-ok)" stroke-linejoin="round" data-aj-arrow="1"/><text x="110" y="400" font-size="16" font-weight="400" fill="#2f8a4e" text-anchor="start"><tspan x="110" dy="0">不再调用</tspan></text><rect data-box-id="b7" x="48" y="466" width="244" height="64" rx="10" fill="rgba(47,138,78,0.08)" stroke="#2f8a4e" stroke-width="1.5"/><text x="170" y="492.7" font-size="19" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b7"><tspan x="170" dy="0">最终回答</tspan></text><text x="170" y="520.7" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b7"><tspan x="170" dy="0">仍按业务目标验收</tspan></text></g><rect data-box-id="n8" x="40" y="580" width="880" height="52" rx="10" fill="rgba(74,120,98,0.08)"/><text x="60" y="612" font-size="17" fill="#3f4642" data-box="n8"><tspan font-weight="600" fill="#1b1e1c">strict 只约束结构：</tspan>权限只认登录态和服务端数据，不认模型给的参数。</text></svg>