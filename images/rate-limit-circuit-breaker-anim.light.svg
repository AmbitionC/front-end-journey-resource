<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" width="960" height="710" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" data-theme="light" data-aj-steps="7" data-aj-mode="frames"><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(30,45,37,0.34)"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7862"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8a4e"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4232f"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a35a00"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6aa8"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#646c67"/></marker></defs><desc data-aj-caption="1">平时：请求先过限流器，再过处于 Closed 的熔断器，正常到达下游</desc><desc data-aj-caption="2">流量突增，超出容量：限流器直接回 429，挡住的是“太多”，和下游健不健康无关</desc><desc data-aj-caption="3">下游开始出故障：最近 40 个请求错了 25 个，错误率超过阈值，样本也够，熔断器打开</desc><desc data-aj-caption="4">Open 期间请求不再打到下游，在熔断器这里快速失败，转去降级：返回缓存、换小模型或排队</desc><desc data-aj-caption="5">等满 resetTimeout（比如 30 秒）进入 Half-open：只放 3 个探测请求过去试试</desc><desc data-aj-caption="6">探测里有失败的，说明下游还没好：立刻回到 Open，再等一轮</desc><desc data-aj-caption="7">又过了一轮，3 个探测都成功：回到 Closed，流量恢复正常。状态变化和降级次数都要进告警</desc><rect width="960" height="710" rx="14" fill="#f6f7f4"/><text x="40" y="50" font-size="24" font-weight="600" fill="#1b1e1c" text-anchor="start"><tspan x="40" dy="0">限流、熔断与降级：各管一件事</tspan></text><text x="40" y="80" font-size="16" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="40" dy="0">限流挡住超出容量的请求，熔断在下游出故障时快速失败，降级让核心功能还能用</tspan></text><rect data-box-id="b1" x="40" y="130" width="120" height="84" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="100" y="179.4" font-size="17" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b1"><tspan x="100" dy="0">请求</tspan></text><path d="M160,172 L190,172" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b2" x="190" y="130" width="220" height="84" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="300" y="155" font-size="17" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b2"><tspan x="300" dy="0">限流器：保护容量</tspan></text><text x="300" y="182.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b2"><tspan x="300" dy="0">按 IP / 用户 / Key / 模型</tspan><tspan x="300" dy="21.6">令牌桶允许受控突发</tspan></text><path d="M410,172 L440,172" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><path d="M640,172 L670,172" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b3" x="670" y="130" width="250" height="84" rx="10" fill="#edefeb" stroke="#646c67" stroke-width="1.5"/><text x="795" y="179.4" font-size="17" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b3"><tspan x="795" dy="0">LLM / 下游服务</tspan></text><path d="M300,214 L300,250" fill="none" stroke="#b4232f" stroke-width="1.7" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b4" x="190" y="250" width="220" height="84" rx="10" fill="rgba(180,35,47,0.08)" stroke="#b4232f" stroke-width="1.5"/><text x="300" y="275" font-size="17" font-weight="600" fill="#b4232f" text-anchor="middle" data-box="b4"><tspan x="300" dy="0">超限 → 429</tspan></text><text x="300" y="302.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b4"><tspan x="300" dy="0">可附 Retry-After</tspan><tspan x="300" dy="21.6">（不是必带）</tspan></text><rect data-box-id="b5" x="40" y="360" width="370" height="112" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="225" y="388.2" font-size="17" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b5"><tspan x="225" dy="0">分层限流维度</tspan></text><text x="225" y="415.7" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b5"><tspan x="225" dy="0">IP：防爬虫和 DDoS</tspan><tspan x="225" dy="21.6">用户 / API Key：控制单方消耗</tspan><tspan x="225" dy="21.6">模型：控制高成本模型用量</tspan></text><text x="450" y="252" font-size="16" font-weight="600" fill="#646c67" text-anchor="start"><tspan x="450" dy="0">熔断器的三个状态</tspan></text><rect data-box-id="b6" x="450" y="270" width="130" height="52" rx="10" fill="rgba(47,138,78,0.08)" stroke="#2f8a4e" stroke-width="1.5"/><text x="515" y="303.4" font-size="17" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b6"><tspan x="515" dy="0">Closed</tspan></text><rect data-box-id="b7" x="790" y="270" width="130" height="52" rx="10" fill="rgba(180,35,47,0.08)" stroke="#b4232f" stroke-width="1.5"/><text x="855" y="303.4" font-size="17" font-weight="600" fill="#b4232f" text-anchor="middle" data-box="b7"><tspan x="855" dy="0">Open</tspan></text><rect data-box-id="b8" x="620" y="420" width="130" height="52" rx="10" fill="rgba(163,90,0,0.08)" stroke="#a35a00" stroke-width="1.5"/><text x="685" y="453.4" font-size="17" font-weight="600" fill="#a35a00" text-anchor="middle" data-box="b8"><tspan x="685" dy="0">Half-open</tspan></text><path d="M580,296 L790,296" fill="none" stroke="#b4232f" stroke-width="1.7" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1"/><text x="685" y="286" font-size="16" font-weight="400" fill="#b4232f" text-anchor="middle"><tspan x="685" dy="0">错误率超阈值且样本够</tspan></text><path d="M800,322 L720,420" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><text x="758" y="362" font-size="15" font-weight="400" fill="#646c67" text-anchor="end"><tspan x="758" dy="0">等 resetTimeout</tspan></text><path d="M650,420 L570,322" fill="none" stroke="#2f8a4e" stroke-width="1.7" marker-end="url(#m-ok)" stroke-linejoin="round" data-aj-arrow="1"/><text x="598" y="400" font-size="15" font-weight="400" fill="#2f8a4e" text-anchor="end"><tspan x="598" dy="0">探测成功</tspan></text><path d="M750,446 L870,446 L870,322" fill="none" stroke="#b4232f" stroke-width="1.7" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1"/><text x="862" y="400" font-size="15" font-weight="400" fill="#b4232f" text-anchor="end"><tspan x="862" dy="0">探测失败</tspan></text><path d="M905,322 L905,510" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b9" x="40" y="510" width="880" height="84" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="480" y="535" font-size="17" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b9"><tspan x="480" dy="0">Open 时走降级，保住核心功能</tspan></text><text x="480" y="562.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b9"><tspan x="480" dy="0">返回缓存结果 · 换更小的模型 · 排队（非实时任务）· 友好错误带 retryAfter</tspan><tspan x="480" dy="21.6">降级不是掩盖故障：状态变化和降级次数都要进告警</tspan></text><rect data-box-id="n10" x="40" y="618" width="880" height="52" rx="10" fill="rgba(74,120,98,0.08)"/><text x="60" y="650" font-size="17" fill="#3f4642" data-box="n10"><tspan font-weight="600" fill="#1b1e1c">Half-open 很关键：</tspan>只放行少量探测请求，成功才回到 Closed，避免下游刚恢复就被流量再次打垮。</text><g data-aj-frame="1"><rect data-box-id="b11" x="440" y="130" width="200" height="84" rx="10" fill="rgba(47,138,78,0.08)" stroke="#2f8a4e" stroke-width="1.5"/><text x="540" y="155" font-size="17" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b11"><tspan x="540" dy="0">熔断器：隔离故障</tspan></text><text x="540" y="182.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b11"><tspan x="540" dy="0">Closed：正常放行</tspan><tspan x="540" dy="21.6">错误率 0.5%</tspan></text><g data-aj-key="st"><rect x="450" y="270" width="130" height="52" rx="10" fill="none" stroke="#2f8a4e" stroke-width="3.2"/></g><path d="M160,172 L190,172" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><path d="M410,172 L440,172" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><path d="M640,172 L670,172" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/></g><g data-aj-frame="2" display="none"><rect data-box-id="b12" x="440" y="130" width="200" height="84" rx="10" fill="rgba(47,138,78,0.08)" stroke="#2f8a4e" stroke-width="1.5"/><text x="540" y="155" font-size="17" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b12"><tspan x="540" dy="0">熔断器：隔离故障</tspan></text><text x="540" y="182.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b12"><tspan x="540" dy="0">Closed：正常放行</tspan><tspan x="540" dy="21.6">错误率 0.5%</tspan></text><g data-aj-key="st"><rect x="450" y="270" width="130" height="52" rx="10" fill="none" stroke="#2f8a4e" stroke-width="3.2"/></g><path d="M160,172 L190,172" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><path d="M300,214 L300,250" fill="none" stroke="#b4232f" stroke-width="1.7" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><g data-aj-key="cur"><rect x="190" y="250" width="220" height="84" rx="10" fill="none" stroke="#b4232f" stroke-width="3.2"/></g></g><g data-aj-frame="3" display="none"><rect data-box-id="b13" x="440" y="130" width="200" height="84" rx="10" fill="rgba(180,35,47,0.08)" stroke="#b4232f" stroke-width="1.5"/><text x="540" y="155" font-size="17" font-weight="600" fill="#b4232f" text-anchor="middle" data-box="b13"><tspan x="540" dy="0">熔断器：隔离故障</tspan></text><text x="540" y="182.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b13"><tspan x="540" dy="0">错误率 62%</tspan><tspan x="540" dy="21.6">样本 40 个 ≥ 20</tspan></text><g data-aj-key="st"><rect x="790" y="270" width="130" height="52" rx="10" fill="none" stroke="#b4232f" stroke-width="3.2"/></g><path d="M580,296 L790,296" fill="none" stroke="#b4232f" stroke-width="1.7" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/></g><g data-aj-frame="4" display="none"><rect data-box-id="b14" x="440" y="130" width="200" height="84" rx="10" fill="rgba(180,35,47,0.08)" stroke="#b4232f" stroke-width="1.5"/><text x="540" y="155" font-size="17" font-weight="600" fill="#b4232f" text-anchor="middle" data-box="b14"><tspan x="540" dy="0">熔断器：隔离故障</tspan></text><text x="540" y="182.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b14"><tspan x="540" dy="0">Open：快速失败</tspan><tspan x="540" dy="21.6">不打下游</tspan></text><g data-aj-key="st"><rect x="790" y="270" width="130" height="52" rx="10" fill="none" stroke="#b4232f" stroke-width="3.2"/></g><path d="M160,172 L190,172" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><path d="M410,172 L440,172" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><path d="M905,322 L905,510" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><g data-aj-key="cur"><rect x="40" y="510" width="880" height="84" rx="10" fill="none" stroke="#4a7862" stroke-width="3.2"/></g></g><g data-aj-frame="5" display="none"><rect data-box-id="b15" x="440" y="130" width="200" height="84" rx="10" fill="rgba(163,90,0,0.08)" stroke="#a35a00" stroke-width="1.5"/><text x="540" y="155" font-size="17" font-weight="600" fill="#a35a00" text-anchor="middle" data-box="b15"><tspan x="540" dy="0">熔断器：隔离故障</tspan></text><text x="540" y="182.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b15"><tspan x="540" dy="0">Half-open</tspan><tspan x="540" dy="21.6">只放 3 个探测</tspan></text><g data-aj-key="st"><rect x="620" y="420" width="130" height="52" rx="10" fill="none" stroke="#a35a00" stroke-width="3.2"/></g><path d="M800,322 L720,420" fill="none" stroke="#a35a00" stroke-width="1.7" marker-end="url(#m-warn)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><path d="M640,172 L670,172" fill="none" stroke="#a35a00" stroke-width="1.7" marker-end="url(#m-warn)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/></g><g data-aj-frame="6" display="none"><rect data-box-id="b16" x="440" y="130" width="200" height="84" rx="10" fill="rgba(180,35,47,0.08)" stroke="#b4232f" stroke-width="1.5"/><text x="540" y="155" font-size="17" font-weight="600" fill="#b4232f" text-anchor="middle" data-box="b16"><tspan x="540" dy="0">熔断器：隔离故障</tspan></text><text x="540" y="182.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b16"><tspan x="540" dy="0">探测 3 个，失败 2 个</tspan><tspan x="540" dy="21.6">→ 回到 Open</tspan></text><g data-aj-key="st"><rect x="790" y="270" width="130" height="52" rx="10" fill="none" stroke="#b4232f" stroke-width="3.2"/></g><path d="M750,446 L870,446 L870,322" fill="none" stroke="#b4232f" stroke-width="1.7" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/></g><g data-aj-frame="7" display="none"><rect data-box-id="b17" x="440" y="130" width="200" height="84" rx="10" fill="rgba(47,138,78,0.08)" stroke="#2f8a4e" stroke-width="1.5"/><text x="540" y="155" font-size="17" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b17"><tspan x="540" dy="0">熔断器：隔离故障</tspan></text><text x="540" y="182.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b17"><tspan x="540" dy="0">探测 3 / 3 成功</tspan><tspan x="540" dy="21.6">→ Closed</tspan></text><g data-aj-key="st"><rect x="450" y="270" width="130" height="52" rx="10" fill="none" stroke="#2f8a4e" stroke-width="3.2"/></g><path d="M650,420 L570,322" fill="none" stroke="#2f8a4e" stroke-width="1.7" marker-end="url(#m-ok)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><path d="M160,172 L190,172" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><path d="M410,172 L440,172" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><path d="M640,172 L670,172" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/></g></svg>