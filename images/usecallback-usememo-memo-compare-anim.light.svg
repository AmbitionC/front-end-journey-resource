<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" data-theme="light" data-aj-steps="5" data-aj-mode="frames"><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(30,45,37,0.34)"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7862"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8a4e"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4232f"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a35a00"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6aa8"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#646c67"/></marker></defs><desc data-aj-caption="1">父组件的 state 变了：父组件函数整个重跑一遍，给子组件的 props 也跟着重新创建</desc><desc data-aj-caption="2">直接写一个内联箭头函数传给子组件：每次渲染都是一个新函数。memo 用 Object.is 比较，旧的和新的不是同一个，子组件照样渲染</desc><desc data-aj-caption="3">用 useCallback 包住、依赖 [id] 没变：拿到的还是上次那个函数，浅比较通过，子组件这一轮直接跳过</desc><desc data-aj-caption="4">用了 useCallback，可子组件没包 memo，也没有 Hook 依赖它：没人比较引用，子组件照样渲染，这层包装白做了</desc><desc data-aj-caption="5">就算子组件重新 render，也只是算出下一棵 UI；commit 才改 DOM。先用 Profiler 找到真正慢的组件，再决定要不要 memo</desc><rect width="960" height="700" rx="14" fill="#f6f7f4"/><text x="40" y="50" font-size="24" font-weight="600" fill="#1b1e1c" text-anchor="start"><tspan x="40" dy="0">useMemo / useCallback：只有下游比较引用时才省事</tspan></text><text x="40" y="80" font-size="16" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="40" dy="0">它们稳定的是值和函数的引用；子组件要靠 memo 浅比较或 Hook 依赖才能用上</tspan></text><rect data-box-id="b1" x="40" y="130" width="880" height="56" rx="10" fill="#edefeb" stroke="#4a7862" stroke-width="1.5"/><text x="480" y="165.4" font-size="17" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b1"><tspan x="480" dy="0">父组件 state 更新 → 父组件函数重跑，为子组件重新创建 props</tspan></text><path d="M 46 186 V 438" fill="none" stroke="rgba(30,45,37,0.13)" stroke-width="1.5"/><path d="M46,244 L60,244" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b2" x="60" y="210" width="260" height="68" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="190" y="251" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b2"><tspan x="190" dy="0">每次新建 {} / () =&gt; {}</tspan></text><path d="M320,244 L340,244" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b3" x="340" y="210" width="280" height="68" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="480" y="240.2" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b3"><tspan x="480" dy="0">memo 浅比较（Object.is）</tspan><tspan x="480" dy="21.6">引用不相等</tspan></text><path d="M620,244 L640,244" fill="none" stroke="#b4232f" stroke-width="1.7" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b4" x="640" y="210" width="280" height="68" rx="10" fill="rgba(180,35,47,0.08)" stroke="#b4232f" stroke-width="1.5"/><text x="780" y="251.4" font-size="17" font-weight="600" fill="#b4232f" text-anchor="middle" data-box="b4"><tspan x="780" dy="0">子组件照样 render</tspan></text><path d="M46,336 L60,336" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b5" x="60" y="302" width="260" height="68" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="190" y="332.2" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b5"><tspan x="190" dy="0">useMemo / useCallback</tspan><tspan x="190" dy="21.6">依赖没变</tspan></text><path d="M320,336 L340,336" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b6" x="340" y="302" width="280" height="68" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="480" y="332.2" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b6"><tspan x="480" dy="0">memo 浅比较</tspan><tspan x="480" dy="21.6">引用相同</tspan></text><path d="M620,336 L640,336" fill="none" stroke="#2f8a4e" stroke-width="1.7" marker-end="url(#m-ok)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b7" x="640" y="302" width="280" height="68" rx="10" fill="rgba(47,138,78,0.08)" stroke="#2f8a4e" stroke-width="1.5"/><text x="780" y="343.4" font-size="17" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b7"><tspan x="780" dy="0">跳过子组件 render</tspan></text><path d="M46,428 L60,428" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b8" x="60" y="394" width="260" height="68" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="190" y="424.2" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b8"><tspan x="190" dy="0">用了 useCallback</tspan><tspan x="190" dy="21.6">但子组件没包 memo</tspan></text><path d="M320,428 L340,428" fill="none" stroke="rgba(30,45,37,0.34)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b9" x="340" y="394" width="280" height="68" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="480" y="435" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b9"><tspan x="480" dy="0">没有人比较引用</tspan></text><path d="M620,428 L640,428" fill="none" stroke="#a35a00" stroke-width="1.7" marker-end="url(#m-warn)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b10" x="640" y="394" width="280" height="68" rx="10" fill="rgba(163,90,0,0.08)" stroke="#a35a00" stroke-width="1.5"/><text x="780" y="435.4" font-size="17" font-weight="600" fill="#a35a00" text-anchor="middle" data-box="b10"><tspan x="780" dy="0">照样 render，包装白做</tspan></text><rect data-box-id="b11" x="40" y="500" width="880" height="84" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="480" y="525" font-size="17" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b11"><tspan x="480" dy="0">render ≠ commit</tspan></text><text x="480" y="552.5" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b11"><tspan x="480" dy="0">render 只计算下一棵 UI，commit 才把差异改到 DOM</tspan><tspan x="480" dy="21.6">先用 Profiler 找到真正慢的地方，再决定要不要 memo</tspan></text><rect data-box-id="n12" x="40" y="608" width="880" height="52" rx="10" fill="rgba(74,120,98,0.08)"/><text x="60" y="640" font-size="17" fill="#3f4642" data-box="n12"><tspan font-weight="600" fill="#1b1e1c">依赖要写全：</tspan>漏掉依赖会形成 stale closure；依赖频繁变化时 memo 没意义，直接删掉。</text><g data-aj-frame="1"><g data-aj-key="row"><rect x="40" y="130" width="880" height="56" rx="10" fill="none" stroke="#a35a00" stroke-width="3.2"/></g></g><g data-aj-frame="2" display="none"><g data-aj-key="row"><rect x="60" y="210" width="860" height="68" rx="10" fill="none" stroke="#b4232f" stroke-width="3.2"/></g><text x="340" y="296" font-size="15" font-weight="400" fill="#b4232f" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="340" dy="0">Object.is(fn#1, fn#2) → false</tspan></text></g><g data-aj-frame="3" display="none"><g data-aj-key="row"><rect x="60" y="302" width="860" height="68" rx="10" fill="none" stroke="#2f8a4e" stroke-width="3.2"/></g><text x="340" y="388" font-size="15" font-weight="400" fill="#2f8a4e" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="340" dy="0">Object.is(fn#1, fn#1) → true</tspan></text></g><g data-aj-frame="4" display="none"><g data-aj-key="row"><rect x="60" y="394" width="860" height="68" rx="10" fill="none" stroke="#a35a00" stroke-width="3.2"/></g><text x="340" y="480" font-size="15" font-weight="400" fill="#a35a00" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="340" dy="0">没人调用 Object.is</tspan></text></g><g data-aj-frame="5" display="none"><g data-aj-key="row"><rect x="40" y="500" width="880" height="84" rx="10" fill="none" stroke="#1f6aa8" stroke-width="3.2"/></g></g></svg>