<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" data-theme="dark" data-aj-steps="6" data-aj-mode="frames"><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.30)"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c1d4c8"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#87bf9f"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e99497"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6b36a"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92b6cf"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#858a91"/></marker></defs><desc data-aj-caption="1">首次请求带 key k-77：用 insert-if-absent 原子地插一行，插成功就拿到执行权，账本从 NEW 进入 RUNNING</desc><desc data-aj-caption="2">还在执行时，客户端超时重发了同一个请求：插入失败，读账本看到 RUNNING，返回“进行中”，不再执行第二次</desc><desc data-aj-caption="3">首次执行成功：账本记为 SUCCEEDED，并把这次的语义结果存下来</desc><desc data-aj-caption="4">几分钟后消息队列又迟到地投递了一次：读到 SUCCEEDED，直接重放首次的结果，退款只发生一次</desc><desc data-aj-caption="5">有人拿同一个 k-77 发了“退款 ¥50”：intentHash 对不上，明确拒绝 parameter mismatch，而不是悄悄重放旧结果</desc><desc data-aj-caption="6">调下游时把自己的 operation ID 当幂等键传下去。超时了状态就是未知：先查下游，证明没生效才能重做</desc><rect width="960" height="650" rx="14" fill="#111214"/><text x="40" y="50" font-size="24" font-weight="600" fill="#f2f3f4" text-anchor="start"><tspan x="40" dy="0">Agent 幂等：所有重复请求汇到同一本账</tspan></text><text x="40" y="80" font-size="16" font-weight="400" fill="#858a91" text-anchor="start"><tspan x="40" dy="0">同一 key + 同一意图只产生一次业务效果；同一 key 换了意图要明确拒绝</tspan></text><rect data-box-id="b1" x="40" y="150" width="220" height="52" rx="10" fill="rgba(133,138,145,0.12)" stroke="#858a91" stroke-width="1.5"/><text x="150" y="183" font-size="16" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b1"><tspan x="150" dy="0">首次请求</tspan></text><rect data-box-id="b2" x="40" y="212" width="220" height="52" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="150" y="245" font-size="16" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b2"><tspan x="150" dy="0">网络重试：同 key 同意图</tspan></text><rect data-box-id="b3" x="40" y="274" width="220" height="52" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="150" y="307" font-size="16" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b3"><tspan x="150" dy="0">迟到 / 重复投递</tspan></text><rect data-box-id="b4" x="40" y="336" width="220" height="52" rx="10" fill="rgba(233,148,151,0.12)" stroke="#e99497" stroke-width="1.5"/><text x="150" y="369" font-size="16" font-weight="600" fill="#e99497" text-anchor="middle" data-box="b4"><tspan x="150" dy="0">同 key，但意图变了</tspan></text><path d="M 260 176 H 280 M 260 238 H 280 M 260 300 H 280 M 260 362 H 280 M 280 176 V 362" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><path d="M280,270 L300,270" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b5" x="300" y="200" width="220" height="140" rx="10" fill="#222527" stroke="#c1d4c8" stroke-width="1.5"/><text x="410" y="231.4" font-size="17" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b5"><tspan x="410" dy="0">原子抢占</tspan></text><text x="410" y="258.9" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b5"><tspan x="410" dy="0">insert-if-absent</tspan><tspan x="410" dy="21.6">key 范围：租户 +</tspan><tspan x="410" dy="21.6">operation + key</tspan><tspan x="410" dy="21.6">并比对 intentHash</tspan></text><text x="560" y="138" font-size="16" font-weight="600" fill="#858a91" text-anchor="start"><tspan x="560" dy="0">操作账本</tspan></text><path d="M520,270 L540,270 L540,174 L560,174" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b6" x="560" y="150" width="150" height="48" rx="10" fill="rgba(133,138,145,0.12)" stroke="#858a91" stroke-width="1.5"/><text x="635" y="181.4" font-size="17" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b6"><tspan x="635" dy="0">NEW</tspan></text><path d="M710,174 L770,174" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b7" x="770" y="150" width="150" height="48" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="845" y="181.4" font-size="17" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b7"><tspan x="845" dy="0">RUNNING</tspan></text><path d="M 845 198 V 226 M 615 226 H 865" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><path d="M615,226 L615,244" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b8" x="560" y="244" width="110" height="56" rx="10" fill="rgba(135,191,159,0.12)" stroke="#87bf9f" stroke-width="1.5"/><text x="615" y="279" font-size="16" font-weight="600" fill="#87bf9f" text-anchor="middle" data-box="b8"><tspan x="615" dy="0">SUCCEEDED</tspan></text><path d="M740,226 L740,244" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b9" x="685" y="244" width="110" height="56" rx="10" fill="rgba(214,179,106,0.12)" stroke="#d6b36a" stroke-width="1.5"/><text x="740" y="268.2" font-size="16" font-weight="600" fill="#d6b36a" text-anchor="middle" data-box="b9"><tspan x="740" dy="0">FAILED</tspan><tspan x="740" dy="21.6">RETRYABLE</tspan></text><path d="M865,226 L865,244" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b10" x="810" y="244" width="110" height="56" rx="10" fill="rgba(233,148,151,0.12)" stroke="#e99497" stroke-width="1.5"/><text x="865" y="268.2" font-size="16" font-weight="600" fill="#e99497" text-anchor="middle" data-box="b10"><tspan x="865" dy="0">FAILED</tspan><tspan x="865" dy="21.6">TERMINAL</tspan></text><rect data-box-id="b11" x="560" y="324" width="360" height="112" rx="10" fill="#222527" stroke="#858a91" stroke-width="1.5"/><text x="740" y="352.2" font-size="17" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b11"><tspan x="740" dy="0">重复请求读账本</tspan></text><text x="740" y="379.7" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b11"><tspan x="740" dy="0">RUNNING → 返回进行中或等待</tspan><tspan x="740" dy="21.6">SUCCEEDED → 重放首次的语义结果</tspan><tspan x="740" dy="21.6">意图不同 → 拒绝 parameter mismatch</tspan></text><rect data-box-id="b12" x="40" y="460" width="880" height="84" rx="10" fill="rgba(214,179,106,0.12)" stroke="#d6b36a" stroke-width="1.5"/><text x="480" y="485" font-size="17" font-weight="600" fill="#d6b36a" text-anchor="middle" data-box="b12"><tspan x="480" dy="0">外部副作用：把 operation ID 当下游幂等键，保存下游资源 ID</tspan></text><text x="480" y="512.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b12"><tspan x="480" dy="0">超时后状态是 unknown：先查下游，证明原操作没生效才重做</tspan><tspan x="480" dy="21.6">下游不支持幂等时：单线程队列、业务唯一约束、发送前后对账</tspan></text><rect data-box-id="n13" x="40" y="568" width="880" height="52" rx="10" fill="rgba(193,212,200,0.12)"/><text x="60" y="600" font-size="17" fill="#b2b5b9" data-box="n13"><tspan font-weight="600" fill="#f2f3f4">不要先查再写：</tspan>两个并发请求都查到「不存在」就会各执行一次，要用原子插入争 ownership。</text><g data-aj-frame="1"><g data-aj-key="req"><rect x="40" y="150" width="220" height="52" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><g data-aj-key="grab"><rect x="300" y="200" width="220" height="140" rx="10" fill="none" stroke="#c1d4c8" stroke-width="3.2"/></g><g data-aj-key="st"><rect x="770" y="150" width="150" height="48" rx="10" fill="none" stroke="#92b6cf" stroke-width="3.2"/></g><text x="300" y="372" font-size="15" font-weight="400" fill="#b2b5b9" text-anchor="start"><tspan x="300" dy="0">k-77 插入成功：拿到 ownership</tspan></text><text x="300" y="396" font-size="15" font-weight="400" fill="#b2b5b9" text-anchor="start"><tspan x="300" dy="0">intentHash = h(退款 ¥30)</tspan></text></g><g data-aj-frame="2" display="none"><g data-aj-key="req"><rect x="40" y="212" width="220" height="52" rx="10" fill="none" stroke="#92b6cf" stroke-width="3.2"/></g><g data-aj-key="grab"><rect x="300" y="200" width="220" height="140" rx="10" fill="none" stroke="#92b6cf" stroke-width="3.2"/></g><g data-aj-key="st"><rect x="770" y="150" width="150" height="48" rx="10" fill="none" stroke="#92b6cf" stroke-width="3.2"/></g><g data-aj-key="reply"><rect x="560" y="324" width="360" height="112" rx="10" fill="none" stroke="#92b6cf" stroke-width="3.2"/></g><text x="300" y="372" font-size="15" font-weight="400" fill="#b2b5b9" text-anchor="start"><tspan x="300" dy="0">k-77 已存在：读账本</tspan></text><text x="300" y="396" font-size="15" font-weight="400" fill="#b2b5b9" text-anchor="start"><tspan x="300" dy="0">RUNNING → 返回进行中</tspan></text></g><g data-aj-frame="3" display="none"><g data-aj-key="req"><rect x="40" y="150" width="220" height="52" rx="10" fill="none" stroke="#87bf9f" stroke-width="3.2"/></g><g data-aj-key="st"><rect x="560" y="244" width="110" height="56" rx="10" fill="none" stroke="#87bf9f" stroke-width="3.2"/></g><text x="300" y="372" font-size="15" font-weight="400" fill="#87bf9f" text-anchor="start"><tspan x="300" dy="0">退款单 rf-901 已创建</tspan></text><text x="300" y="396" font-size="15" font-weight="400" fill="#b2b5b9" text-anchor="start"><tspan x="300" dy="0">结果存进账本</tspan></text></g><g data-aj-frame="4" display="none"><g data-aj-key="req"><rect x="40" y="274" width="220" height="52" rx="10" fill="none" stroke="#92b6cf" stroke-width="3.2"/></g><g data-aj-key="grab"><rect x="300" y="200" width="220" height="140" rx="10" fill="none" stroke="#92b6cf" stroke-width="3.2"/></g><g data-aj-key="st"><rect x="560" y="244" width="110" height="56" rx="10" fill="none" stroke="#87bf9f" stroke-width="3.2"/></g><g data-aj-key="reply"><rect x="560" y="324" width="360" height="112" rx="10" fill="none" stroke="#87bf9f" stroke-width="3.2"/></g><text x="300" y="372" font-size="15" font-weight="400" fill="#b2b5b9" text-anchor="start"><tspan x="300" dy="0">k-77 已 SUCCEEDED</tspan></text><text x="300" y="396" font-size="15" font-weight="400" fill="#87bf9f" text-anchor="start"><tspan x="300" dy="0">重放 rf-901，不再退款</tspan></text></g><g data-aj-frame="5" display="none"><g data-aj-key="req"><rect x="40" y="336" width="220" height="52" rx="10" fill="none" stroke="#e99497" stroke-width="3.2"/></g><g data-aj-key="grab"><rect x="300" y="200" width="220" height="140" rx="10" fill="none" stroke="#e99497" stroke-width="3.2"/></g><g data-aj-key="reply"><rect x="560" y="324" width="360" height="112" rx="10" fill="none" stroke="#e99497" stroke-width="3.2"/></g><text x="300" y="372" font-size="15" font-weight="400" fill="#e99497" text-anchor="start"><tspan x="300" dy="0">intentHash 不一致</tspan></text><text x="300" y="396" font-size="15" font-weight="400" fill="#e99497" text-anchor="start"><tspan x="300" dy="0">拒绝：parameter mismatch</tspan></text></g><g data-aj-frame="6" display="none"><g data-aj-key="ext"><rect x="40" y="460" width="880" height="84" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><g data-aj-key="st"><rect x="770" y="150" width="150" height="48" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><text x="300" y="372" font-size="15" font-weight="400" fill="#d6b36a" text-anchor="start"><tspan x="300" dy="0">下游超时：状态 unknown</tspan></text><text x="300" y="396" font-size="15" font-weight="400" fill="#b2b5b9" text-anchor="start"><tspan x="300" dy="0">先查再决定，不盲目重试</tspan></text></g></svg>