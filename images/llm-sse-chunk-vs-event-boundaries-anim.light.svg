<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" data-theme="light" data-aj-steps="6" data-aj-mode="frames"><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(30,45,37,0.34)"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7862"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8a4e"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4232f"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a35a00"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6aa8"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#646c67"/></marker></defs><desc data-aj-caption="1">chunk 1 到达：它在“好”字的 3 个字节中间断开了。解码器先把“你”之前的解出来，半个“好”的 2 个字节先留着</desc><desc data-aj-caption="2">缓冲区里还没有空行，说明事件没结束：什么都不交给界面，继续等</desc><desc data-aj-caption="3">chunk 2 到达：先补齐“好”，再追加后面的内容。缓冲区里出现了空行 \n\n</desc><desc data-aj-caption="4">遇到空行就切出事件 1 交给界面；“世”那一半事件留在缓冲区，等下一块</desc><desc data-aj-caption="5">chunk 3 到达：补完事件 2，又带来一个完整的 done 事件</desc><desc data-aj-caption="6">切出事件 2 和 done，缓冲区清空。界面拿到的是 3 个完整事件，和网络怎么分块无关</desc><rect width="960" height="600" rx="14" fill="#f6f7f4"/><text x="40" y="50" font-size="24" font-weight="600" fill="#1b1e1c" text-anchor="start"><tspan x="40" dy="0">SSE：网络分块不等于事件边界</tspan></text><text x="40" y="80" font-size="16" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="40" dy="0">解析器先做 UTF-8 增量解码、追加到缓冲区，遇到空行才切出一个事件</tspan></text><rect data-panel="1" data-box-id="p1" x="40" y="294" width="880" height="112" rx="10" fill="#ffffff" stroke="rgba(30,45,37,0.34)" stroke-width="1.5"/><text x="54" y="320" font-size="16" font-weight="400" fill="#646c67" text-anchor="start" data-box="p1"><tspan x="54" dy="0">缓冲区</tspan></text><text x="40" y="436" font-size="16" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="40" dy="0">交给界面的事件</tspan></text><rect data-box-id="n2" x="40" y="524" width="880" height="52" rx="10" fill="rgba(74,120,98,0.08)"/><text x="60" y="556" font-size="17" fill="#3f4642" data-box="n2"><tspan font-weight="600" fill="#1b1e1c">不要按单个 chunk 拆行：</tspan>chunk 可能切在事件中间，甚至切开一个汉字的 UTF-8 字节。</text><g data-aj-frame="1"><rect data-panel="1" data-box-id="p3" x="40" y="134" width="280" height="96" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="54" y="160" font-size="16" font-weight="400" fill="#646c67" text-anchor="start" data-box="p3"><tspan x="54" dy="0">chunk 1</tspan></text><text x="56" y="190" font-size="16" font-weight="400" fill="#3f4642" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="56" dy="0">data: {&quot;t&quot;:&quot;你</tspan></text><text x="56" y="216" font-size="16" font-weight="400" fill="#b4232f" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="56" dy="0">E5 A5  ← 半个“好”</tspan></text><path d="M180,230 L180,290" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><text x="190" y="266" font-size="16" font-weight="400" fill="#4a7862" text-anchor="start"><tspan x="190" dy="0">喂入</tspan></text><g data-aj-key="p1"><rect data-box-id="b4" x="60" y="338" width="220" height="48" rx="10" fill="#ffffff" stroke="rgba(30,45,37,0.34)" stroke-width="1.5"/><text x="170" y="369" font-size="16" font-weight="600" fill="#1b1e1c" text-anchor="middle" data-box="b4"><tspan x="170" dy="0">data: {&quot;t&quot;:&quot;你</tspan></text></g><g data-aj-key="half"><rect data-box-id="b5" x="300" y="338" width="180" height="48" rx="10" fill="rgba(180,35,47,0.08)" stroke="#b4232f" stroke-width="1.5"/><text x="390" y="369" font-size="16" font-weight="600" fill="#b4232f" text-anchor="middle" data-box="b5"><tspan x="390" dy="0">待补齐：E5 A5</tspan></text></g></g><g data-aj-frame="2" display="none"><rect data-panel="1" data-box-id="p6" x="40" y="134" width="280" height="96" rx="10" fill="#ffffff" stroke="rgba(30,45,37,0.34)" stroke-width="1.5"/><text x="54" y="160" font-size="16" font-weight="400" fill="#646c67" text-anchor="start" data-box="p6"><tspan x="54" dy="0">chunk 1</tspan></text><text x="56" y="190" font-size="16" font-weight="400" fill="#646c67" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="56" dy="0">data: {&quot;t&quot;:&quot;你</tspan></text><text x="56" y="216" font-size="16" font-weight="400" fill="#646c67" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="56" dy="0">E5 A5  ← 半个“好”</tspan></text><g data-aj-key="p1"><rect data-box-id="b7" x="60" y="338" width="220" height="48" rx="10" fill="#ffffff" stroke="rgba(30,45,37,0.34)" stroke-width="1.5"/><text x="170" y="369" font-size="16" font-weight="600" fill="#1b1e1c" text-anchor="middle" data-box="b7"><tspan x="170" dy="0">data: {&quot;t&quot;:&quot;你</tspan></text></g><g data-aj-key="half"><rect data-box-id="b8" x="300" y="338" width="180" height="48" rx="10" fill="rgba(180,35,47,0.08)" stroke="#b4232f" stroke-width="1.5"/><text x="390" y="369" font-size="16" font-weight="600" fill="#b4232f" text-anchor="middle" data-box="b8"><tspan x="390" dy="0">待补齐：E5 A5</tspan></text></g></g><g data-aj-frame="3" display="none"><rect data-panel="1" data-box-id="p9" x="40" y="134" width="280" height="96" rx="10" fill="#ffffff" stroke="rgba(30,45,37,0.34)" stroke-width="1.5"/><text x="54" y="160" font-size="16" font-weight="400" fill="#646c67" text-anchor="start" data-box="p9"><tspan x="54" dy="0">chunk 1</tspan></text><text x="56" y="190" font-size="16" font-weight="400" fill="#646c67" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="56" dy="0">data: {&quot;t&quot;:&quot;你</tspan></text><text x="56" y="216" font-size="16" font-weight="400" fill="#646c67" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="56" dy="0">E5 A5  ← 半个“好”</tspan></text><rect data-panel="1" data-box-id="p10" x="340" y="134" width="280" height="96" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="354" y="160" font-size="16" font-weight="400" fill="#646c67" text-anchor="start" data-box="p10"><tspan x="354" dy="0">chunk 2</tspan></text><text x="356" y="190" font-size="16" font-weight="400" fill="#3f4642" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="356" dy="0">BD&quot;}\n\n</tspan></text><text x="356" y="216" font-size="16" font-weight="400" fill="#3f4642" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="356" dy="0">data: {&quot;t&quot;:&quot;世</tspan></text><path d="M480,230 L480,290" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><text x="490" y="266" font-size="16" font-weight="400" fill="#4a7862" text-anchor="start"><tspan x="490" dy="0">喂入</tspan></text><g data-aj-key="ev1"><rect d