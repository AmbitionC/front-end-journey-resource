<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" data-theme="dark" data-aj-steps="7" data-aj-mode="frames"><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.30)"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c1d4c8"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#87bf9f"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e99497"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6b36a"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92b6cf"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#858a91"/></marker></defs><desc data-aj-caption="1">原始上下文 17.5k，预算只有 9k，超了 8.5k</desc><desc data-aj-caption="2">第一步先锁定保护区：指令、目标、关键事实和来源 ID 可以缩短措辞，但语义和出处不能丢</desc><desc data-aj-caption="3">给候选排序：越便宜、越不影响答案的越先动。寒暄和重复历史最先删，工具结果能重新获取，较早对话最后才摘要</desc><desc data-aj-caption="4">删除：寒暄和重复历史直接去掉，最便宜，也不会引入错误。还超 2.5k</desc><desc data-aj-caption="5">抽取：工具中间结果只保留和问题相关的原句，原文需要时可以重新取。还超 0.5k</desc><desc data-aj-caption="6">摘要：实在不够才摘要较早的对话，降到 7k，进入预算</desc><desc data-aj-caption="7">最后做保真检查：引用、顺序、关键证据都还在才放行；不过就降低压缩率或重新检索</desc><rect width="960" height="560" rx="14" fill="#111214"/><text x="40" y="50" font-size="24" font-weight="600" fill="#f2f3f4" text-anchor="start"><tspan x="40" dy="0">上下文压缩：先保护，再按代价从低到高删减</tspan></text><text x="40" y="80" font-size="16" font-weight="400" fill="#858a91" text-anchor="start"><tspan x="40" dy="0">1 格 = 1k token；预算 9k = 窗口减去输出和安全余量</tspan></text><path d="M472,170 V196 M472,264 V292" stroke="#d6b36a" stroke-width="2" stroke-dasharray="6 5" fill="none"/><text x="464" y="150" font-size="16" font-weight="600" fill="#d6b36a" text-anchor="end"><tspan x="464" dy="0">预算线 9k</tspan></text><rect data-box-id="n1" x="40" y="480" width="880" height="52" rx="10" fill="rgba(193,212,200,0.12)"/><text x="60" y="512" font-size="17" fill="#b2b5b9" data-box="n1"><tspan font-weight="600" fill="#f2f3f4">别只追压缩比例：</tspan>以任务正确率和证据保真为约束，能删就不摘要，摘要最容易丢出处。</text><g data-aj-frame="1"><g data-aj-key="prot"><rect data-box-id="b2" x="40" y="200" width="216" height="60" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="148" y="237" font-size="16" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b2"><tspan x="148" dy="0">关键信息 4.5k</tspan></text></g><g data-aj-key="dup"><rect data-box-id="b3" x="256" y="200" width="240" height="60" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="376" y="237" font-size="16" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b3"><tspan x="376" dy="0">重复历史 5k</tspan></text></g><g data-aj-key="chat"><rect data-box-id="b4" x="496" y="200" width="48" height="60" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="520" y="237" font-size="16" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b4"><tspan x="520" dy="0">寒暄</tspan></text></g><g data-aj-key="tool"><rect data-box-id="b5" x="544" y="200" width="144" height="60" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="616" y="237" font-size="16" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b5"><tspan x="616" dy="0">工具中间结果 3k</tspan></text></g><g data-aj-key="old"><rect data-box-id="b6" x="688" y="200" width="192" height="60" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="784" y="237" font-size="16" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b6"><tspan x="784" dy="0">较早对话 4k</tspan></text></g><rect x="472" y="272" width="408" height="10" rx="5" fill="#e99497" fill-opacity="0.55"/><text x="480" y="304" font-size="16" font-weight="600" fill="#e99497" text-anchor="start"><tspan x="480" dy="0">超出 8.5k</tspan></text><text x="920" y="150" font-size="19" font-weight="600" fill="#e99497" text-anchor="end"><tspan x="920" dy="0">合计 17.5k / 预算 9k</tspan></text><rect data-box-id="b7" x="40" y="340" width="880" height="76" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="480" y="372.7" font-size="19" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b7"><tspan x="480" dy="0">原始上下文</tspan></text><text x="480" y="400.7" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b7"><tspan x="480" dy="0">系统指令、用户目标、关键事实、权限与来源 ID，加上一堆历史和中间结果</tspan></text></g><g data-aj-frame="2" display="none"><g data-aj-key="prot"><rect data-box-id="b8" x="40" y="200" width="216" height="60" rx="10" fill="#222527" stroke="#c1d4c8" stroke-width="1.5"/><text x="148" y="237" font-size="16" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b8"><tspan x="148" dy="0">保护区 4.5k</tspan></text></g><g data-aj-key="dup"><rect data-box-id="b9" x="256" y="200" width="240" height="60" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="376" y="237" font-size="16" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b9"><tspan x="376" dy="0">重复历史 5k</tspan></text></g><g data-aj-key="chat"><rect data-box-id="b10" x="496" y="200" width="48" height="60" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="520" y="237" font-size="16" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b10"><tspan x="520" dy="0">寒暄</tspan></text></g><g data-aj-key="tool"><rect data-box-id="b11" x="544" y="200" width="144" height="60" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="616" y="237" font-size="16" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b11"><tspan x="616" dy="0">工具中间结果 3k</tspan></text></g><g data-aj-key="old"><rect data-box-id="b12" x="688" y="200" width="192" height="60" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="784" y="237" font-size="16" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b12"><tspan x="784" dy="0">较早对话 4k</tspan></text></g><rect x="472" y="272" width="408" height="10" rx="5" fill="#e99497" fill-opacity="0.55"/><text x="480" y="304" font-size="16" font-weight="600" fill="#e99497" text-anchor="start"><tspan x="480" dy="0">超出 8.5k</tspan></text><text x="920" y="150" font-size="19" font-weight="600" fill="#e99497" text-anchor="end"><tspan x="920" dy="0">合计 17.5k / 预算 9k</tspan></text><rect data-box-id="b13" x="40" y="340" width="880" height="76" rx="10" fill="rgba(193,212,200,0.12)" stroke="#c1d4c8" stroke-width="1.5"/><text x="480" y="372.7" font-size="19" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b13"><tspan x="480" dy="0">锁定保护区</tspan></text><text x="480" y="400.7" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b13"><tspan x="480" dy="0">后面的删减只动候选区</tspan></text></g><g data-aj-frame="3" display="none"><g data-aj-key="prot"><rect data-box-id="b14" x="40" y="200" width="216" height="60" rx="10" fill="#222527" stroke="#c1d4c8" stroke-width="1.5"/><text x="148" y="237" font-size="16" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b14"><tspan x="148" dy="0">保护区 4.5k</tspan></text></g><g data-aj-key="dup"><rect data-box-id="b15" x="256" y="200" width="240" height="60" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="376" y="237" font-size="16" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b15"><tspan x="376" dy="0">重复历史 5k</tspan></text><text x="376" y="188" font-size="16" font-weight="700" fill="#d6b36a" text-anchor="middle"><tspan x="376" dy="0">1</tspan></text></g><g data-aj-key="chat"><rect data-box-id="b16" x="496" y="200" width="48" height="60" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="520" y="237" font-size="16" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b16"><tspan x="520" dy="0">寒暄</tspan></text><text x="520" y="188" font-size="16" font-weight="700" fill="#d6b36a" text-anchor="middle"><tspan x="520" dy="0">1</tspan></text></g><g data-aj-key="tool"><rect data-box-id="b17" x="544" y="200" width="144" height="60" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="616" y="237" font-size="16" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b17"><tspan x="616" dy="0">工具中间结果 3k</tspan></text><text x="616" y="188" font-size="16" font-weight="700" fill="#d6b36a" text-anchor="middle"><tspan x="616" dy="0">2</tspan></text></g><g data-aj-key="old"><rect data-box-id="b18" x="688" y="200" width="192" height="60" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="784" y="237" font-size="16" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b18"><tspan x="784" dy="0">较早对话 4k</tspan></text><text x="784" y="188" font-size="16" font-weight="700" fill="#d6b36a" text-anchor="middle"><tspan x="784" dy="0">3</tspan></text></g><rect x="472" y="272" width="408" height="10" rx="5" fill="#e99497" fill-opacity="0.55"/><text x="480" y="304" font-size="16" font-weight="600" fill="#e99497" text-anchor="start"><tspan x="480" dy="0">超出 8.5k</tspan></text><text x="920" y="150" font-size="19" font-weight="600" fill="#e99497" text-anchor="end"><tspan x="920" dy="0">合计 17.5k / 预算 9k</tspan></text><rect data-box-id="b19" x="40" y="340" width="880" height="76" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="480" y="372.7" font-size="19" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b19"><tspan x="480" dy="0">排序候选</tspan></text><text x="480" y="400.7" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b19"><tspan x="480" dy="0">1 删除 → 2 抽取 → 3 摘要，代价和风险依次升高</tspan></text></g><g data-aj-frame="4" display="none"><g data-aj-key="prot"><rect data-box-id="b20" x="40" y="200" width="216" height="60" rx="10" fill="#222527" stroke="#c1d4c8" stroke-width="1.5"/><text x="148" y="237" font-size="16" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b20"><tspan x="148" dy="0">保护区 4.5k</tspan></text></g><g data-aj-key="tool"><rect data-box-id="b21" x="256" y="200" width="144" height="60" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="328" y="237" font-size="16" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b21"><tspan x="328" dy="0">工具中间结果 3k</tspan></text><text x="328" y="188" font-size="16" font-weight="700" fill="#d6b36a" text-anchor="middle"><tspan x="328" dy="0">2</tspan></text></g><g data-aj-key="old"><rect data-box-id="b22" x="400" y="200" width="192" height="60" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="496" y="237" font-size="16" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b22"><tspan x="496" dy="0">较早对话 4k</tspan></text><text x="496" y="188" font-size="16" font-weight="700" fill="#d6b36a" text-anchor="middle"><tspan x="496" dy="0">3</tspan></text></g><rect x="472" y="272" width="120" height="10" rx="5" fill="#e99497" fill-opacity="0.55"/><text x="480" y="304" font-size="16" font-weight="600" fill="#e99497" text-anchor="start"><tspan x="480" dy="0">超出 2.5k</tspan></text><text x="920" y="150" font-size="19" font-weight="600" fill="#e99497" text-anchor="end"><tspan x="920" dy="0">合计 11.5k / 预算 9k</tspan></text><rect data-box-id="b23" x="40" y="340" width="880" height="76" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="480" y="372.7" font-size="19" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b23"><tspan x="480" dy="0">1 删除</tspan></text><text x="480" y="400.7" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b23"><tspan x="480" dy="0">去掉 6k，剩 11.5k</tspan></text></g><g data-aj-frame="5" display="none"><g data-aj-key="prot"><rect data-box-id="b24" x="40" y="200" width="216" height="60" rx="10" fill="#222527" stroke="#c1d4c8" stroke-width="1.5"/><text x="148" y="237" font-size="16" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b24"><tspan x="148" dy="0">保护区 4.5k</tspan></text></g><g data-aj-key="tool"><rect data-box-id="b25" x="256" y="200" width="48" height="60" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="280" y="237" font-size="16" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b25"><tspan x="280" dy="0">抽取</tspan></text></g><g data-aj-key="old"><rect data-box-id="b26" x="304" y="200" width="192" height="60" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="400" y="237" font-size="16" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b26"><tspan x="400" dy="0">较早对话 4k</tspan></text><text x="400" y="188" font-size="16" font-weight="700" fill="#d6b36a" text-anchor="middle"><tspan x="400" dy="0">3</tspan></text></g><rect x="472" y="272" width="24" height="10" rx="5" fill="#e99497" fill-opacity="0.55"/><text x="480" y="304" font-size="16" font-weight="600" fill="#e99497" text-anchor="start"><tspan x="480" dy="0">超出 0.5k</tspan></text><text x="920" y="150" font-size="19" font-weight="600" fill="#e99497" text-anchor="end"><tspan x="920" dy=