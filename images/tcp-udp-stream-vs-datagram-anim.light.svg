<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 566" width="960" height="566" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" data-theme="light" data-aj-steps="9" data-aj-mode="frames"><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(30,45,37,0.34)"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7862"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8a4e"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4232f"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a35a00"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6aa8"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#646c67"/></marker></defs><desc data-aj-caption="1">TCP 不认“消息”，只认字节：两次 send 的 100 + 50 字节被当成一串，按网络情况切成三段</desc><desc data-aj-caption="2">三段各带字节序号上路</desc><desc data-aj-caption="3">中间一段丢了：121–150 虽然先到，也只能在缓冲区里等，应用一个字节都读不到后面的。接收端回累计 ACK 61</desc><desc data-aj-caption="4">发送端发现 61–120 没被确认，重传；补上之后 1–150 连续，才交给应用</desc><desc data-aj-caption="5">应用 recv 读到的可能是 120 + 30 字节，和发送时的 100 + 50 对不上：消息边界要自己定</desc><desc data-aj-caption="6">UDP 每次 send 就是一个独立的数据报，边界天然保留</desc><desc data-aj-caption="7">网络不替你兜底：D2 丢了，D1 还可能被复制一份</desc><desc data-aj-caption="8">接收端按到达顺序拿到 D3、D1、D1：乱序、重复、缺失都可能发生</desc><desc data-aj-caption="9">好处是每次拿到的都是完整的一条消息；按消息 ID 去重、超时重传、排序都得上层自己做</desc><rect width="960" height="566" rx="14" fill="#f6f7f4"/><text x="40" y="50" font-size="24" font-weight="600" fill="#1b1e1c" text-anchor="start"><tspan x="40" dy="0">TCP 与 UDP：先问要字节流还是独立消息</tspan></text><text x="40" y="80" font-size="16" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="40" dy="0">同样发 150 字节，看两边在网络出问题时各自怎么表现</tspan></text><rect data-panel="1" data-box-id="p1" x="40" y="132" width="880" height="166" rx="10" fill="#ffffff" stroke="rgba(30,45,37,0.34)" stroke-width="1.5"/><rect data-panel="1" data-box-id="p2" x="40" y="316" width="880" height="150" rx="10" fill="#ffffff" stroke="rgba(30,45,37,0.34)" stroke-width="1.5"/><text x="54" y="158" font-size="16" font-weight="400" fill="#646c67" text-anchor="start" data-box="p1"><tspan x="54" dy="0">TCP：可靠、有序的字节流</tspan></text><text x="54" y="342" font-size="16" font-weight="400" fill="#646c67" text-anchor="start" data-box="p2"><tspan x="54" dy="0">UDP：独立的数据报</tspan></text><text x="52" y="118" font-size="16" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="52" dy="0">发送端</tspan></text><text x="352" y="118" font-size="16" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="352" dy="0">网络</tspan></text><text x="652" y="118" font-size="16" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="652" dy="0">接收端</tspan></text><line x1="332" y1="160" x2="332" y2="456" stroke="rgba(30,45,37,0.13)" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="632" y1="160" x2="632" y2="456" stroke="rgba(30,45,37,0.13)" stroke-width="1.5" stroke-dasharray="5 5"/><rect data-box-id="n3" x="40" y="490" width="880" height="52" rx="10" fill="rgba(74,120,98,0.08)"/><text x="60" y="522" font-size="17" fill="#3f4642" data-box="n3"><tspan font-weight="600" fill="#1b1e1c">别手写“可靠 UDP”：</tspan>要完整有序用 TCP，旧数据宁可丢用 RTP / WebRTC，要可靠又要多流用 QUIC。</text><g data-aj-frame="1"><g data-aj-key="s0"><rect data-box-id="b4" x="52" y="176" width="84" height="40" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="94" y="203" font-size="16" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b4"><tspan x="94" dy="0">1–60</tspan></text></g><g data-aj-key="s1"><rect data-box-id="b5" x="144" y="176" width="84" height="40" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="186" y="203" font-size="16" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b5"><tspan x="186" dy="0">61–120</tspan></text></g><g data-aj-key="s2"><rect data-box-id="b6" x="236" y="176" width="84" height="40" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="278" y="203" font-size="16" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b6"><tspan x="278" dy="0">121–150</tspan></text></g><text x="52" y="244" font-size="16" font-weight="400" fill="#3f4642" text-anchor="start"><tspan x="52" dy="0">两次 send：100 + 50 字节，切成 3 段</tspan></text></g><g data-aj-frame="2" display="none"><g data-aj-key="s0"><rect data-box-id="b7" x="352" y="176" width="84" height="40" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="394" y="203" font-size="16" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b7"><tspan x="394" dy="0">1–60</tspan></text></g><g data-aj-key="s1"><rect data-box-id="b8" x="444" y="176" width="84" height="40" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="486" y="203" font-size="16" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b8"><tspan x="486" dy="0">61–120</tspan></text></g><g data-aj-key="s2"><rect data-box-id="b9" x="536" y="176" width="84" height="40" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="578" y="203" font-size="16" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b9"><tspan x="578" dy="0">121–150</tspan></text></g><text x="352" y="244" font-size="16" font-weight="400" fill="#3f4642" text-anchor="start"><tspan x="352" dy="0">三段上路，各带序号</tspan></text></g><g data-aj-frame="3" display="none"><g data-aj-key="s0"><rect data-box-id="b10" x="652" y="176" width="84" height="40" rx="10" fill="rgba(47,138,78,0.08)" stroke="#2f8a4e" stroke-width="1.5"/><text x="694" y="203" font-size="16" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b10"><tspan x="694" dy="0">1–60</tspan></text></g><g data-aj-key="s1"><rect data-box-id="b11" x="444" y="176" width="84" height="40" rx="10" fill="rgba(180,35,47,0.08)" stroke="#b4232f" stroke-width="1.5"/><text x="486" y="203" font-size="16" font-weight="600" fill="#b4232f" text-anchor="middle" data-box="b11"><tspan x="486" dy="0">61–120 ✕</tspan></text></g><rect data-box-id="b12" x="744" y="176" width="84" height="40" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5" stroke-dasharray="6 5"/><text x="786" y="203" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b12"><tspan x="786" dy="0">缺口</tspan></text><g data-aj-key="s2"><rect data-box-id="b13" x="836" y="176" width="84" height="40" rx="10" fill="rgba(163,90,0,0.08)" stroke="#a35a00" stroke-width="1.5"/><text x="878" y="203" font-size="16" font-weight="600" fill="#a35a00" text-anchor="middle" data-box="b13"><tspan x="878" dy="0">121–150</tspan></text></g><text x="652" y="244" font-size="16" font-weight="400" fill="#a35a00" text-anchor="start"><tspan x="652" dy="0">121–150 先到，只能等</tspan></text><path d="M640,272 L320,272" fill="none" stroke="#1f6aa8" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#m-info)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><text x="480" y="264" font-size="16" font-weight="400" fill="#1f6aa8" text-anchor="middle"><tspan x="480" dy="0">ACK 61：61 之前都收到了</tspan></text></g><g data-aj-frame="4" display="none"><g data-aj-key="s0"><rect data-box-id="b14" x="652" y="176" width="84" height="40" rx="10" fill="rgba(47,138,78,0.08)" stroke="#2f8a4e" stroke-width="1.5"/><text x="694" y="203" font-size="16" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b14"><tspan x="694" dy="0">1–60</tspan></text></g><g data-aj-key="s1"><rect data-box-id="b15" x="744" y="176" width="84" height="40" rx="10" fill="rgba(47,138,78,0.08)" stroke="#2f8a4e" stroke-width="1.5"/><text x="786" y="203" font-size="16" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b15"><tspan x="786" dy="0">61–120</tspan></text></g><g data-aj-key="s2"><rect data-box-id="b16" x="836" y="176" width="84" height="40" rx="10" fill="rgba(47,138,78,0.08)" stroke="#2f8a4e" stroke-width="1.5"/><text x="878" y="203" font-size="16" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b16"><tspan x="878" dy="0">121–150</tspan></text></g><path d="M320,196 L640,196" fill="none" stroke="#4a7862" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><text x="352" y="244" font-size="16" font-weight="400" fill="#3f4642" text-anchor="start"><tspan x="352" dy="0">重传 61–120</tspan></text><text x="652" y="244" font-size="16" font-weight="400" fill="#2f8a4e" text-anchor="start"><tspan x="652" dy="0">1–150 连续了</tspan></text></g><g data-aj-frame="5" display="none"><rect data-box-id="b17" x="652" y="176" width="176" height="40" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="740" y="203" font-size="16" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b17"><tspan x="740" dy="0">recv #1：120 字节</tspan></text><rect data-box-id="b18" x="836" y="176" width="84" height="40" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="878" y="203" font-size="16" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b18"><tspan x="878" dy="0">#2：30</tspan></text><text x="652" y="244" font-size="16" font-weight="400" fill="#b4232f" text-anchor="start"><tspan x="652" dy="0">边界变了：要自己定帧</tspan></text></g><g data-aj-frame="6" display="none"><rect data-box-id="b19" x="652" y="176" width="176" height="40" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="740" y="203" font-size="16" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b19"><tspan x="740" dy="0">recv #1：120 字节</tspan></text><rect data-box-id="b20" x="836" y="176" width="84" height="40" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="878" y="203" font-size="16" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b20"><tspan x="878" dy="0">#2：30</tspan></text><text x="652" y="244" font-size="16" font-weight="400" fill="#b4232f" text-anchor="start"><tspan x="652" dy="0">边界变了：要自己定帧</tspan></text><g data-aj-key="d0"><rect data-box-id="b21" x="52" y="360" width="84" height="40" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="94" y="387" font-size="16" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b21"><tspan x="94" dy="0">D1</tspan></text></g><g data-aj-key="d1"><rect data-box-id="b22" x="144" y="360" width="84" height="40" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="186" y="387" font-size="16" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b22"><tspan x="186" dy="0">D2</tspan></text></g><g data-aj-key="d2"><rect data-box-id="b23" x="236" y="360" width="84" height="40" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="278" y="387" font-size="16" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b23"><tspan x="278" dy="0">D3</tspan></text></g><text x="52" y="428" font-size="16" font-weight="400" fill="#3f4642" text-anchor="start"><tspan x="52" dy="0">三次 send：每次就是一个数据报</tspan></text></g><g data-aj-frame="7" display="none"><rect data-box-id="b24" x="652" y="176" width="176" height="40" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="740" y="203" font-size="16" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b24"><tspan x="740" dy="0">recv #1：120 字节</tspan></text><rect data-box-id="b25" x="836" y="176" width="84" height="40" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="878" y="203" font-size="16" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b25"><tspan x="878" dy="0">#2：30</tspan></text><text x="652" y="244" font-size="16" font-weight="400" fill="#b4232f" text-anchor="start"><tspan x="652" dy="0">边界变了：要自己定帧</tspan></text><g data-aj-key="d0"><rect data-box-id="b26" x="352" y="360" width="84" height="40" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="394" y="387" font-size="16" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b26"><tspan x="394" dy="0">D1</tspan></text></g><g data-aj-key="d1"><rect data-box-id="b27" x="444" y="360" width="84" height="40" rx="10" fill="rgba(180,35,47,0.08)" stroke="#b4232f" stroke-width="1.5"/><text x="486" y="387" font-size="16" font-weight="600" fill="#b4232f" text-anchor="middle" data-box="b27"><tspan x="486" dy="0">D2 ✕</tspan></text></g><g data-aj-key="d2"><rect data-box-id="b28" x="536" y="360" width="84" height="40" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="578" y="387" font-size="16" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b28"><tspan x="578" dy="0">D3</tspan></text></g><text x="352" y="428" font-size="16" font-weight="400" fill="#b4232f" text-anchor="start"><tspan x="352" dy="0">D2 丢了，D1 被网络复制了一份</tspan></text></g><g data-aj-frame="8" display="none"><rect data-box-id="b29" x="652" y="176" width="176" height="40" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="740" y="203" font-size="16" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b29"><tspan x="740" dy="0">recv #1：120 字节</tspan></text><rect data-box-id="b30" x="836" y="176" width="84" height="40" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="878" y="203" font-size="16" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b30"><tspan x="878" dy="0">#2：30</tspan></text><text x="652" y="244" font-size="16" font-weight="400" fill="#b4232f" text-anchor="start"><tspan x="652" dy="0">边界变了：要自己定帧</tspan></text><g data-aj-key="d2"><rect data-box-id="b31" x="652" y="360" width="84" height="40" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="694" y="387" font-size="16" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b31"><tspan x="694" dy="0">D3</tspan></text></g><g data-aj-key="d0"><rect data-box-id="b32" x="744" y="360" width="84" height="40" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="786" y="387" font-size="16" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b32"><tspan x="786" dy="0">D1</tspan></text></g><g data-aj-key="d0b"><rect data-box-id="b33" x="836" y="360" width="84" height="40" rx="10" fill="rgba(163,90,0,0.08)" stroke="#a35a00" stroke-width="1.5"/><text x="878" y="387" font-size="16" font-weight="600" fill="#a35a00" text-anchor="middle" data-box="b33"><tspan x="878" dy="0">D1</tspan></text></g><text x="652" y="428" font-size="16" font-weight="400" fill="#a35a00" text-anchor="start"><tspan x="652" dy="0">收到顺序：D3、D1、D1</tspan></text></g><g data-aj-frame="9" display="none"><rect data-box-id="b34" x="652" y="176" width="176" height="40" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="740" y="203" font-size="16" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b34"><tspan x="740" dy="0">recv #1：120 字节</tspan></text><rect data-box-id="b35" x="836" y="176" width="84" height="40" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="878" y="203" font-size="16" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b35"><tspan x="878" dy="0">#2：30</tspan></text><text x="652" y="244" font-size="16" font-weight="400" fill="#b4232f" text-anchor="start"><tspan x="652" dy="0">边界变了：要自己定帧</tspan></text><g data-aj-key="d2"><rect data-box-id="b36" x="652" y="360" width="84" height="40" rx="10" fill="rgba(47,138,78,0.08)" stroke="#2f8a4e" stroke-width="1.5"/><text x="694" y="387" font-size="16" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b36"><tspan x="694" dy="0">D3</tspan></text></g><g data-aj-key="d0"><rect data-box-id="b37" x="744" y="360" width="84" height="40" rx="10" fill="rgba(47,138,78,0.08)" stroke="#2f8a4e" stroke-width="1.5"/><text x="786" y="387" font-size="16" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b37"><tspan x="786" dy="0">D1</tspan></text></g><g data-aj-key="d0b"><rect data-box-id="b38" x="836" y="360" width="84" height="40" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5" stroke-dasharray="6 5"/><text x="878" y="387" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b38"><tspan x="878" dy="0">D1 重复</tspan></text></g><text x="652" y="428" font-size="16" font-weight="400" fill="#3f4642" text-anchor="start"><tspan x="652" dy="0">上层去重、重传、排序</tspan></text></g></svg>