" height="52" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="873" y="203" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b40"><tspan x="873" dy="0">本轮输入</tspan></text><text x="40" y="290" font-size="17" font-weight="400" fill="#a35a00" text-anchor="start"><tspan x="40" dy="0">新前缀写入缓存；指纹变了，命中率按新指纹从头算</tspan></text></g></svg>