<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" data-theme="light" data-aj-steps="4" data-aj-mode="frames"><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(30,45,37,0.34)"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7862"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8a4e"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4232f"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a35a00"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6aa8"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#646c67"/></marker></defs><desc data-aj-caption="1">第 1 次请求：缓存是空的，整段都要算；算完后，按变更频率排在前面的稳定前缀被写进缓存</desc><desc data-aj-caption="2">第 2 次请求：前 5 段和上次逐字一样，全部命中；只有权限、检索结果、时间和本轮输入要重新算</desc><desc data-aj-caption="3">第 3 次请求：有人图方便把时间戳插到了任务定义后面。前缀匹配到这里就断了，后面本可复用的三段全要重算</desc><desc data-aj-caption="4">第 4 次请求：工具定义升级到 v2，这是真的变了。从工具定义往后都重算是对的，此时换一个新的前缀指纹重新统计命中率</desc><rect width="960" height="600" rx="14" fill="#f6f7f4"/><text x="40" y="50" font-size="24" font-weight="600" fill="#1b1e1c" text-anchor="start"><tspan x="40" dy="0">Prompt Cache：命中靠稳定前缀</tspan></text><text x="40" y="80" font-size="16" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="40" dy="0">缓存复用的是前缀已完成的计算，不扩大上下文窗口；变了的内容不会命中</tspan></text><line x1="40" y1="245" x2="68" y2="245" stroke="#2f8a4e" stroke-width="2"/><text x="76" y="250" font-size="15" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="76" dy="0">命中缓存</tspan></text><line x1="164" y1="245" x2="192" y2="245" stroke="#1f6aa8" stroke-width="2"/><text x="200" y="250" font-size="15" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="200" dy="0">计算并写入缓存</tspan></text><line x1="333" y1="245" x2="361" y2="245" stroke="#646c67" stroke-width="2"/><text x="369" y="250" font-size="15" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="369" dy="0">每次都要算</tspan></text><line x1="472" y1="245" x2="500" y2="245" stroke="#b4232f" stroke-width="2" stroke-dasharray="5 4"/><text x="508" y="250" font-size="15" font-weight="400" fill="#646c67" text-anchor="start"><tspan x="508" dy="0">本可复用却重算</tspan></text><rect data-box-id="b1" x="40" y="376" width="280" height="112" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="180" y="404.2" font-size="17" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b1"><tspan x="180" dy="0">供应商适配器</tspan></text><text x="180" y="431.7" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b1"><tspan x="180" dy="0">自动前缀缓存：看 usage 判命中</tspan><tspan x="180" dy="21.6">显式断点：自己管生命周期</tspan><tspan x="180" dy="21.6">TTL、阈值不写成通用常量</tspan></text><rect data-box-id="b2" x="340" y="376" width="280" height="112" rx="10" fill="rgba(74,120,98,0.08)" stroke="#4a7862" stroke-width="1.5"/><text x="480" y="404.2" font-size="17" font-weight="600" fill="#4a7862" text-anchor="middle" data-box="b2"><tspan x="480" dy="0">逻辑前缀指纹</tspan></text><text x="480" y="431.7" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b2"><tspan x="480" dy="0">provider · model · 政策 · 工具</tspan><tspan x="480" dy="21.6">Schema · 示例 · 序列化器版本</tspan><tspan x="480" dy="21.6">按指纹统计命中率</tspan></text><rect data-box-id="b3" x="640" y="376" width="280" height="112" rx="10" fill="rgba(163,90,0,0.08)" stroke="#a35a00" stroke-width="1.5"/><text x="780" y="404.2" font-size="17" font-weight="600" fill="#a35a00" text-anchor="middle" data-box="b3"><tspan x="780" dy="0">主动失效</tspan></text><text x="780" y="431.7" font-size="16" font-weight="400" fill="#646c67" text-anchor="middle" data-box="b3"><tspan x="780" dy="0">政策、工具权限、Schema</tspan><tspan x="780" dy="21.6">示例、模型、授权范围变了</tspan><tspan x="780" dy="21.6">就换新前缀，不强求旧命中</tspan></text><rect data-box-id="n4" x="40" y="512" width="880" height="52" rx="10" fill="rgba(74,120,98,0.08)"/><text x="60" y="544" font-size="17" fill="#3f4642" data-box="n4"><tspan font-weight="600" fill="#1b1e1c">值不值得：</tspan>净收益 = 基线 − 写入存储 − 读取 − 失效成本；同时看首 token 延迟和 P95。</text><g data-aj-frame="1"><text x="40" y="152" font-size="16" font-weight="600" fill="#3f4642" text-anchor="start"><tspan x="40" dy="0">请求 #1：稳定区在前，按变更频率从低到高排</tspan></text><rect data-box-id="b5" x="40" y="170" width="100" height="52" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="90" y="203" font-size="16" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b5"><tspan x="90" dy="0">应用政策</tspan></text><rect data-box-id="b6" x="144" y="170" width="100" height="52" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="194" y="203" font-size="16" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b6"><tspan x="194" dy="0">任务定义</tspan></text><rect data-box-id="b7" x="248" y="170" width="100" height="52" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="298" y="203" font-size="16" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b7"><tspan x="298" dy="0">工具定义</tspan></text><rect data-box-id="b8" x="352" y="170" width="100" height="52" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="402" y="203" font-size="16" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b8"><tspan x="402" dy="0">输出契约</tspan></text><rect data-box-id="b9" x="456" y="170" width="100" height="52" rx="10" fill="rgba(31,106,168,0.08)" stroke="#1f6aa8" stroke-width="1.5"/><text x="506" y="203" font-size="16" font-weight="600" fill="#1f6aa8" text-anchor="middle" data-box="b9"><tspan x="506" dy="0">审核示例</tspan></text><rect data-box-id="b10" x="560" y="170" width="86" height="52" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="603" y="203" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b10"><tspan x="603" dy="0">权限状态</tspan></text><rect data-box-id="b11" x="650" y="170" width="86" height="52" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="693" y="203" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b11"><tspan x="693" dy="0">检索结果</tspan></text><rect data-box-id="b12" x="740" y="170" width="86" height="52" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="783" y="203" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b12"><tspan x="783" dy="0">时间</tspan></text><rect data-box-id="b13" x="830" y="170" width="86" height="52" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="873" y="203" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b13"><tspan x="873" dy="0">本轮输入</tspan></text><text x="40" y="290" font-size="17" font-weight="400" fill="#3f4642" text-anchor="start"><tspan x="40" dy="0">缓存为空：9 段全部计算，前 5 段写入缓存</tspan></text></g><g data-aj-frame="2" display="none"><text x="40" y="152" font-size="16" font-weight="600" fill="#2f8a4e" text-anchor="start"><tspan x="40" dy="0">请求 #2：同一个稳定前缀</tspan></text><rect data-box-id="b14" x="40" y="170" width="100" height="52" rx="10" fill="#edefeb" stroke="#2f8a4e" stroke-width="1.5"/><text x="90" y="203" font-size="16" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b14"><tspan x="90" dy="0">应用政策 ✓</tspan></text><rect data-box-id="b15" x="144" y="170" width="100" height="52" rx="10" fill="#edefeb" stroke="#2f8a4e" stroke-width="1.5"/><text x="194" y="203" font-size="16" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b15"><tspan x="194" dy="0">任务定义 ✓</tspan></text><rect data-box-id="b16" x="248" y="170" width="100" height="52" rx="10" fill="#edefeb" stroke="#2f8a4e" stroke-width="1.5"/><text x="298" y="203" font-size="16" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b16"><tspan x="298" dy="0">工具定义 ✓</tspan></text><rect data-box-id="b17" x="352" y="170" width="100" height="52" rx="10" fill="#edefeb" stroke="#2f8a4e" stroke-width="1.5"/><text x="402" y="203" font-size="16" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b17"><tspan x="402" dy="0">输出契约 ✓</tspan></text><rect data-box-id="b18" x="456" y="170" width="100" height="52" rx="10" fill="#edefeb" stroke="#2f8a4e" stroke-width="1.5"/><text x="506" y="203" font-size="16" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b18"><tspan x="506" dy="0">审核示例 ✓</tspan></text><rect data-box-id="b19" x="560" y="170" width="86" height="52" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="603" y="203" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b19"><tspan x="603" dy="0">权限状态</tspan></text><rect data-box-id="b20" x="650" y="170" width="86" height="52" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="693" y="203" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b20"><tspan x="693" dy="0">检索结果</tspan></text><rect data-box-id="b21" x="740" y="170" width="86" height="52" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="783" y="203" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b21"><tspan x="783" dy="0">时间</tspan></text><rect data-box-id="b22" x="830" y="170" width="86" height="52" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="873" y="203" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b22"><tspan x="873" dy="0">本轮输入</tspan></text><text x="40" y="290" font-size="17" font-weight="400" fill="#2f8a4e" text-anchor="start"><tspan x="40" dy="0">命中 5 段，只算 4 段后缀：首 token 更快、输入更便宜</tspan></text></g><g data-aj-frame="3" display="none"><text x="40" y="152" font-size="16" font-weight="600" fill="#b4232f" text-anchor="start"><tspan x="40" dy="0">请求 #3：稳定区中间插了一个时间戳</tspan></text><rect data-box-id="b23" x="40" y="170" width="100" height="52" rx="10" fill="#edefeb" stroke="#2f8a4e" stroke-width="1.5"/><text x="90" y="203" font-size="16" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b23"><tspan x="90" dy="0">应用政策 ✓</tspan></text><rect data-box-id="b24" x="144" y="170" width="100" height="52" rx="10" fill="#edefeb" stroke="#2f8a4e" stroke-width="1.5"/><text x="194" y="203" font-size="16" font-weight="600" fill="#2f8a4e" text-anchor="middle" data-box="b24"><tspan x="194" dy="0">任务定义 ✓</tspan></text><rect data-box-id="b25" x="248" y="170" width="86" height="52" rx="10" fill="rgba(100,108,103,0.08)" stroke="#646c67" stroke-width="1.5"/><text x="291" y="203" font-size="16" font-weight="600" fill="#646c67" text-anchor="middle" data-box="b25"><tspan x="291" dy="0">时间</tspan></text><rect data-box-id="b26" x="338" y="170" width="100" height="52" rx="10" fill="rgba(180,35,47,0.08)" stroke="#b4232f" stroke-width="1.5" stroke-dasharray="6 5"/><text x="388" y="203" font-size="16" font-weight="600" fill="#b4232f" text-anchor="middle" data-box="b26"><tspan x="388" dy="0">工具定义</tspan></text><rect data-box-id="b27" x="442" y="170" width="100" height="52" rx="10" fill="rgba(180,35,4