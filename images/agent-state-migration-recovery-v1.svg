<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Agent 容器迁移与任务恢复</title>
  <desc id="desc">旧 Worker 持续写事件、检查点和制品；崩溃或迁移后，新 Worker 校验租约，恢复快照并重放事件，通过幂等账本避免外部副作用重复。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker>
    <style>.title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0F172A}.label{font:650 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0F172A}.small{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.tiny{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748B}.line{stroke:#64748B;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.write{stroke:#7C3AED;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#DC2626;stroke-width:2.5;stroke-dasharray:8 7;fill:none}</style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#F8FAFC"/>
  <text x="56" y="60" class="title">运行时会消失，任务身份与持久状态不能消失</text>
  <text x="56" y="91" class="small">容器迁移不是“复制聊天记录”：恢复必须绑定 run、release、checkpoint、事件序号和已提交副作用。</text>

  <rect x="55" y="155" width="215" height="150" rx="20" fill="#EAF2FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="162" y="198" text-anchor="middle" class="label">旧 Worker / Container</text>
  <text x="162" y="230" text-anchor="middle" class="small">lease = 41</text>
  <text x="162" y="256" text-anchor="middle" class="small">执行 step 18</text>
  <text x="162" y="282" text-anchor="middle" class="small">operation = op_8</text>

  <rect x="340" y="155" width="220" height="150" rx="20" fill="#FFF3D6" stroke="#D97706" stroke-width="2"/>
  <text x="450" y="198" text-anchor="middle" class="label">安全恢复边界</text>
  <text x="450" y="230" text-anchor="middle" class="small">append event #184</text>
  <text x="450" y="256" text-anchor="middle" class="small">checkpoint v19</text>
  <text x="450" y="282" text-anchor="middle" class="small">artifact hash</text>

  <rect x="622" y="155" width="138" height="150" rx="20" fill="#FFECEF" stroke="#DC2626" stroke-width="2"/>
  <text x="691" y="201" text-anchor="middle" class="label">崩溃 / 迁移</text>
  <path d="M655 235 L727 269 M727 235 L655 269" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>

  <rect x="822" y="155" width="318" height="150" rx="20" fill="#E8F7EE" stroke="#16A34A" stroke-width="2"/>
  <text x="981" y="193" text-anchor="middle" class="label">新 Worker / Container</text>
  <text x="981" y="225" text-anchor="middle" class="small">获取新 lease 与 fencing token</text>
  <text x="981" y="251" text-anchor="middle" class="small">载入快照 → 重放事件 → 校验 pending</text>
  <text x="981" y="277" text-anchor="middle" class="small">查询 op_8 状态后再继续</text>

  <path d="M270 230 H340" class="line"/><path d="M560 230 H622" class="line"/><path d="M760 230 H822" class="line"/>

  <rect x="110" y="410" width="250" height="116" rx="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="235" y="451" text-anchor="middle" class="label">Checkpoint Store</text>
  <text x="235" y="480" text-anchor="middle" class="small">不可变快照 · release ID</text>
  <text x="235" y="504" text-anchor="middle" class="tiny">stateRef + eventSeq + checksum</text>

  <rect x="475" y="410" width="250" height="116" rx="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="600" y="451" text-anchor="middle" class="label">Event / Artifact Store</text>
  <text x="600" y="480" text-anchor="middle" class="small">追加事件 · 大对象引用</text>
  <text x="600" y="504" text-anchor="middle" class="tiny">可审计、可重放、可校验</text>

  <rect x="840" y="410" width="250" height="116" rx="18" fill="#E8F7EE" stroke="#16A34A" stroke-width="2"/>
  <text x="965" y="451" text-anchor="middle" class="label">Idempotency Ledger</text>
  <text x="965" y="480" text-anchor="middle" class="small">not_started · committed · unknown</text>
  <text x="965" y="504" text-anchor="middle" class="tiny">外部写操作只提交一次</text>

  <path d="M390 305 C360 350 260 355 235 410" class="write"/>
  <path d="M450 305 C470 350 560 355 600 410" class="write"/>
  <path d="M510 305 C650 350 880 350 965 410" class="write"/>
  <path d="M235 410 C310 330 870 330 925 305" class="line"/>
  <path d="M600 410 C650 350 900 350 965 305" class="line"/>
  <path d="M965 410 V305" class="line"/>
  <path d="M691 305 V568" class="dash"/>
  <text x="710" y="558" class="tiny" fill="#DC2626">临时内存不跨越此边界</text>

  <rect x="111" y="592" width="979" height="42" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="600" y="619" text-anchor="middle" class="small">恢复成功 = 状态一致 + 版本兼容 + 租约有效 + 外部效果未重复</text>
</svg>
