<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" data-theme="dark" data-aj-steps="9" data-aj-mode="frames"><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.30)"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c1d4c8"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#87bf9f"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e99497"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6b36a"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92b6cf"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#858a91"/></marker></defs><desc data-aj-caption="1">先从用户能接受的时间反推：交互式回答 P95 8 秒，留 0.5 秒给网络和响应、0.5 秒给状态提交，模型和工具一共只有 7 秒</desc><desc data-aj-caption="2">Gateway 在 10:00:00 收到请求，只算一次绝对 deadline = 10:00:08，随请求往下传，而不是传“8 秒”</desc><desc data-aj-caption="3">Agent 在 10:00:00.2 开始干活：剩余 = 截止 − 现在 = 7.8 秒，再扣掉响应和提交的 1 秒预留，能花的是 6.8 秒</desc><desc data-aj-caption="4">模型调用把首 token、空闲、总时限三种超时分开盯。这次卡了 3.8 秒后失败，可用预算还剩 3 秒</desc><desc data-aj-caption="5">还剩 3 秒，这类调用 P95 是 1.2 秒：够试一次。重试继承同一个 deadline，不是重新开一个 8 秒</desc><desc data-aj-caption="6">重试又失败，只剩 0.9 秒，不够一次 P95：不再启动同类重试，转去返回超时或更快的合格路径</desc><desc data-aj-caption="7">如果走到了工具，提交副作用前再查一次 deadline；已经过期就不提交，提交时带幂等键防止重复</desc><desc data-aj-caption="8">deadline 一到，取消沿着同一条链往下传：下游要真正停掉手里的模型调用和工具，而不只是上游不再等</desc><desc data-aj-caption="9">最低有效窗口：只剩 80 毫秒时，不要再启动通常要 2 秒的调用，直接返回超时或走更快的合格路径</desc><rect width="960" height="570" rx="14" fill="#111214"/><text x="40" y="50" font-size="24" font-weight="600" fill="#f2f3f4" text-anchor="start"><tspan x="40" dy="0">Agent 超时：一笔沿链路递减的预算</tspan></text><text x="40" y="80" font-size="16" font-weight="400" fill="#858a91" text-anchor="start"><tspan x="40" dy="0">入口算一次绝对 deadline，每一跳扣掉已用时间和必要预留，不给每个组件重新发一份完整超时</tspan></text><text x="40" y="130" font-size="16" font-weight="600" fill="#858a91" text-anchor="start"><tspan x="40" dy="0">从用户 SLO 反推：交互式回答 P95 = 8s（宽度示意）</tspan></text><rect data-box-id="b1" x="40" y="142" width="600" height="44" rx="10" fill="#222527" stroke="#c1d4c8" stroke-width="1.5"/><text x="340" y="171" font-size="16" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b1"><tspan x="340" dy="0">模型与工具 7s：排队、重试、并行都从这里出</tspan></text><rect data-box-id="b2" x="640" y="142" width="140" height="44" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="710" y="171" font-size="16" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b2"><tspan x="710" dy="0">网络与响应 0.5s</tspan></text><rect data-box-id="b3" x="780" y="142" width="140" height="44" rx="10" fill="rgba(135,191,159,0.12)" stroke="#87bf9f" stroke-width="1.5"/><text x="850" y="171" font-size="16" font-weight="600" fill="#87bf9f" text-anchor="middle" data-box="b3"><tspan x="850" dy="0">状态提交 0.5s</tspan></text><text x="40" y="230" font-size="16" font-weight="600" fill="#858a91" text-anchor="start"><tspan x="40" dy="0">每一跳都用同一个绝对 deadline 算剩余预算</tspan></text><rect data-box-id="b4" x="40" y="244" width="196" height="84" rx="10" fill="rgba(133,138,145,0.12)" stroke="#858a91" stroke-width="1.5"/><text x="138" y="269" font-size="17" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b4"><tspan x="138" dy="0">Gateway</tspan></text><text x="138" y="296.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b4"><tspan x="138" dy="0">算出绝对 deadline</tspan><tspan x="138" dy="21.6">随请求往下传</tspan></text><path d="M236,272 L268,272" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><path d="M236,302 L268,302" fill="none" stroke="#e99497" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b5" x="268" y="244" width="196" height="84" rx="10" fill="rgba(193,212,200,0.12)" stroke="#c1d4c8" stroke-width="1.5"/><text x="366" y="269" font-size="17" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b5"><tspan x="366" dy="0">Agent</tspan></text><text x="366" y="296.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b5"><tspan x="366" dy="0">剩余 = 截止 − 现在</tspan><tspan x="366" dy="21.6">扣掉响应和提交预留</tspan></text><path d="M464,272 L496,272" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><path d="M464,302 L496,302" fill="none" stroke="#e99497" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b6" x="496" y="244" width="196" height="84" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="594" y="269" font-size="17" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b6"><tspan x="594" dy="0">模型调用</tspan></text><text x="594" y="296.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b6"><tspan x="594" dy="0">首 token / 空闲 / 总时限</tspan><tspan x="594" dy="21.6">三种信号分开</tspan></text><path d="M692,272 L724,272" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><path d="M692,302 L724,302" fill="none" stroke="#e99497" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b7" x="724" y="244" width="196" height="84" rx="10" fill="rgba(214,179,106,0.12)" stroke="#d6b36a" stroke-width="1.5"/><text x="822" y="269" font-size="17" font-weight="600" fill="#d6b36a" text-anchor="middle" data-box="b7"><tspan x="822" dy="0">工具</tspan></text><text x="822" y="296.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b7"><tspan x="822" dy="0">提交前再查 deadline</tspan><tspan x="822" dy="21.6">副作用带幂等键</tspan></text><text x="40" y="354" font-size="15" font-weight="400" fill="#858a91" text-anchor="start"><tspan x="40" dy="0">实线：deadline 向下传；红虚线：取消也向下传，下游要真正停下手里的工作</tspan></text><rect data-box-id="b8" x="40" y="376" width="430" height="84" rx="10" fill="rgba(214,179,106,0.12)" stroke="#d6b36a" stroke-width="1.5"/><text x="255" y="401" font-size="17" font-weight="600" fill="#d6b36a" text-anchor="middle" data-box="b8"><tspan x="255" dy="0">重试共用一个 deadline</tspan></text><text x="255" y="428.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b8"><tspan x="255" dy="0">还剩 3s、调用 P95 1.2s：可以试一次</tspan><tspan x="255" dy="21.6">失败后只剩 0.9s：不再启动同类重试</tspan></text><rect data-box-id="b9" x="490" y="376" width="430" height="84" rx="10" fill="rgba(233,148,151,0.12)" stroke="#e99497" stroke-width="1.5"/><text x="705" y="401" font-size="17" font-weight="600" fill="#e99497" text-anchor="middle" data-box="b9"><tspan x="705" dy="0">最低有效窗口</tspan></text><text x="705" y="428.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b9"><tspan x="705" dy="0">只剩 80ms 时别启动要 2s 的调用</tspan><tspan x="705" dy="21.6">直接返回超时，或走更快的合格路径</tspan></text><rect data-box-id="n10" x="40" y="484" width="880" height="52" rx="10" fill="rgba(193,212,200,0.12)"/><text x="60" y="516" font-size="17" fill="#b2b5b9" data-box="n10"><tspan font-weight="600" fill="#f2f3f4">deadline 和 lease 别混：</tspan>deadline 是业务不再需要结果的时刻，lease 是当前 Worker 的所有权。</text><g data-aj-frame="1"><g data-aj-key="slo"><rect x="40" y="142" width="880" height="44" rx="10" fill="none" stroke="#c1d4c8" stroke-width="3.2"/></g><text x="920" y="230" font-size="16" font-weight="600" fill="#c1d4c8" text-anchor="end"><tspan x="920" dy="0">总预算 8s</tspan></text></g><g data-aj-frame="2" display="none"><g data-aj-key="hop"><rect x="40" y="244" width="196" height="84" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><text x="920" y="230" font-size="16" font-weight="600" fill="#c1d4c8" text-anchor="end"><tspan x="920" dy="0">deadline 10:00:08</tspan></text></g><g data-aj-frame="3" display="none"><g data-aj-key="hop"><rect x="268" y="244" width="196" height="84" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><text x="920" y="230" font-size="16" font-weight="600" fill="#c1d4c8" text-anchor="end"><tspan x="920" dy="0">可用 6.8s</tspan></text></g><g data-aj-frame="4" display="none"><g data-aj-key="hop"><rect x="496" y="244" width="196" height="84" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><text x="920" y="230" font-size="16" font-weight="600" fill="#d6b36a" text-anchor="end"><tspan x="920" dy="0">还剩 3s</tspan></text></g><g data-aj-frame="5" display="none"><g data-aj-key="hop"><rect x="496" y="244" width="196" height="84" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><g data-aj-key="rule"><rect x="40" y="376" width="430" height="84" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><text x="920" y="230" font-size="16" font-weight="600" fill="#d6b36a" text-anchor="end"><tspan x="920" dy="0">还剩 3s</tspan></text></g><g data-aj-frame="6" display="none"><g data-aj-key="hop"><rect x="496" y="244" width="196" height="84" rx="10" fill="none" stroke="#e99497" stroke-width="3.2"/></g><g data-aj-key="rule"><rect x="40" y="376" width="430" height="84" rx="10" fill="none" stroke="#e99497" stroke-width="3.2"/></g><text x="920" y="230" font-size="16" font-weight="600" fill="#e99497" text-anchor="end"><tspan x="920" dy="0">还剩 0.9s</tspan></text></g><g data-aj-frame="7" display="none"><g data-aj-key="hop"><rect x="724" y="244" width="196" height="84" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><text x="920" y="230" font-size="16" font-weight="600" fill="#d6b36a" text-anchor="end"><tspan x="920" dy="0">提交前再查</tspan></text></g><g data-aj-frame="8" display="none"><g data-aj-key="hop"><rect x="268" y="244" width="196" height="84" rx="10" fill="none" stroke="#e99497" stroke-width="3.2"/></g><path d="M236,302 L268,302" fill="none" stroke="#e99497" stroke-width="1.7" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><path d="M464,302 L496,302" fill="none" stroke="#e99497" stroke-width="1.7" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><path d="M692,302 L724,302" fill="none" stroke="#e99497" stroke-width="1.7" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><text x="920" y="230" font-size="16" font-weight="600" fill="#e99497" text-anchor="end"><tspan x="920" dy="0">已过期：取消下传</tspan></text></g><g data-aj-frame="9" display="none"><g data-aj-key="rule"><rect x="490" y="376" width="430" height="84" rx="10" fill="none" stroke="#e99497" stroke-width="3.2"/></g><text x="920" y="230" font-size="16" font-weight="600" fill="#e99497" text-anchor="end"><tspan x="920" dy="0">还剩 80ms</tspan></text></g></svg>