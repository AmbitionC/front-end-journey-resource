<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" data-theme="dark" data-aj-steps="8" data-aj-mode="frames"><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.30)"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c1d4c8"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#87bf9f"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e99497"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6b36a"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92b6cf"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#858a91"/></marker></defs><desc data-aj-caption="1">worker-1 执行“付款 199 元”这一步：先把意图落盘，记下操作、参数 hash、授权和收款方</desc><desc data-aj-caption="2">生成幂等键 run-9:step-4:pay：同一个逻辑操作不管重试几次，键都一样</desc><desc data-aj-caption="3">调用支付接口，钱真的付出去了：这是外部效果，撤不回来</desc><desc data-aj-caption="4">偏偏在这里崩溃：付款已经成功，结果还没写进 operation 表。只在副作用前做过 checkpoint 的系统，恢复时会再付一次</desc><desc data-aj-caption="5">worker-2 抢到 lease，拿到更大的 fencing token 8：旧 worker 就算复活，也写不进来</desc><desc data-aj-caption="6">恢复不是直接重跑：先按幂等键去支付系统查，这笔付款已经存在</desc><desc data-aj-caption="7">复用这次付款的结果，补写进 operation 表，再 checkpoint 推进到下一节点</desc><desc data-aj-caption="8">这就是 Resume：从持久状态接着往下走，钱只付了一次。Retry 是重做一个失败操作，Replay 只按事件重建状态</desc><rect width="960" height="620" rx="14" fill="#111214"/><text x="40" y="50" font-size="24" font-weight="600" fill="#f2f3f4" text-anchor="start"><tspan x="40" dy="0">Agent 工作流：副作用夹在意图和检查点之间</tspan></text><text x="40" y="80" font-size="16" font-weight="400" fill="#858a91" text-anchor="start"><tspan x="40" dy="0">只在副作用前 checkpoint，崩溃后会重放付款或发信；结果提交之后才推进状态</tspan></text><rect data-frame="1" x="40" y="112" width="880" height="160" rx="14" fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1.4" stroke-dasharray="6 6"/><text x="56" y="138" font-size="16" font-weight="400" fill="#858a91" text-anchor="start"><tspan x="56" dy="0">副作用的安全序列（一个步骤）</tspan></text><rect data-box-id="b1" x="60" y="146" width="152" height="84" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="136" y="171" font-size="17" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b1"><tspan x="136" dy="0">写意图</tspan></text><text x="136" y="198.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b1"><tspan x="136" dy="0">操作、参数 hash</tspan><tspan x="136" dy="21.6">授权、目标</tspan></text><path d="M212,188 L232,188" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b2" x="232" y="146" width="152" height="84" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="308" y="171" font-size="17" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b2"><tspan x="308" dy="0">生成幂等键</tspan></text><text x="308" y="198.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b2"><tspan x="308" dy="0">runId:stepId:</tspan><tspan x="308" dy="21.6">逻辑操作</tspan></text><path d="M384,188 L404,188" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b3" x="404" y="146" width="152" height="84" rx="10" fill="rgba(214,179,106,0.12)" stroke="#d6b36a" stroke-width="1.5"/><text x="480" y="171" font-size="17" font-weight="600" fill="#d6b36a" text-anchor="middle" data-box="b3"><tspan x="480" dy="0">执行外部效果</tspan></text><text x="480" y="198.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b3"><tspan x="480" dy="0">付款、发信、</tspan><tspan x="480" dy="21.6">写外部系统</tspan></text><path d="M556,188 L576,188" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b4" x="576" y="146" width="152" height="84" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="652" y="171" font-size="17" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b4"><tspan x="652" dy="0">提交结果</tspan></text><text x="652" y="198.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b4"><tspan x="652" dy="0">写进</tspan><tspan x="652" dy="21.6">operation 表</tspan></text><path d="M728,188 L748,188" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b5" x="748" y="146" width="152" height="84" rx="10" fill="#222527" stroke="#c1d4c8" stroke-width="1.5"/><text x="824" y="171" font-size="17" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b5"><tspan x="824" dy="0">checkpoint</tspan></text><text x="824" y="198.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b5"><tspan x="824" dy="0">下一节点、版本</tspan><tspan x="824" dy="21.6">事件序号</tspan></text><line x1="566" y1="140" x2="566" y2="238" stroke="#e99497" stroke-width="2" stroke-dasharray="5 4"/><text x="566" y="258" font-size="15" font-weight="400" fill="#e99497" text-anchor="middle"><tspan x="566" dy="0">最危险的崩溃点：效果已发生，结果还没提交</tspan></text><rect data-frame="1" x="40" y="296" width="620" height="196" rx="14" fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1.4" stroke-dasharray="6 6"/><text x="56" y="322" font-size="16" font-weight="400" fill="#858a91" text-anchor="start"><tspan x="56" dy="0">恢复：先按幂等键查，再决定</tspan></text><rect data-box-id="b6" x="60" y="362" width="220" height="68" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="170" y="389.8" font-size="17" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b6"><tspan x="170" dy="0">查外部系统</tspan></text><text x="170" y="417.3" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b6"><tspan x="170" dy="0">或本地 operation 表</tspan></text><path d="M280,396 L310,396" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" stroke-linejoin="round" data-aj-arrow="1"/><path d="M310,346 L310,446" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" stroke-linejoin="round" data-aj-arrow="1"/><path d="M310,346 L340,346" fill="none" stroke="#87bf9f" stroke-width="1.7" marker-end="url(#m-ok)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b7" x="340" y="324" width="300" height="44" rx="10" fill="rgba(135,191,159,0.12)" stroke="#87bf9f" stroke-width="1.5"/><text x="490" y="353" font-size="16" font-weight="600" fill="#87bf9f" text-anchor="middle" data-box="b7"><tspan x="490" dy="0">已存在 → 复用结果</tspan></text><path d="M310,398 L340,398" fill="none" stroke="#92b6cf" stroke-width="1.7" marker-end="url(#m-info)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b8" x="340" y="376" width="300" height="44" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="490" y="405" font-size="16" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b8"><tspan x="490" dy="0">确定未执行 → 重试</tspan></text><path d="M310,450 L340,450" fill="none" stroke="#d6b36a" stroke-width="1.7" marker-end="url(#m-warn)" stroke-linejoin="round" data-aj-arrow="1"/><rect data-box-id="b9" x="340" y="428" width="300" height="44" rx="10" fill="rgba(214,179,106,0.12)" stroke="#d6b36a" stroke-width="1.5"/><text x="490" y="457" font-size="16" font-weight="600" fill="#d6b36a" text-anchor="middle" data-box="b9"><tspan x="490" dy="0">状态未知 → 人工或补偿</tspan></text><rect data-box-id="b10" x="40" y="516" width="280" height="68" rx="10" fill="rgba(133,138,145,0.12)" stroke="#858a91" stroke-width="1.5"/><text x="180" y="543.8" font-size="17" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b10"><tspan x="180" dy="0">Retry</tspan></text><text x="180" y="571.3" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b10"><tspan x="180" dy="0">重新执行某个失败操作</tspan></text><rect data-box-id="b11" x="340" y="516" width="280" height="68" rx="10" fill="rgba(133,138,145,0.12)" stroke="#858a91" stroke-width="1.5"/><text x="480" y="543.8" font-size="17" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b11"><tspan x="480" dy="0">Resume</tspan></text><text x="480" y="571.3" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b11"><tspan x="480" dy="0">从持久状态继续未完成流程</tspan></text><rect data-box-id="b12" x="640" y="516" width="280" height="68" rx="10" fill="#222527" stroke="#c1d4c8" stroke-width="1.5"/><text x="780" y="543.8" font-size="17" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b12"><tspan x="780" dy="0">Replay</tspan></text><text x="780" y="571.3" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b12"><tspan x="780" dy="0">按事件历史重建，不重做副作用</tspan></text><g data-aj-frame="1"><g data-aj-key="cur"><rect x="60" y="146" width="152" height="84" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><rect data-box-id="b13" x="680" y="296" width="240" height="196" rx="10" fill="rgba(193,212,200,0.12)" stroke="#c1d4c8" stroke-width="1.5"/><text x="800" y="355.4" font-size="17" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b13"><tspan x="800" dy="0">Lease + fencing token</tspan></text><text x="800" y="382.9" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b13"><tspan x="800" dy="0">worker-1 持有 lease</tspan><tspan x="800" dy="21.6">fencing token = 7</tspan><tspan x="800" dy="21.6"></tspan><tspan x="800" dy="21.6">每次提交都校验 token</tspan></text></g><g data-aj-frame="2" display="none"><g data-aj-key="cur"><rect x="232" y="146" width="152" height="84" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><rect data-box-id="b14" x="680" y="296" width="240" height="196" rx="10" fill="rgba(193,212,200,0.12)" stroke="#c1d4c8" stroke-width="1.5"/><text x="800" y="355.4" font-size="17" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b14"><tspan x="800" dy="0">Lease + fencing token</tspan></text><text x="800" y="382.9" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b14"><tspan x="800" dy="0">worker-1 持有 lease</tspan><tspan x="800" dy="21.6">fencing token = 7</tspan><tspan x="800" dy="21.6"></tspan><tspan x="800" dy="21.6">每次提交都校验 token</tspan></text></g><g data-aj-frame="3" display="none"><g data-aj-key="cur"><rect x="404" y="146" width="152" height="84" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><path d="M384,188 L404,188" fill="none" stroke="#d6b36a" stroke-width="1.7" marker-end="url(#m-warn)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><rect data-box-id="b15" x="680" y="296" width="240" height="196" rx="10" fill="rgba(193,212,200,0.12)" stroke="#c1d4c8" stroke-width="1.5"/><text x="800" y="355.4" font-size="17" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b15"><tspan x="800" dy="0">Lease + fencing token</tspan></text><text x="800" y="382.9" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b15"><tspan x="800" dy="0">worker-1 持有 lease</tspan><tspan x="800" dy="21.6">fencing token = 7</tspan><tspan x="800" dy="21.6"></tspan><tspan x="800" dy="21.6">每次提交都校验 token</tspan></text></g><g data-aj-frame="4" display="none"><g data-aj-key="cur"><rect x="548" y="136" width="36" height="108" rx="10" fill="none" stroke="#e99497" stroke-width="3.2"/></g><rect data-box-id="b16" x="680" y="296" width="240" height="196" rx="10" fill="rgba(233,148,151,0.12)" stroke="#e99497" stroke-width="1.5"/><text x="800" y="377" font-size="17" font-weight="600" fill="#e99497" text-anchor="middle" data-box="b16"><tspan x="800" dy="0">Lease + fencing token</tspan></text><text x="800" y="404.5" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b16"><tspan x="800" dy="0">worker-1 已崩溃</tspan><tspan x="800" dy="21.6">lease 到期后释放</tspan></text></g><g data-aj-frame="5" display="none"><g data-aj-key="cur"><rect x="680" y="296" width="240" height="196" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><rect data-box-id="b17" x="680" y="296" width="240" height="196" rx="10" fill="rgba(193,212,200,0.12)" stroke="#c1d4c8" stroke-width="1.5"/><text x="800" y="355.4" font-size="17" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b17"><tspan x="800" dy="0">Lease + fencing token</tspan></text><text x="800" y="382.9" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b17"><tspan x="800" dy="0">worker-2 接手</tspan><tspan x="800" dy="21.6">fencing token = 8</tspan><tspan x="800" dy="21.6">worker-1 若复活带 7 来写</tspan><tspan x="800" dy="21.6">会被拒绝</tspan></text></g><g data-aj-frame="6" display="none"><g data-aj-key="cur"><rect x="60" y="362" width="220" height="68" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><g data-aj-key="hit"><rect x="340" y="324" width="300" height="44" rx="10" fill="none" stroke="#87bf9f" stroke-width="3.2"/></g><path d="M280,396 L310,396 L310,346 L340,346" fill="none" stroke="#87bf9f" stroke-width="1.7" marker-end="url(#m-ok)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><rect data-box-id="b18" x="680" y="296" width="240" height="196" rx="10" fill="rgba(193,212,200,0.12)" stroke="#c1d4c8" stroke-width="1.5"/><text x="800" y="355.4" font-size="17" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b18"><tspan x="800" dy="0">Lease + fencing token</tspan></text><text x="800" y="382.9" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b18"><tspan x="800" dy="0">worker-2 接手</tspan><tspan x="800" dy="21.6">fencing token = 8</tspan><tspan x="800" dy="21.6">worker-1 若复活带 7 来写</tspan><tspan x="800" dy="21.6">会被拒绝</tspan></text></g><g data-aj-frame="7" display="none"><g data-aj-key="cur"><rect x="576" y="146" width="152" height="84" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><g data-aj-key="hit"><rect x="748" y="146" width="152" height="84" rx="10" fill="none" stroke="#87bf9f" stroke-width="3.2"/></g><path d="M728,188 L748,188" fill="none" stroke="#87bf9f" stroke-width="1.7" marker-end="url(#m-ok)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><rect data-box-id="b19" x="680" y="296" width="240" height="196" rx="10" fill="rgba(193,212,200,0.12)" stroke="#c1d4c8" stroke-width="1.5"/><text x="800" y="355.4" font-size="17" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b19"><tspan x="800" dy="0">Lease + fencing token</tspan></text><text x="800" y="382.9" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b19"><tspan x="800" dy="0">worker-2 接手</tspan><tspan x="800" dy="21.6">fencing token = 8</tspan><tspan x="800" dy="21.6">worker-1 若复活带 7 来写</tspan><tspan x="800" dy="21.6">会被拒绝</tspan></text></g><g data-aj-frame="8" display="none"><g data-aj-key="cur"><rect x="748" y="146" width="152" height="84" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><g data-aj-key="hit"><rect x="340" y="516" width="280" height="68" rx="10" fill="none" stroke="#87bf9f" stroke-width="3.2"/></g><rect data-box-id="b20" x="680" y="296" width="240" height="196" rx="10" fill="rgba(193,212,200,0.12)" stroke="#c1d4c8" stroke-width="1.5"/><text x="800" y="355.4" font-size="17" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b20"><tspan x="800" dy="0">Lease + fencing token</tspan></text><text x="800" y="382.9" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b20"><tspan x="800" dy="0">worker-2 接手</tspan><tspan x="800" dy="21.6">fencing token = 8</tspan><tspan x="800" dy="21.6">worker-1 若复活带 7 来写</tspan><tspan x="800" dy="21.6">会被拒绝</tspan></text></g></svg>