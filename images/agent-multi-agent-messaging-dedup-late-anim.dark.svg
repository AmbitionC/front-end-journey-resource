8" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><text x="245" y="186" font-size="16" font-weight="400" fill="#c1d4c8" text-anchor="middle"><tspan x="245" dy="0">task.requested · msg-01</tspan></text><path d="M600,246 L120,246" fill="none" stroke="#92b6cf" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#m-info)" stroke-linejoin="round" data-aj-arrow="1"/><text x="245" y="236" font-size="16" font-weight="400" fill="#92b6cf" text-anchor="middle"><tspan x="245" dy="0">received：只代表收到</tspan></text><path d="M370,296 L600,296" fill="none" stroke="#e99497" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1"/><text x="485" y="286" font-size="16" font-weight="400" fill="#e99497" text-anchor="middle"><tspan x="485" dy="0">重投 msg-01</tspan></text><text x="588" y="320" font-size="15" font-weight="400" fill="#e99497" text-anchor="end"><tspan x="588" dy="0">按 messageId 去重，丢弃</tspan></text><path d="M600,360 L120,360" fill="none" stroke="#92b6cf" stroke-width="1.7" marker-end="url(#m-info)" stroke-linejoin="round" data-aj-arrow="1"/><text x="245" y="350" font-size="16" font-weight="400" fill="#92b6cf" text-anchor="middle"><tspan x="245" dy="0">progress：running</tspan></text><rect data-box-id="b17" x="50" y="384" width="140" height="34" rx="10" fill="#222527" stroke="#c1d4c8" stroke-width="1.5"/><text x="120" y="408" font-size="16" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b17"><tspan x="120" dy="0">改计划 → v6</tspan></text><path d="M600,450 L120,450" fill="none" stroke="#e99497" stroke-width="1.7" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><text x="245" y="440" font-size="16" font-weight="400" fill="#e99497" text-anchor="middle"><tspan x="245" dy="0">result（plan v5）迟到</tspan></text><text x="134" y="470" font-size="15" font-weight="400" fill="#e99497" text-anchor="start"><tspan x="134" dy="0">v5 &lt; v6：只记录，不覆盖新