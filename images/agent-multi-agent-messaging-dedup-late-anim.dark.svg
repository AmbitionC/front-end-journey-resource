<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" width="960" height="576" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" data-theme="dark" data-aj-steps="6" data-aj-mode="frames"><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.30)"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c1d4c8"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#87bf9f"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e99497"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6b36a"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92b6cf"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#858a91"/></marker></defs><desc data-aj-caption="1">Planner 经中间件发出任务：信封里的 messageId 用来去重，planVersion 记下是按哪版计划派的</desc><desc data-aj-caption="2">Researcher 先回 received：这只说明消息到了，任务还没开始，更没完成</desc><desc data-aj-caption="3">中间件没收到确认，又把 msg-01 投了一遍；Researcher 查到已处理过，直接丢弃，不会再做一遍</desc><desc data-aj-caption="4">Researcher 开始干活后回报 running：进度和结果是两种消息，分开记</desc><desc data-aj-caption="5">这时 Planner 根据新信息改了计划，版本升到 v6</desc><desc data-aj-caption="6">按 v5 做出的结果这才送到：Planner 比较版本，v5 &lt; v6，只记录下来，不拿它覆盖新计划</desc><rect width="960" height="576" rx="14" fill="#111214"/><text x="40" y="50" font-size="24" font-weight="600" fill="#f2f3f4" text-anchor="start"><tspan x="40" dy="0">多智能体消息：收到、进行中、结果分开记</tspan></text><text x="40" y="80" font-size="16" font-weight="400" fill="#858a91" text-anchor="start"><tspan x="40" dy="0">投递至少一次：重复按 messageId 去重，迟到结果按版本对账</tspan></text><rect data-panel="1" data-box-id="p4" x="700" y="108" width="220" height="222" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><rect data-box-id="b1" x="40" y="108" width="160" height="44" rx="10" fill="rgba(193,212,200,0.12)" stroke="#c1d4c8" stroke-width="1.5"/><text x="120" y="137.4" font-size="17" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b1"><tspan x="120" dy="0">Planner</tspan></text><rect data-box-id="b2" x="290" y="108" width="160" height="44" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="370" y="137.4" font-size="17" font-weight="600" fill="#f2f3f4" text-anchor="middle" data-box="b2"><tspan x="370" dy="0">消息中间件</tspan></text><rect data-box-id="b3" x="520" y="108" width="160" height="44" rx="10" fill="rgba(193,212,200,0.12)" stroke="#c1d4c8" stroke-width="1.5"/><text x="600" y="137.4" font-size="17" font-weight="600" fill="#c1d4c8" text-anchor="middle" data-box="b3"><tspan x="600" dy="0">Researcher</tspan></text><line x1="120" y1="152" x2="120" y2="384" stroke="rgba(255,255,255,0.13)" stroke-width="2"/><line x1="120" y1="418" x2="120" y2="474" stroke="rgba(255,255,255,0.13)" stroke-width="2"/><line x1="370" y1="152" x2="370" y2="474" stroke="rgba(255,255,255,0.13)" stroke-width="2"/><line x1="600" y1="152" x2="600" y2="474" stroke="rgba(255,255,255,0.13)" stroke-width="2"/><text x="714" y="134" font-size="16" font-weight="400" fill="#858a91" text-anchor="start" data-box="p4"><tspan x="714" dy="0">消息信封</tspan></text><text x="716" y="166" font-size="15" font-weight="400" fill="#858a91" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="716" dy="0">messageId</tspan></text><text x="904" y="166" font-size="15" font-weight="400" fill="#f2f3f4" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="904" dy="0">msg-01</tspan></text><text x="716" y="202" font-size="15" font-weight="400" fill="#858a91" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="716" dy="0">correlationId</tspan></text><text x="904" y="202" font-size="15" font-weight="400" fill="#f2f3f4" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="904" dy="0">task-42</tspan></text><text x="716" y="238" font-size="15" font-weight="400" fill="#858a91" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="716" dy="0">causationId</tspan></text><text x="904" y="238" font-size="15" font-weight="400" fill="#f2f3f4" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="904" dy="0">msg-00</tspan></text><text x="716" y="274" font-size="15" font-weight="400" fill="#858a91" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="716" dy="0">type</tspan></text><text x="904" y="274" font-size="15" font-weight="400" fill="#f2f3f4" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="904" dy="0">task.requested</tspan></text><text x="716" y="310" font-size="15" font-weight="400" fill="#858a91" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="716" dy="0">planVersion</tspan></text><text x="904" y="310" font-size="15" font-weight="400" fill="#f2f3f4" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="904" dy="0">5</tspan></text><rect data-box-id="n5" x="40" y="500" width="880" height="52" rx="10" fill="rgba(193,212,200,0.12)"/><text x="60" y="532" font-size="17" fill="#b2b5b9" data-box="n5"><tspan font-weight="600" fill="#f2f3f4">最危险的误解：</tspan>把“消息已收到”当成“任务已完成”，或把重投的消息当成新指令。</text><g data-aj-frame="1"><path d="M120,196 L600,196" fill="none" stroke="#c1d4c8" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><text x="245" y="186" font-size="16" font-weight="400" fill="#c1d4c8" text-anchor="middle"><tspan x="245" dy="0">task.requested · msg-01</tspan></text><rect data-box-id="b6" x="700" y="346" width="220" height="56" rx="10" fill="rgba(135,191,159,0.12)" stroke="#87bf9f" stroke-width="1.5"/><text x="716" y="367.4" font-size="16" font-weight="600" fill="#87bf9f" text-anchor="start" data-box="b6"><tspan x="716" dy="0">Researcher 已处理</tspan></text><text x="716" y="394.6" font-size="16" font-weight="400" fill="#858a91" text-anchor="start" data-box="b6"><tspan x="716" dy="0">msg-01</tspan></text><rect data-box-id="b7" x="700" y="414" width="220" height="56" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="716" y="435.4" font-size="16" font-weight="600" fill="#f2f3f4" text-anchor="start" data-box="b7"><tspan x="716" dy="0">Planner 当前计划</tspan></text><text x="716" y="462.6" font-size="16" font-weight="400" fill="#858a91" text-anchor="start" data-box="b7"><tspan x="716" dy="0">v5</tspan></text></g><g data-aj-frame="2" display="none"><path d="M120,196 L600,196" fill="none" stroke="#c1d4c8" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><text x="245" y="186" font-size="16" font-weight="400" fill="#c1d4c8" text-anchor="middle"><tspan x="245" dy="0">task.requested · msg-01</tspan></text><path d="M600,246 L120,246" fill="none" stroke="#92b6cf" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#m-info)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><text x="245" y="236" font-size="16" font-weight="400" fill="#92b6cf" text-anchor="middle"><tspan x="245" dy="0">received：只代表收到</tspan></text><rect data-box-id="b8" x="700" y="346" width="220" height="56" rx="10" fill="rgba(135,191,159,0.12)" stroke="#87bf9f" stroke-width="1.5"/><text x="716" y="367.4" font-size="16" font-weight="600" fill="#87bf9f" text-anchor="start" data-box="b8"><tspan x="716" dy="0">Researcher 已处理</tspan></text><text x="716" y="394.6" font-size="16" font-weight="400" fill="#858a91" text-anchor="start" data-box="b8"><tspan x="716" dy="0">msg-01</tspan></text><rect data-box-id="b9" x="700" y="414" width="220" height="56" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><text x="716" y="435.4" font-size="16" font-weight="600" fill="#f2f3f4" text-anchor="start" data-box="b9"><tspan x="716" dy="0">Planner 当前计划</tspan></text><text x="716" y="462.6" font-size="16" font-weight="400" fill="#858a91" text-anchor="start" data-box="b9"><tspan x="716" dy="0">v5</tspan></text></g><g data-aj-frame="3" display="none"><path d="M120,196 L600,196" fill="none" stroke="#c1d4c8" stroke-width="1.7" marker-end="url(#m-accent)" stroke-linejoin="round" data-aj-arrow="1"/><text x="245" y="186" font-size="16" font-weight="400" fill="#c1d4c8" text-anchor="middle"><tspan x="245" dy="0">task.requested · msg-01</tspan></text><path d="M600,246 L120,246" fill="none" stroke="#92b6cf" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#m-info)" stroke-linejoin="round" data-aj-arrow="1"/><text x="245" y="236" font-size="16" font-weight="400" fill="#92b6cf" text-anchor="middle"><tspan x="245" dy="0">received：只代表收到</tspan></text><path d="M370,296 L600,296" fill="none" stroke="#e99497" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#m-bad)" stroke-linejoin="round" data-aj-arrow="1" data-aj-flow="1"/><text x="485" y="286" font-size="16" font-weight="400" fill="#e99497" text-anchor="middle"><tspan x="4