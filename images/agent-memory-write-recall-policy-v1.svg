<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Agent 记忆写入与召回策略</title>
  <desc id="desc">请求和运行上下文经过写入门，按用途进入事实、证据或检查点存储；召回时先授权、排序与分配预算，冲突和低置信内容进入隔离区。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B"/>
    </marker>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0F172A}.label{font:650 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0F172A}.small{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.tiny{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748B}.line{stroke:#64748B;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#DC2626;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#F8FAFC"/>
  <text x="56" y="60" class="title">Agent 记忆：先决定是否写，再决定如何召回</text>
  <text x="56" y="91" class="small">会话状态、长期事实与原始证据承担不同职责；相似度不能替代写入策略和授权。</text>

  <rect x="54" y="168" width="180" height="124" rx="18" fill="#EAF2FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="144" y="212" text-anchor="middle" class="label">请求 / Run</text>
  <text x="144" y="242" text-anchor="middle" class="small">目标 · 最近消息</text>
  <text x="144" y="266" text-anchor="middle" class="small">工具结果 · 计划</text>

  <rect x="300" y="145" width="218" height="170" rx="20" fill="#FFF3D6" stroke="#D97706" stroke-width="2"/>
  <text x="409" y="184" text-anchor="middle" class="label">写入门 Write Gate</text>
  <text x="409" y="217" text-anchor="middle" class="small">用途与同意</text>
  <text x="409" y="242" text-anchor="middle" class="small">语义匹配与去重</text>
  <text x="409" y="267" text-anchor="middle" class="small">来源 · 置信度 · TTL</text>
  <text x="409" y="292" text-anchor="middle" class="small">冲突与权限检查</text>

  <rect x="592" y="112" width="200" height="102" rx="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="692" y="151" text-anchor="middle" class="label">Markdown 事实</text>
  <text x="692" y="179" text-anchor="middle" class="small">少量、稳定、可审阅</text>
  <text x="692" y="200" text-anchor="middle" class="tiny">版本 + 来源引用</text>

  <rect x="592" y="239" width="200" height="102" rx="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="692" y="278" text-anchor="middle" class="label">RAG 证据库</text>
  <text x="692" y="306" text-anchor="middle" class="small">大规模、动态检索</text>
  <text x="692" y="327" text-anchor="middle" class="tiny">正文 + 元数据 + ACL</text>

  <rect x="592" y="366" width="200" height="102" rx="18" fill="#EAF2FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="692" y="405" text-anchor="middle" class="label">会话 Checkpoint</text>
  <text x="692" y="433" text-anchor="middle" class="small">当前任务可恢复状态</text>
  <text x="692" y="454" text-anchor="middle" class="tiny">run / step / operation</text>

  <rect x="876" y="166" width="254" height="164" rx="20" fill="#E8F7EE" stroke="#16A34A" stroke-width="2"/>
  <text x="1003" y="207" text-anchor="middle" class="label">召回与上下文组装</text>
  <text x="1003" y="240" text-anchor="middle" class="small">1. tenant / subject 授权</text>
  <text x="1003" y="266" text-anchor="middle" class="small">2. 相关性 · 时效 · 可信度</text>
  <text x="1003" y="292" text-anchor="middle" class="small">3. 去重、预算与引用</text>

  <rect x="876" y="390" width="254" height="108" rx="18" fill="#EAF2FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="1003" y="431" text-anchor="middle" class="label">可验证回答 / 动作</text>
  <text x="1003" y="462" text-anchor="middle" class="small">使用 record ID 与 sourceRefs</text>

  <rect x="300" y="472" width="218" height="102" rx="18" fill="#FFECEF" stroke="#DC2626" stroke-width="2"/>
  <text x="409" y="513" text-anchor="middle" class="label">隔离 / 待复核</text>
  <text x="409" y="543" text-anchor="middle" class="small">冲突 · 低置信 · 敏感</text>

  <path d="M234 230 H300" class="line"/>
  <path d="M518 190 C548 190 552 163 592 163" class="line"/>
  <path d="M518 230 H592" class="line"/>
  <path d="M518 270 C548 270 552 417 592 417" class="line"/>
  <path d="M792 163 C830 163 838 218 876 218" class="line"/>
  <path d="M792 290 H876" class="line"/>
  <path d="M792 417 C830 417 838 292 876 292" class="line"/>
  <path d="M1003 330 V390" class="line"/>
  <path d="M409 315 V472" class="dash"/>
  <path d="M518 523 C770 610 1040 586 1003 498" class="dash"/>

  <rect x="54" y="608" width="1076" height="42" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="80" cy="629" r="6" fill="#3B82F6"/><text x="94" y="635" class="tiny">运行状态</text>
  <circle cx="205" cy="629" r="6" fill="#7C3AED"/><text x="219" y="635" class="tiny">持久知识 / 证据</text>
  <circle cx="380" cy="629" r="6" fill="#16A34A"/><text x="394" y="635" class="tiny">通过策略门</text>
  <circle cx="524" cy="629" r="6" fill="#DC2626"/><text x="538" y="635" class="tiny">拒绝自动写入或使用</text>
</svg>
