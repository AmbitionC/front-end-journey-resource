<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" data-theme="dark" data-aj-steps="6" data-aj-mode="frames"><defs><marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.30)"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c1d4c8"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#87bf9f"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e99497"/></marker><marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6b36a"/></marker><marker id="m-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92b6cf"/></marker><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#858a91"/></marker></defs><desc data-aj-caption="1">主模块执行 fs.readFile：读文件交给 libuv 线程池，主线程不等，直接进入事件循环</desc><desc data-aj-caption="2">循环转到 poll 阶段等 I/O：线程池读完了，把回调交回 poll 执行。回调里注册了 C、D、E、F 四件事</desc><desc data-aj-caption="3">poll 阶段的回调跑完，进下一个阶段之前先清微任务：nextTick 的 E 优先，然后才是 Promise 的 F</desc><desc data-aj-caption="4">接着就是 check 阶段，执行 setImmediate 的 D</desc><desc data-aj-caption="5">close callbacks 没事做，本轮结束；下一轮从 timers 开始，C 这才执行</desc><desc data-aj-caption="6">所以在 I/O 回调里，setImmediate 一定先于 setTimeout(0)：poll 之后紧跟着就是 check，timers 要等下一轮</desc><rect width="960" height="720" rx="14" fill="#111214"/><text x="40" y="50" font-size="24" font-weight="600" fill="#f2f3f4" text-anchor="start"><tspan x="40" dy="0">Node.js 事件循环：六个阶段，阶段之间清微任务</tspan></text><text x="40" y="80" font-size="16" font-weight="400" fill="#858a91" text-anchor="start"><tspan x="40" dy="0">左边是一轮循环的顺序；右边跟着一段代码走一遍，看输出顺序怎么来的</tspan></text><rect data-panel="1" data-box-id="p7" x="430" y="140" width="490" height="198" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><rect data-panel="1" data-box-id="p8" x="430" y="352" width="490" height="104" rx="10" fill="#191b1d" stroke="rgba(255,255,255,0.30)" stroke-width="1.5"/><rect data-box-id="b1" x="40" y="140" width="300" height="64" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="190" y="165.8" font-size="17" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b1"><tspan x="190" dy="0">timers</tspan></text><text x="190" y="193.3" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b1"><tspan x="190" dy="0">到期的 setTimeout / setInterval</tspan></text><path d="M190,204 L190,220" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><circle cx="190" cy="212" r="5" fill="#c1d4c8"/><rect data-box-id="b2" x="40" y="220" width="300" height="64" rx="10" fill="rgba(133,138,145,0.12)" stroke="#858a91" stroke-width="1.5"/><text x="190" y="245.8" font-size="17" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b2"><tspan x="190" dy="0">pending callbacks</tspan></text><text x="190" y="273.3" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b2"><tspan x="190" dy="0">上一轮推迟的 I/O 错误回调</tspan></text><path d="M190,284 L190,300" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><circle cx="190" cy="292" r="5" fill="#c1d4c8"/><rect data-box-id="b3" x="40" y="300" width="300" height="64" rx="10" fill="rgba(133,138,145,0.12)" stroke="#858a91" stroke-width="1.5"/><text x="190" y="325.8" font-size="17" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b3"><tspan x="190" dy="0">idle / prepare</tspan></text><text x="190" y="353.3" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b3"><tspan x="190" dy="0">libuv 内部用，用户代码不在这</tspan></text><path d="M190,364 L190,380" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><circle cx="190" cy="372" r="5" fill="#c1d4c8"/><rect data-box-id="b4" x="40" y="380" width="300" height="64" rx="10" fill="#222527" stroke="#87bf9f" stroke-width="1.5"/><text x="190" y="405.8" font-size="17" font-weight="600" fill="#87bf9f" text-anchor="middle" data-box="b4"><tspan x="190" dy="0">poll</tspan></text><text x="190" y="433.3" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b4"><tspan x="190" dy="0">取新 I/O 事件并执行回调；空了就等</tspan></text><path d="M190,444 L190,460" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><circle cx="190" cy="452" r="5" fill="#c1d4c8"/><rect data-box-id="b5" x="40" y="460" width="300" height="64" rx="10" fill="rgba(214,179,106,0.12)" stroke="#d6b36a" stroke-width="1.5"/><text x="190" y="485.8" font-size="17" font-weight="600" fill="#d6b36a" text-anchor="middle" data-box="b5"><tspan x="190" dy="0">check</tspan></text><text x="190" y="513.3" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b5"><tspan x="190" dy="0">setImmediate 回调</tspan></text><path d="M190,524 L190,540" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><circle cx="190" cy="532" r="5" fill="#c1d4c8"/><rect data-box-id="b6" x="40" y="540" width="300" height="64" rx="10" fill="rgba(133,138,145,0.12)" stroke="#858a91" stroke-width="1.5"/><text x="190" y="565.8" font-size="17" font-weight="600" fill="#858a91" text-anchor="middle" data-box="b6"><tspan x="190" dy="0">close callbacks</tspan></text><text x="190" y="593.3" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b6"><tspan x="190" dy="0">socket close 等关闭回调</tspan></text><path d="M340,572 L366,572 L366,172 L340,172" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.7" marker-end="url(#m-line)" stroke-linejoin="round" data-aj-arrow="1"/><text x="376" y="330" font-size="15" font-weight="400" fill="#858a91" text-anchor="start"><tspan x="376" dy="0">下一轮</tspan></text><text x="444" y="166" font-size="16" font-weight="400" fill="#858a91" text-anchor="start" data-box="p7"><tspan x="444" dy="0">代码</tspan></text><text x="456" y="191" font-size="15" font-weight="400" fill="#f2f3f4" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="456" dy="0">fs.readFile('a.txt', () =&gt; {</tspan></text><text x="456" y="217" font-size="15" font-weight="400" fill="#f2f3f4" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="456" dy="0">  setTimeout(() =&gt; log('C'), 0)</tspan></text><text x="456" y="243" font-size="15" font-weight="400" fill="#f2f3f4" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="456" dy="0">  setImmediate(() =&gt; log('D'))</tspan></text><text x="456" y="269" font-size="15" font-weight="400" fill="#f2f3f4" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="456" dy="0">  process.nextTick(() =&gt; log('E'))</tspan></text><text x="456" y="295" font-size="15" font-weight="400" fill="#f2f3f4" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="456" dy="0">  Promise.resolve().then(() =&gt; log('F'))</tspan></text><text x="456" y="321" font-size="15" font-weight="400" fill="#f2f3f4" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="456" dy="0">})</tspan></text><text x="444" y="378" font-size="16" font-weight="400" fill="#858a91" text-anchor="start" data-box="p8"><tspan x="444" dy="0">输出</tspan></text><text x="430" y="574" font-size="15" font-weight="400" fill="#c1d4c8" text-anchor="start"><tspan x="430" dy="0">● 圆点：每个阶段结束后先清 nextTick，再清 Promise</tspan></text><rect data-box-id="n9" x="40" y="630" width="880" height="52" rx="10" fill="rgba(193,212,200,0.12)"/><text x="60" y="662" font-size="17" fill="#b2b5b9" data-box="n9"><tspan font-weight="600" fill="#f2f3f4">顺序陷阱：</tspan>主模块顶层 setTimeout(0) 与 setImmediate 先后不定；在 I/O 回调里 setImmediate 一定先。</text><g data-aj-frame="1"><g data-aj-key="code"><rect x="446" y="171" width="460" height="28" rx="10" fill="none" stroke="#92b6cf" stroke-width="3.2"/></g><text x="450" y="410" font-size="19" font-weight="600" fill="#858a91" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="450" dy="0">（还没有输出）</tspan></text><text x="450" y="438" font-size="15" font-weight="400" fill="#b2b5b9" text-anchor="start"><tspan x="450" dy="0">各队列都是空的</tspan></text><rect data-box-id="b10" x="430" y="470" width="490" height="72" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="675" y="499.8" font-size="17" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b10"><tspan x="675" dy="0">libuv 线程池</tspan></text><text x="675" y="527.3" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b10"><tspan x="675" dy="0">读 a.txt 中…</tspan></text></g><g data-aj-frame="2" display="none"><g data-aj-key="cur"><rect x="40" y="380" width="300" height="64" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><g data-aj-key="code"><rect x="446" y="197" width="460" height="106" rx="10" fill="none" stroke="#92b6cf" stroke-width="3.2"/></g><text x="450" y="410" font-size="19" font-weight="600" fill="#858a91" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="450" dy="0">（还没有输出）</tspan></text><text x="450" y="438" font-size="15" font-weight="400" fill="#b2b5b9" text-anchor="start"><tspan x="450" dy="0">timers: C　check: D　nextTick: E　Promise: F</tspan></text><rect data-box-id="b11" x="430" y="470" width="490" height="72" rx="10" fill="rgba(135,191,159,0.12)" stroke="#87bf9f" stroke-width="1.5"/><text x="675" y="499.8" font-size="17" font-weight="600" fill="#87bf9f" text-anchor="middle" data-box="b11"><tspan x="675" dy="0">libuv 线程池</tspan></text><text x="675" y="527.3" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b11"><tspan x="675" dy="0">读完 → 回调交回 poll</tspan></text></g><g data-aj-frame="3" display="none"><g data-aj-key="cur"><circle cx="190" cy="452" r="10" fill="none" stroke="#d6b36a" stroke-width="3"/></g><text x="450" y="410" font-size="19" font-weight="600" fill="#87bf9f" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="450" dy="0">E F</tspan></text><text x="450" y="438" font-size="15" font-weight="400" fill="#b2b5b9" text-anchor="start"><tspan x="450" dy="0">timers: C　check: D</tspan></text><rect data-box-id="b12" x="430" y="470" width="490" height="72" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="675" y="499.8" font-size="17" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b12"><tspan x="675" dy="0">libuv 线程池</tspan></text><text x="675" y="527.3" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b12"><tspan x="675" dy="0">空闲</tspan></text></g><g data-aj-frame="4" display="none"><g data-aj-key="cur"><rect x="40" y="460" width="300" height="64" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><text x="450" y="410" font-size="19" font-weight="600" fill="#87bf9f" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="450" dy="0">E F D</tspan></text><text x="450" y="438" font-size="15" font-weight="400" fill="#b2b5b9" text-anchor="start"><tspan x="450" dy="0">timers: C</tspan></text><rect data-box-id="b13" x="430" y="470" width="490" height="72" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="675" y="499.8" font-size="17" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b13"><tspan x="675" dy="0">libuv 线程池</tspan></text><text x="675" y="527.3" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b13"><tspan x="675" dy="0">空闲</tspan></text></g><g data-aj-frame="5" display="none"><g data-aj-key="cur"><rect x="40" y="140" width="300" height="64" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><text x="450" y="410" font-size="19" font-weight="600" fill="#87bf9f" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="450" dy="0">E F D C</tspan></text><text x="450" y="438" font-size="15" font-weight="400" fill="#b2b5b9" text-anchor="start"><tspan x="450" dy="0">各队列都空了</tspan></text><rect data-box-id="b14" x="430" y="470" width="490" height="72" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="675" y="499.8" font-size="17" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b14"><tspan x="675" dy="0">libuv 线程池</tspan></text><text x="675" y="527.3" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b14"><tspan x="675" dy="0">空闲</tspan></text></g><g data-aj-frame="6" display="none"><g data-aj-key="cur"><rect x="40" y="460" width="300" height="64" rx="10" fill="none" stroke="#d6b36a" stroke-width="3.2"/></g><g data-aj-key="code"><rect x="446" y="197" width="460" height="54" rx="10" fill="none" stroke="#87bf9f" stroke-width="3.2"/></g><text x="450" y="410" font-size="19" font-weight="600" fill="#87bf9f" text-anchor="start" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Noto Sans SC',monospace"><tspan x="450" dy="0">E F D C</tspan></text><text x="450" y="438" font-size="15" font-weight="400" fill="#b2b5b9" text-anchor="start"><tspan x="450" dy="0">D 在 C 前面</tspan></text><rect data-box-id="b15" x="430" y="470" width="490" height="72" rx="10" fill="rgba(146,182,207,0.12)" stroke="#92b6cf" stroke-width="1.5"/><text x="675" y="499.8" font-size="17" font-weight="600" fill="#92b6cf" text-anchor="middle" data-box="b15"><tspan x="675" dy="0">libuv 线程池</tspan></text><text x="675" y="527.3" font-size="16" font-weight="400" fill="#858a91" text-anchor="middle" data-box="b15"><tspan x="675" dy="0">空闲</tspan></text></g></svg>