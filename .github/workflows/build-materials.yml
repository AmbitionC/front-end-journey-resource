name: Build member material PDFs

# 知识点内容变更时，按一级分类重建会员资料 PDF 并以私有 ACL 上传 OSS。
# 内容编辑经 manager→faas 写回本仓 knowledge/**，push 即触发＝「知识点更新自动重建对应 PDF」。
on:
  push:
    branches: [master, main]
    paths:
      - 'knowledge/**'
      - 'images/**'
      - 'scripts/build-materials.mjs'
      - 'scripts/pdf-static-images.mjs'
      - 'scripts/*release*.mjs'
      - 'scripts/content-review.mjs'
      - 'scripts/resource-paths.mjs'
      - 'scripts/public-interview-contract.mjs'
      - 'scripts/validate-tree.mjs'
      - 'scripts/interview-source-history.mjs'
      - 'scripts/validate-private-interview-history.mjs'
      - 'scripts/sync-content-batches.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-materials.yml'
      - '.github/workflows/sync.yml'
  workflow_dispatch: {}

concurrency:
  group: build-materials
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 中文字体：PDF 渲染 CJK 必需
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji
          sudo fc-cache -f

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Require final review and successful sync of same commit
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ]; then BEFORE=$(git rev-parse HEAD^1); fi
          node scripts/validate-release.mjs --ci "$BEFORE" "$AFTER" --wait-sync

      # puppeteer v24 自带 Chromium 下载；确保可用
      - name: Ensure Chromium
        run: npx puppeteer browsers install chrome

      - name: Build & upload material PDFs
        env:
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          RELEASE_BEFORE_SHA: ${{ github.event.before }}
          RELEASE_AFTER_SHA: ${{ github.sha }}
        run: npm run build:materials

      - name: Upload artifacts (调试留档)
        uses: actions/upload-artifact@v4
        with:
          name: material-pdfs
          path: |
            dist/materials/*.pdf
            dist/materials/*.json
          if-no-files-found: warn
          retention-days: 7
